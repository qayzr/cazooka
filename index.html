let _modalKeyHandler = null;

function buildCardBodyHtml(card, showDesc=true) {
  const tm = TYPE_META[card.type];
  let body = showDesc ? `<div class="cv-desc">${card.description}</div>` : '';
  if (card.type === 'cat_breed') {
    const stats = card.data.stats;
    const allStatKeys = ['strength','speed','agility','stamina','intelligence','stealth','loyalty','affection','amicability','weight'];
    body += `<div class="cv-stats-grid">` +
      allStatKeys.filter(k => stats[k] !== undefined).map(k => {
        const v = stats[k]; const pct = ((v-1)/99)*100;
        return `<div class="cvs"><span class="cvs-n">${k.slice(0,3)}</span><div class="cvs-bar"><div class="cvs-fill" style="width:${pct}%"></div></div><span class="cvs-v">${v}</span></div>`;
      }).join('') + `</div>`;
    body += `<div class="cv-subtext" style="color:var(--t3)">◈ Carry slots: ${card.data.base_inventory_slots}</div>`;
    const hdt = card.data.home_dev_traits;
    if (hdt) {
      let hdtStr = hdt.label;
      if (hdt.multiplier && hdt.multiplier !== 1.0) {
        const pct = Math.round((hdt.multiplier-1)*100);
        hdtStr += ` · ${pct > 0 ? '+' : ''}${pct}% home dev rate`;
      }
      body += `<div class="cv-subtext" style="color:#a78bfa;margin-top:2px">${hdtStr}</div>`;
    }
    if (card.npc) {
      body += `<div class="cv-subtext" style="color:#34d399;margin-top:2px">NPC ally · not ownable</div>`;
      if (card.data && card.data.market_discount) {
        body += `<div class="cv-subtext" style="color:var(--acc2);margin-top:2px">${Math.round(card.data.market_discount * 100)}% marketplace discount while allied</div>`;
      }
    }
  } else if (card.type === 'home') {
    body += `<div class="cv-hchips">
      <span class="cv-hchip">${card.data.max_occupants} cats</span>
      <span class="cv-hchip">${card.data.expansion_slots} item slots</span>
      <span class="cv-hchip">×${card.data.comfort_multiplier} comfort</span>
      <span class="cv-hchip">${card.data.training_tier}</span>
    </div>`;
  } else if (card.type === 'home_item') {
    // Show development rates instead of instant effects
    const devChips = devRateChips(card);
    if (devChips) {
      body += `<div style="font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-bottom:3px">Development / 24h</div>`;
      body += `<div class="cv-effs">${devChips}</div>`;
    }
    body += `<div class="cv-subtext" style="color:var(--t3)">passive · permanent stat growth</div>`;
  } else if (card.type === 'consumable') {
    const effects = formatConsumableEffects(card).map(e => `<span class="cv-eff pos">${e}</span>`).join('');
    const uses = getConsumableUses(card);
    body += `<div class="cv-effs">${effects}</div>`;
    body += `<div class="cv-subtext" style="color:var(--t3)">${card.data.consumable_type} · expires after ${card.data.max_uses || 1} use${(card.data.max_uses || 1) === 1 ? '' : 's'}${uses ? ` · ${uses} left` : ''}</div>`;
  } else {
    const effs = getEffects(card);
    if (effs.length) {
      body += `<div class="cv-effs">` + effs.map(e => {
        const v = parseModifier(e.modifier);
        return `<span class="cv-eff ${v>=0?'pos':'neg'}">${e.stat} ${v>=0?'+':''}${v}</span>`;
      }).join('') + `</div>`;
    }
    if (card.type === 'cat_breed') {
      const hdt = card.data.home_dev_traits;
      if (hdt) {
        body += `<div class="cv-subtext" style="color:#a78bfa;margin-top:4px">${hdt.label}`;
        if (hdt.multiplier && hdt.multiplier !== 1.0) {
          body += ` · ${hdt.multiplier > 1 ? '+' : ''}${Math.round((hdt.multiplier-1)*100)}% dev rate`;
        }
        body += `</div>`;
      }
    } else if (card.type === 'battle_gear') {
      body += `<div class="cv-subtext" style="color:var(--t3)">Gear slot: ${card.data.gear_slot}${card.data.special_properties?' · '+card.data.special_properties.replace(/_/g,' '):''}`;
      if (card.data.expiry?.type !== 'none') body += ` · expires ${card.data.expiry.value} rounds`;
      body += `</div>`;
      if (card.data.home_dev_effect) {
        const hde = card.data.home_dev_effect;
        const mulStr = hde.multiplier ? ` · ×${hde.multiplier} all dev` : '';
        body += `<div class="cv-subtext" style="color:#a78bfa;margin-top:2px">${hde.label}${mulStr}</div>`;
      }
    } else if (card.type === 'special_ability') {
      body += `<div class="cv-subtext" style="color:var(--t3)">${card.data.memory_slots_required} memory slot${card.data.memory_slots_required>1?'s':''} · min INT+LOY ${card.data.min_intelligence_plus_loyalty}</div>`;
      const abilityEffects = getAbilityEffects(card);
      if (abilityEffects.length) {
        body += `<div class="cv-effs">${abilityEffects.map(e => `<span class="cv-eff pos" title="${escapeAttr(abilityFullText(e))}">${abilityShortText(e)}</span>`).join('')}</div>`;
      } else if (card.data.positive_description) {
        body += `<div class="cv-subtext" style="color:#34D399;font-size:10px">${card.data.positive_description}</div>`;
      }
      if (card.data.negative_description) body += `<div class="cv-subtext" style="color:#F87171;font-size:10px">${card.data.negative_description}</div>`;
    }
  }
  if (card.is_limited) {
    const mySerial = PLAYER && PLAYER.cardSerials && PLAYER.cardSerials[card.id];
    body += mySerial
      ? `<div class="cv-subtext" style="color:var(--acc);margin-top:2px">Limited Edition — #${mySerial}/${card.edition_size || '?'}</div>`
      : `<div class="cv-subtext" style="color:var(--acc);margin-top:2px">Limited Edition (${card.edition_size || '?'})</div>`;
  }
  return body;
}

/* Shared `.cv` card face — used by the library grid, the lightbox modal,
   and the sandbox detail panel. `card.art` (set via the admin Card
   Studio) drives full-art vs inset rendering; keep this in sync with the
   twin implementation in admin.html's live preview if either changes. */
/* Per-component background/text-color overrides (art.components.{header,
   body,footer}). Text-color works by overriding the CSS custom properties
   that a component's default-colored text already reads (--t1/--t2/--t3/
   --acc2), so it cascades to the card name, description, stat labels,
   cost, etc. — but NOT the intentionally-semantic colors (rarity pill,
   type label, growth-trait purple, limited-edition amber, ability
   positive/negative), which are hardcoded or keyed off --cv-c/--cv-r on
   purpose and stay put regardless of this override. */
function hexToRgba(hex, opacityPct) {
  const h = (hex || '#000000').replace('#', '');
  const r = parseInt(h.substring(0,2), 16) || 0;
  const g = parseInt(h.substring(2,4), 16) || 0;
  const b = parseInt(h.substring(4,6), 16) || 0;
  return `rgba(${r},${g},${b},${(opacityPct != null ? opacityPct : 55) / 100})`;
}
function componentStyle(art, comp) {
  const c = (art.components && art.components[comp]) || {};
  const parts = [];
  if (c.bgEnabled) parts.push(`background:${hexToRgba(c.bgColor, c.bgOpacity)}`);
  if (c.textColor) parts.push(`--t1:${c.textColor};--t2:${c.textColor};--t3:${c.textColor};--acc2:${c.textColor}`);
  return parts.join(';');
}

function buildCardFaceHtml(card, opts = {}) {
  const {
    cssClass = 'cv',
    onclick = null,
    showSeries = true,
    showStarterPill = true,
    showDesc = true,
    // Draft/reveal show every card at a fraction of real size, where a
    // per-card bodyOffset/component color tuned for the full 420px card can
    // shove text off-screen or unreadable. standardLayout keeps the art
    // (image, position, zoom, tint) exactly as configured but ignores those
    // text-layout overrides so name/stats/cost always sit in the same place.
    standardLayout = false,
  } = opts;

  const tm = TYPE_META[card.type];
  const rc = RAR_COLOR[card.rarity] || 'var(--t3)';
  const body = buildCardBodyHtml(card, showDesc);
  const art = card.art || {};
  const layoutArt = standardLayout ? {} : art;
  const isFull = art.mode === 'full' && !!card.image_url;
  const clickAttr = onclick ? ` onclick="${onclick}"` : '';

  let artLayers = '';
  let artBoxHtml = `<div class="cv-art">${cardArtHTML(card, tm)}</div>`;

  if (isFull) {
    const pos = art.position || { x: 50, y: 50 };
    const zoom = art.zoom || 1;
    artLayers = `<div class="cv-full-art-img" style="background-image:url('${card.image_url}');background-position:${pos.x}% ${pos.y}%;background-size:${Math.round(zoom*100)}%"></div>`;
    if (art.overlay && art.overlay.enabled) {
      const op = (art.overlay.opacity != null ? art.overlay.opacity : 40) / 100;
      artLayers += `<div class="cv-full-art-tint" style="background:${art.overlay.color || '#000000'};opacity:${op}"></div>`;
    }
    artBoxHtml = '';
  }

  const bodyStyle = [componentStyle(layoutArt, 'body'), layoutArt.bodyOffset ? `transform:translateY(${Math.round(layoutArt.bodyOffset/100*140)}px)` : ''].filter(Boolean).join(';');

  return `<div class="${cssClass}${isFull ? ' art-full' : ''}" style="--cv-c:${tm.color};--cv-r:${rc}"${clickAttr}>
    ${artLayers}
    <div class="cv-hdr" style="${componentStyle(layoutArt, 'header')}">
      <div class="cv-trow">
        <div class="cv-tdot"></div>
        <span class="cv-tlbl">${tm.label}</span>
        <span class="cv-rpill">${card.rarity}</span>
      </div>
      <div class="cv-name">${card.name}</div>
      ${showSeries && card.series ? `<div class="cv-series">${card.series}</div>` : ''}
    </div>
    ${artBoxHtml}
    <div class="cv-body" style="${bodyStyle}">${body}</div>
    <div class="cv-foot" style="${componentStyle(layoutArt, 'footer')}">
      <span class="cv-cost">${card.coin_cost > 0 ? '◈ '+card.coin_cost : 'Free'}</span>
      ${showStarterPill && card.is_starter ? '<span class="cv-startpill">Starter</span>' : ''}
    </div>
  </div>`;
}

function buildModalCardHtml(card, opts = {}) {

  if (opts.peekOnly) return buildCardFaceHtml(card, { cssClass: 'cv cmo-cv' });
  return `
    ${buildCardFaceHtml(card, { cssClass: 'cv cmo-cv' })}

function openCardModal(cardId, opts = {}) {
  const card = getCard(cardId);
  if (!card) return;
  const modal = document.getElementById('card-modal');
  const closeBtn = opts.peekOnly ? `<button class="cmo-peek-close" onclick="closeCardModal()" aria-label="Close">✕</button>` : '';

function ncmCollectAbilityEffectFromRow(row) {
  return {
    trigger: row.querySelector('.ae-trigger').value,
    effect_type: row.querySelector('.ae-type').value,
    chance_percent: parseInt(row.querySelector('.ae-chance').value) || 0,
    value: parseInt(row.querySelector('.ae-value').value) || 0,
    limit: row.querySelector('.ae-limit').value,
    short_text: row.querySelector('.ae-short').value.trim(),
    full_text: row.querySelector('.ae-full').value.trim(),
  };
}

function ncmRefreshAbilityEffectRow(input, resetForType = false) {
  const row = input.closest('.ncm-ability-effect-row');
  if (!row) return;
  const type = row.querySelector('.ae-type').value;
  const def = ABILITY_EFFECT_DEFS[type] || ABILITY_EFFECT_DEFS.crit_chance;
  if (resetForType) row.querySelector('.ae-trigger').value = def.trigger;
  const draft = ncmCollectAbilityEffectFromRow(row);
  if (resetForType || !row.querySelector('.ae-short').value.trim()) row.querySelector('.ae-short').value = abilityShortText(draft);
  if (resetForType || !row.querySelector('.ae-full').value.trim()) row.querySelector('.ae-full').value = abilityFullText(draft);
}

function ncmCollectAbilityEffects() {
  return Array.from(document.querySelectorAll('#ncm-ability-effects-list .ncm-ability-effect-row'))
    .map(ncmCollectAbilityEffectFromRow)
    .filter(e => e.effect_type);
}

function commitCardEdit(cardId) {
  const name = (document.getElementById('eful-name')?.value || document.getElementById('cep-name')?.value || '').trim();
  const description = document.getElementById('eful-desc')?.value || document.getElementById('cep-desc')?.value || '';
  const coin_cost = parseInt((document.getElementById('eful-cost') || document.getElementById('cep-cost'))?.value || '0');
  const rarity = (document.getElementById('eful-rarity') || document.getElementById('cep-rarity'))?.value || 'common';
  const series = (document.getElementById('eful-series')?.value || '').trim() || null;
  const card = getCard(cardId);
  if (!card) return;
  const patch = { name, description, coin_cost, rarity, series, type: card.type };
  /* stats */
  const statInputs = document.querySelectorAll('[data-stat]');
  if (statInputs.length) {
    patch.data = { stats: {} };
    statInputs.forEach(inp => { patch.data.stats[inp.dataset.stat] = parseInt(inp.value) || 1; });
    const slots = document.getElementById('eful-slots');
    if (slots) patch.data.base_inventory_slots = parseInt(slots.value) || 3;
  }
  /* home */
  const maxcats = document.getElementById('eful-maxcats');
  if (maxcats) {
    patch.data = {
      max_occupants: parseInt(maxcats.value) || 1,
      expansion_slots: parseInt(document.getElementById('eful-itemslots')?.value) || 2,
      comfort_multiplier: parseFloat(document.getElementById('eful-comfort')?.value) || 1,
      training_tier: document.getElementById('eful-tier')?.value || 'starter',
    };
  }
  /* effects */
  const statEls = document.querySelectorAll('[data-eff-stat]');
  const modEls = document.querySelectorAll('[data-eff-mod]');
  if (statEls.length || card.type === 'home_item' || card.type === 'battle_gear' || card.type === 'special_ability') {
    const effects = [];
    statEls.forEach((sel, i) => {
      const mod = modEls[i];
      if (!mod) return;
      const v = parseInt(mod.value) || 0;
      if (v !== 0) effects.push({ stat: sel.value, modifier: (v >= 0 ? '+' : '') + v });
    });
    patch.data = patch.data || {};
    if (card.type === 'special_ability') {
      patch.data.stat_buffs = effects;
      const draftCard = { ...card, name, description, data: { ...card.data, stat_buffs: effects } };
      const abilityEffects = ncmCollectAbilityEffects();
      patch.data.ability_effects = abilityEffects.length ? abilityEffects : inferAbilityEffects(draftCard);
      patch.data.expiry = { type:'none' };
    } else {
      if (card.type === 'home_item') patch.data.item_type = 'passive';
      if (card.type === 'battle_gear') patch.data.gear_slot = card.data.gear_slot || 1;
      patch.data.effects = effects;
    }
  }
  /* custom card: update in-place rather than CARD_EDITS */
  if (cardId.startsWith('custom-')) {
    const idx = CUSTOM_CARDS.findIndex(c => c.id === cardId);
    if (idx >= 0) {
      CUSTOM_CARDS[idx] = { ...CUSTOM_CARDS[idx], ...patch, data: { ...CUSTOM_CARDS[idx].data, ...patch.data } };
      try { localStorage.setItem('cz_custom_cards', JSON.stringify(CUSTOM_CARDS)); } catch(e) {}
      renderLibrary(); renderDashboard();
    }
  } else {
    saveCardEdit(cardId, patch);
  }
  openCardModal(cardId);
}

function confirmResetCard(cardId) {
  resetCardEdit(cardId);
  openCardModal(cardId);
}

function saveCustomCard(card) {
  CUSTOM_CARDS.push(card);
  try { localStorage.setItem('cz_custom_cards', JSON.stringify(CUSTOM_CARDS)); } catch(e) {}
  renderLibrary();
  renderDashboard();
}

function deleteCustomCard(id) {
  CUSTOM_CARDS = CUSTOM_CARDS.filter(c => c.id !== id);
  try { localStorage.setItem('cz_custom_cards', JSON.stringify(CUSTOM_CARDS)); } catch(e) {}
  renderLibrary();
  renderDashboard();
}

function ncmAddEffect() {
  const list = document.getElementById('ncm-effects-list');
  if (!list) return;
  const idx = _ncmEffectCount++;
  const allStats = ['strength','speed','agility','stamina','intelligence','stealth','loyalty','affection','amicability','weight'];
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:7px;align-items:center';
  row.innerHTML = `
    <select class="ncm-input" data-eff-stat="${idx}" style="flex:1">
      ${allStats.map(s => `<option value="${s}">${s}</option>`).join('')}
    </select>
    <input class="ncm-input" type="number" data-eff-mod="${idx}" placeholder="+5" style="width:70px">
    <button onclick="this.parentElement.remove()" style="font-family:var(--fm);font-size:11px;color:var(--t3);background:none;border:none;cursor:pointer;padding:0 4px">✕</button>`;
  list.appendChild(row);
}

function ncmCollectEffects() {
  const statEls = document.querySelectorAll('[data-eff-stat]');
  const modEls = document.querySelectorAll('[data-eff-mod]');
  const effects = [];
  statEls.forEach((sel, i) => {
    const mod = modEls[i];
    if (!mod) return;
    const v = parseInt(mod.value) || 0;
    if (v !== 0) effects.push({ stat: sel.value, modifier: (v >= 0 ? '+' : '') + v });
  });
  return effects;
}

function commitNewCard() {
  const name = (document.getElementById('ncm-name')?.value || '').trim();
  if (!name) { document.getElementById('ncm-name').focus(); return; }
  const description = document.getElementById('ncm-desc')?.value || '';
  const coin_cost = parseInt(document.getElementById('ncm-cost')?.value || '0');
  const rarity = document.getElementById('ncm-rarity')?.value || 'common';
  const series = (document.getElementById('ncm-series')?.value || '').trim() || null;
  const id = 'custom-' + Date.now();
  let data = {};
  if (_ncmType === 'cat_breed') {
    const statInputs = document.querySelectorAll('[data-stat]');
    const stats = {};
    statInputs.forEach(inp => { stats[inp.dataset.stat] = parseInt(inp.value) || 1; });
    data = { stats, base_inventory_slots: parseInt(document.getElementById('ncm-slots')?.value || '3') };
  } else if (_ncmType === 'home') {
    data = {
      max_occupants: parseInt(document.getElementById('ncm-maxcats')?.value || '1'),
      expansion_slots: parseInt(document.getElementById('ncm-itemslots')?.value || '2'),
      comfort_multiplier: parseFloat(document.getElementById('ncm-comfort')?.value || '1'),
      training_tier: document.getElementById('ncm-tier')?.value || 'starter',
    };
  } else if (_ncmType === 'home_item' || _ncmType === 'battle_gear') {
    data = { item_type: 'passive', effects: ncmCollectEffects() };
    if (_ncmType === 'battle_gear') { data.gear_slot = 1; delete data.item_type; }
  } else if (_ncmType === 'special_ability') {
    const stat_buffs = ncmCollectEffects();
    const draftCard = { type:'special_ability', name, description, data:{ stat_buffs } };
    const ability_effects = ncmCollectAbilityEffects();
    data = { stat_buffs, ability_effects: ability_effects.length ? ability_effects : inferAbilityEffects(draftCard), expiry: { type:'none' } };
  }
  const card = { id, type: _ncmType, name, description, rarity, coin_cost, series, is_starter: false, data };
  saveCustomCard(card);
  closeCardModal();
  // Open the new card for review
  setTimeout(() => openCardModal(id), 50);
}

function closeCardModal() {
  document.getElementById('card-modal').classList.add('hidden');
  if (_modalKeyHandler) { document.removeEventListener('keydown', _modalKeyHandler); _modalKeyHandler = null; }
}

function breedEmoji(breed) {
  const n = (breed.name || '').toLowerCase();
  if (n.includes('maine') || n.includes('coon')) return '🦁';
  if (n.includes('bengal') && (n.includes('orange') || n.includes('ruddy'))) return '🦊';
  if (n.includes('bengal')) return '🐯';
  if (n.includes('persian')) return '😺';
  if (n.includes('siamese')) return '😸';
  if (n.includes('russian')) return '🐈';
  if (n.includes('ragdoll')) return '🧸';
  if (n.includes('abyssinian')) return '🦊';
  if (n.includes('fold')) return '🙀';
  if (n.includes('oyen') || (n.includes('orange') && n.includes('street'))) return '🐱';
  return '🐱';
}

/* ══════════════════════════════════════════
   CARE STATE — real-time needs decay
══════════════════════════════════════════ */
// Base rates (per real hour)
const CARE_BASE = {
  hungerDecay:     7,   // pts/hr (full→empty in ~14h)
  moodDecay:       5,   // pts/hr (full→empty in ~20h)
  energyRecovery:  14,  // pts/hr at home awake
  energyResting:   20,  // pts/hr in rest mode
};
const CARE_MIN_ENERGY = 22; // minimum to go outside

let CAT_CARE = {};
try { CAT_CARE = JSON.parse(localStorage.getItem('cz_cat_care') || '{}'); } catch(e) {}

function saveCareStore() {
  try { localStorage.setItem('cz_cat_care', JSON.stringify(CAT_CARE)); } catch(e) {}
}

function freshCatState(breedId) {
  return { breedId, hunger:82, mood:75, energy:90, lastUpdated:Date.now(), isResting:false };
}

function getLiveCatState(ci, catSetup) {
  const key  = String(ci);
  const raw  = CAT_CARE[key];
  const bid  = catSetup.breed.id;
  if (!raw || raw.breedId !== bid) {
    const s = freshCatState(bid);
    CAT_CARE[key] = s;
    saveCareStore();
    return {...s};
  }
  const traits = getTraits(catSetup.breed);
  const now    = Date.now();
  const hrs    = Math.max(0, (now - raw.lastUpdated) / 3600000);
  if (hrs < 0.001) return {...raw};
  const eRate  = raw.isResting ? CARE_BASE.energyResting : CARE_BASE.energyRecovery;
  const updated = {
    ...raw,
    hunger:      Math.max(0,   raw.hunger - CARE_BASE.hungerDecay * traits.hunger_rate * hrs),
    mood:        Math.max(0,   raw.mood   - CARE_BASE.moodDecay   * traits.mood_rate   * hrs),
    energy:      Math.min(100, raw.energy + eRate * traits.energy_rate * hrs),
    lastUpdated: now
  };
  CAT_CARE[key] = updated;
  saveCareStore();
  return {...updated};
}

function setCatCare(ci, catSetup, patch) {
  const cur = getLiveCatState(ci, catSetup);
  const upd = {...cur, ...patch, lastUpdated: Date.now()};
  CAT_CARE[String(ci)] = upd;
  saveCareStore();
  return upd;
}

function noteGameInteraction() {
  GH_LAST_INTERACTION = Date.now();
}

function isGameHomeVisible() {
  const gh = document.getElementById('game-home');
  return !!(gh && gh.style.display !== 'none');
}

function autoSleepLowEnergyCats(reason = 'idle') {
  const cats = sbx.cats || [];
  if (!cats.length) return 0;
  let changed = 0;
  cats.forEach((cs, ci) => {
    if (!cs) return;
    const state = getLiveCatState(ci, cs);
    if (!state.isResting && state.energy <= GH_AUTO_SLEEP_ENERGY) {
      setCatCare(ci, cs, { isResting:true, autoRestReason:reason });
      changed++;
    }
  });
  return changed;
}

function checkAutoSleepCats() {
  const idleEnough = Date.now() - GH_LAST_INTERACTION >= GH_AUTO_SLEEP_IDLE_MS;
  const away = document.hidden || !document.hasFocus();
  if (!idleEnough && !away) return false;
  const changed = autoSleepLowEnergyCats(away ? 'away' : 'idle');
  if (!changed) return false;
  if (isGameHomeVisible()) renderGameHomeKeepScroll();
  return true;
}

function hasPremiumFood() {
  return (sbx.homeItems||[]).some(i => i.data && i.data.special_properties === 'premium_food');
}
function hasGroomingTool() {
  return (sbx.homeItems||[]).some(i => i.data && i.data.special_properties === 'grooming_tool');
}
function hasPlayToy() {
  return (sbx.homeItems||[]).some(i => i.data && i.data.special_properties === 'play_toy');
}

function canCatGoOutside(ci, catSetup) {
  const s = getLiveCatState(ci, catSetup);
  if (s.energy < CARE_MIN_ENERGY) {
    const traits = getTraits(catSetup.breed);
    const rate   = CARE_BASE.energyRecovery * traits.energy_rate;
    const hrs    = (CARE_MIN_ENERGY - s.energy) / rate;
    const hh = Math.floor(hrs);
    const mm = Math.floor((hrs % 1) * 60);
    return { canGo:false, reason:`Needs ${hh > 0 ? hh+'h ' : ''}${mm}m more rest` };
  }
  return { canGo:true, reason:null };
}

/* ── CARE ACTIONS ── */
function feedCat(ci) {
  const cs = sbx.cats[ci]; if (!cs) return;
  const traits = getTraits(cs.breed);
  if (traits.food_pref === 'premium' && !hasPremiumFood()) {
    showCareToast('🚫 Refused! This cat only eats Premium Catfood (item-013).');
    return;
  }
  const s    = getLiveCatState(ci, cs);
  const gain = (traits.food_pref === 'premium' || traits.food_pref === 'prefers_premium') && hasPremiumFood() ? 38 : 26;
  setCatCare(ci, cs, { hunger: Math.min(100, s.hunger + gain) });
  showCareToast('🍖 Fed! +' + gain + ' hunger');
  renderCarePanel();
}

function playCat(ci) {
  const cs = sbx.cats[ci]; if (!cs) return;
  const s  = getLiveCatState(ci, cs);
  if (s.energy < 8) { showCareToast('😴 Too tired to play right now.'); return; }
  const traits  = getTraits(cs.breed);
  const moodGain = Math.round((hasPlayToy() ? 28 : 20) * traits.play_enjoy);
  setCatCare(ci, cs, { mood: Math.min(100, s.mood + moodGain), energy: Math.max(0, s.energy - 6), isResting:false });
  showCareToast('🎾 Played! +' + moodGain + ' mood');
  renderCarePanel();
}

function groomCat(ci) {
  const cs = sbx.cats[ci]; if (!cs) return;
  const s  = getLiveCatState(ci, cs);
  const traits  = getTraits(cs.breed);
  const moodGain = Math.round((hasGroomingTool() ? 22 : 14) * traits.groom_enjoy);
  setCatCare(ci, cs, { mood: Math.min(100, s.mood + moodGain) });
  showCareToast('🪮 Groomed! +' + moodGain + ' mood');
  renderCarePanel();
}

function toggleRest(ci) {
  const cs = sbx.cats[ci]; if (!cs) return;
  const s  = getLiveCatState(ci, cs);
  setCatCare(ci, cs, { isResting: !s.isResting });
  renderCarePanel();
  updateSendOutsideButton();
}

function advanceCareHours(hrs) {
  sbx.cats.forEach((cs, ci) => {
    const s = getLiveCatState(ci, cs);
    CAT_CARE[String(ci)] = {...s, lastUpdated: s.lastUpdated - hrs * 3600000};
  });
  saveCareStore();
  renderCarePanel();
  updateSendOutsideButton();
  showCareToast('⏩ Advanced ' + hrs + ' real hour' + (hrs !== 1 ? 's' : ''));
}

let _careToastTimer = null;
function showCareToast(msg) {
  let el = document.getElementById('care-toast-el');
  if (!el) {
    el = document.createElement('div');
    el.id = 'care-toast-el';
    el.className = 'care-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  if (_careToastTimer) clearTimeout(_careToastTimer);
  _careToastTimer = setTimeout(() => { if (el) el.style.opacity = '0'; }, 2400);
}

function needColor(pct) {
  if (pct > 65) return '#34D399';
  if (pct > 35) return 'var(--acc2)';
  return '#F87171';
}

function energyStatusHtml(state) {
  if (state.energy >= CARE_MIN_ENERGY) {
    const cls   = state.energy > 60 ? 'ready' : 'low';
    const label = state.energy > 60 ? '✓ Ready' : '⚡ Low energy';
    return `<span class="ccc-estatus ${cls}">${label} (${Math.round(state.energy)}%)</span>`;
  }
  return `<span class="ccc-estatus tired">😴 Resting</span>`;
}

function renderCarePanel() {
  const el = document.getElementById('care-panel');
  if (!el) return;
  if (!sbx.cats.length) {
    el.innerHTML = `<div class="care-empty-state">No cats at home yet.<br>Set up your home in 🏠 Set Up Home first.</div>`;
    return;
  }
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  let html = `<div class="care-toprow">
    <span class="care-clock">⏱ Last checked: ${timeStr} &nbsp;·&nbsp; Needs decay in real time while you're away</span>
    <button class="care-fwd" onclick="advanceCareHours(1)" title="Simulate 1 hour of real time passing">⏩ +1h (debug)</button>
  </div>`;

  sbx.cats.forEach((cs, ci) => {
    const state  = getLiveCatState(ci, cs);
    const traits = getTraits(cs.breed);
    const emoji  = breedEmoji(cs.breed);
    const h = Math.round(state.hunger);
    const m = Math.round(state.mood);
    const e = Math.round(state.energy);
    const { canGo } = canCatGoOutside(ci, cs);

    const needsPremium   = traits.food_pref === 'premium'          && !hasPremiumFood();
    const prefersPremium = traits.food_pref === 'prefers_premium'  && !hasPremiumFood();

    const feedLabel    = needsPremium ? '🍖 Feed (needs premium)' : '🍖 Feed';
    const feedDisabled = (h > 88 || needsPremium) ? 'disabled' : '';
    const playDisabled = (state.energy < 8 || m > 88) ? 'disabled' : '';
    const groomDisabled= m > 92 ? 'disabled' : '';
    const restOnCls    = state.isResting ? ' on' : '';
    const restLabel    = state.isResting ? '💤 Resting (on)' : '💤 Rest Mode';

    html += `<div class="care-cat-card">
      <div class="ccc-hdr">
        <span class="ccc-avatar">${emoji}</span>
        <div class="ccc-info">
          <div class="ccc-name">${escapeAttr(getCatDisplayName(cs))}</div>
          <div class="ccc-pnote">${traits.note}</div>
        </div>
        <span class="ccc-pbadge">${traits.type}</span>
        ${energyStatusHtml(state)}
      </div>
      <div class="ccc-needs">
        <div class="need-row">
          <span class="need-lbl">Hunger</span>
          <div class="need-bar"><div class="need-fill" style="width:${h}%;background:${needColor(h)}"></div></div>
          <span class="need-pct" style="color:${needColor(h)}">${h}%${h < 20 ? ' 🚨' : ''}</span>
        </div>
        <div class="need-row">
          <span class="need-lbl">Mood</span>
          <div class="need-bar"><div class="need-fill" style="width:${m}%;background:${needColor(m)}"></div></div>
          <span class="need-pct" style="color:${needColor(m)}">${m}%${m < 20 ? ' 😾' : ''}</span>
        </div>
        <div class="need-row">
          <span class="need-lbl">Energy</span>
          <div class="need-bar"><div class="need-fill" style="width:${e}%;background:${e >= CARE_MIN_ENERGY ? needColor(e) : '#F87171'}"></div></div>
          <span class="need-pct" style="color:${e >= CARE_MIN_ENERGY ? needColor(e) : '#F87171'}">${e}%${!canGo ? ' 💤' : ''}</span>
        </div>
      </div>
      ${needsPremium   ? `<div class="ccc-food-warn">⚠ This breed only eats Premium Catfood — add item-013 to home items</div>` : ''}
      ${prefersPremium ? `<div class="ccc-food-note">★ Prefers Premium Catfood for better nutrition (+38 vs +26)</div>` : ''}
      <div class="ccc-actions">
        <button class="care-btn cb-feed" ${feedDisabled} onclick="feedCat(${ci})">${feedLabel}</button>
        <button class="care-btn cb-play" ${playDisabled} onclick="playCat(${ci})">🎾 Play</button>
        <button class="care-btn cb-groom" ${groomDisabled} onclick="groomCat(${ci})">🪮 Groom</button>
        <button class="care-btn cb-rest${restOnCls}" onclick="toggleRest(${ci})">${restLabel}</button>
      </div>
    </div>`;
  });

  el.innerHTML = html;
  updateSendOutsideButton();
}

function updateSendOutsideButton() {
  const btn = document.getElementById('btn-send-outside');
  if (!btn) return;
  if (!sbx.cats.length) {
    btn.disabled = true;
    btn.textContent = '🐾 Send Cats Outside';
    return;
  }
  const tiredCats = sbx.cats.filter((cs, ci) => !canCatGoOutside(ci, cs).canGo);
  if (tiredCats.length === sbx.cats.length) {
    btn.disabled = true;
    const { reason } = canCatGoOutside(0, sbx.cats[0]);
    btn.textContent = `😴 ${reason || 'Cats need rest'}`;
    return;
  }
  btn.disabled = false;
  const readyCount = sbx.cats.length - tiredCats.length;
  btn.textContent = tiredCats.length > 0
    ? `🐾 Send ${readyCount} Cat${readyCount !== 1 ? 's' : ''} Outside`
    : '🐾 Send Cats Outside';
}

  const lib = getLibrary();
  const byType = {
    cat_breed: lib.filter(c => c.type === 'cat_breed').length,

  const total = lib.length;
  // Stats pills

  if (statsEl) {
    const pills = [
      { n: total, l: 'Total Cards', color: 'var(--t1)' },
      { n: byType.cat_breed, l: 'Breeds', color: 'var(--col-breed)' },
      { n: byType.home, l: 'Homes', color: 'var(--col-home)' },
      { n: byType.home_item, l: 'Items', color: 'var(--col-item)' },
      { n: byType.battle_gear, l: 'Gear', color: 'var(--col-gear)' },
      { n: byType.special_ability, l: 'Abilities', color: 'var(--col-ability)' },
      { n: byType.consumable, l: 'Consumables', color: 'var(--acc2)' },
    ];
    statsEl.innerHTML = pills.map(p =>
      `<div class="dash-stat-pill">
        <span class="dash-stat-pill-n" style="color:${p.color}">${p.n}</span>
        <span class="dash-stat-pill-l">${p.l}</span>
      </div>`
    ).join('');
  }
  // Studio card foot
  const studioFoot = document.getElementById('dash-studio-foot');
  if (studioFoot) studioFoot.textContent = `${total} cards in library`;
  // Edits row
  const editIds = Object.keys(CARD_EDITS);
  const editsEl = document.getElementById('dash-edits-row');
  if (editsEl) {
    if (editIds.length) {
      const editNames = editIds.map(id => {
        const c = getCard(id);
        return c ? c.name : id;
      });
      editsEl.style.display = 'flex';
      editsEl.innerHTML = `
        <span class="dash-edits-label">✎ ${editIds.length} edited</span>
        <span class="dash-edits-list">${editNames.join(' · ')}</span>
        <button class="dash-edits-clear" onclick="clearAllEdits()">↺ Reset All</button>`;
    } else {
      editsEl.style.display = 'none';
    }
  }
}

function clearAllEdits() {
  if (!confirm('Reset all card edits back to defaults?')) return;
  CARD_EDITS = {};
  try { localStorage.removeItem('cz_card_edits'); } catch(e) {}
  renderDashboard();
  renderLibrary();
}

  const inDeck = sbx.deck.some(d => d.id === card.id);
  const canAfford = sbx.coins >= card.coin_cost;

  const btnClass = inDeck ? 'in-deck' : canAfford ? 'can-buy' : 'no-coins';
  const btnLabel = inDeck ? '✓ In Deck' : `+ Add to Deck${card.coin_cost > 0 ? ' (◈'+card.coin_cost+')' : ' (Free)'}`;

  el.innerHTML = `
    ${buildCardFaceHtml(card, { cssClass: 'cv cmo-cv', showSeries: false })}
    <div class="sbx-add-area">
      <button class="btn-add ${btnClass}" onclick="toggleDeck('${card.id}')" ${inDeck||!canAfford?'':''}>${btnLabel}</button>
      <div class="add-note">${sbx.coins} coins remaining · ${sbx.deck.length} cards in deck</div>
    </div>`;
}

function toggleDeck(id) {
  const card = getCard(id);
  if (!isOwnableCard(card)) return;
  const idx = sbx.deck.findIndex(c => c.id === id);
  if (idx >= 0) {
    // Remove from deck
    sbx.deck.splice(idx, 1);
    sbx.coins += card.coin_cost;
    // Also remove from setup if assigned
    if (sbx.home?.id === id) { sbx.home = null; sbx.homeItems = []; sbx.cats = []; }
    sbx.homeItems = sbx.homeItems.filter(c => c.id !== id);
    sbx.cats.forEach(cat => {
      cat.gear = cat.gear.filter(g => g.id !== id);
      cat.abilities = cat.abilities.filter(a => a.id !== id);
    });
    sbx.cats = sbx.cats.filter(c => c.breed.id !== id);
  } else {
    if (sbx.coins < card.coin_cost) return;
    sbx.deck.push(card);
    sbx.coins -= card.coin_cost;
  }
  renderShopBrowser();
  renderCardDetail();
  renderDeckPanel();
  updateTopbar();
}

function renderDeckPanel() {
  const el = document.getElementById('deck-list');
  if (!sbx.deck.length) {
    el.innerHTML = `<div class="srl-empty">No cards yet.<br>Browse and add cards.</div>`;
    return;
  }
  el.innerHTML = sbx.deck.map(c => {
    const tc = TYPE_META[c.type].color;
    return `<div class="srl-item">
      <div class="srl-dot" style="background:${tc}"></div>
      <span class="srl-name">${c.name}</span>
      <span class="srl-cost">${c.coin_cost>0?'◈'+c.coin_cost:''}</span>
      <span class="srl-rm" onclick="toggleDeck('${c.id}')">✕</span>
    </div>`;
  }).join('');
}

function clearDeck() {
  sbx.deck.forEach(c => { sbx.coins += c.coin_cost; });
  sbx.deck = [];
  sbx.home = null; sbx.homeItems = []; sbx.cats = [];
  sbx.selectedCard = null;
  sbx.activeSlot = null;
  renderShopBrowser();
  renderCardDetail();
  renderDeckPanel();
  renderHomeSetup();
  renderHomePicker();
  renderHomeSummary();
  updateTopbar();
}

function activateSlot(type, idx, catIdx) {
  sbx.activeSlot = {type, idx: idx ?? null, catIdx: catIdx ?? null};
  renderHomeSetup();
  renderHomePicker();
}

function renderHomePicker() {
  const el = document.getElementById('home-picker-list');
  const hint = document.getElementById('home-picker-hint');
  const slot = sbx.activeSlot;

  if (!slot) {
    hint.textContent = 'Click a slot to pick a card';
    el.innerHTML = `<div class="sli-hint">Click any slot in the home panel to assign a card from your deck.</div>`;
    return;
  }

  const typeMap = {
    home:'home', homeitem:'home_item', cat:'cat_breed',
    gear:'battle_gear', ability:'special_ability'
  };
  const labels = {home:'Home',homeitem:'Home Item',cat:'Cat Breed',gear:'Gear',ability:'Ability'};
  const neededType = typeMap[slot.type];
  hint.textContent = `Picking ${labels[slot.type]} →`;

  const available = sbx.deck.filter(c => c.type === neededType);
  if (!available.length) {
    el.innerHTML = `<div class="sli-hint">No ${neededType.replace(/_/g,' ')} cards in deck.<br><button style="font-family:var(--fm);font-size:9px;padding:4px 10px;background:none;border:1px solid var(--bd);border-radius:6px;color:var(--t2);cursor:pointer;margin-top:6px" onclick="setSbxMode('shop')">← Go browse</button></div>`;
    return;
  }

  el.innerHTML = available.map(c => {
    const tc = TYPE_META[c.type].color;
    const rc = RAR_COLOR[c.rarity];
    return `<div class="sli" style="border-color:color-mix(in srgb,${rc} 35%,transparent);background:color-mix(in srgb,${rc} 6%,transparent)" onclick="assignToSlot('${c.id}')">
      <div class="sli-dot" style="background:${rc}"></div>
      <span class="sli-name">${c.name}</span>
      <span class="sli-cost" style="color:${rc}">${c.rarity.slice(0,3).toUpperCase()}</span>
    </div>`;
  }).join('');
}

function assignToSlot(cardId) {
  const card = getCard(cardId);
  const slot = sbx.activeSlot;
  if (!card || !slot) return;

  if (slot.type === 'home') {
    sbx.home = card;
    sbx.homeItems = sbx.homeItems.slice(0, card.data.expansion_slots);
    sbx.cats = sbx.cats.slice(0, card.data.max_occupants);
  } else if (slot.type === 'homeitem') {
    const maxSlots = sbx.home ? sbx.home.data.expansion_slots : 0;
    if (slot.idx !== null && slot.idx < sbx.homeItems.length) {
      sbx.homeItems[slot.idx] = card;
    } else if (sbx.homeItems.length < maxSlots) {
      sbx.homeItems.push(card);
    }
  } else if (slot.type === 'cat') {
    const maxCats = sbx.home ? sbx.home.data.max_occupants : 0;
    if (slot.catIdx !== null && slot.catIdx < sbx.cats.length) {
      sbx.cats[slot.catIdx] = {...sbx.cats[slot.catIdx], breed: card};
    } else if (sbx.cats.length < maxCats) {
      sbx.cats.push({breed: card, gear: [], abilities: [], home_joined_at: Date.now(), home_dev_gains: {}, rep: 100, allies: []});
    }
  } else if (slot.type === 'gear') {
    const cat = sbx.cats[slot.catIdx];
    if (cat) {
      const usedSlots = cat.gear.reduce((s,g) => s + (g.data.gear_slot||1), 0);
      const needed = card.data.gear_slot || 1;
      if (usedSlots + needed <= cat.breed.data.base_inventory_slots) {
        cat.gear.push(card);
      }
    }
  } else if (slot.type === 'ability') {
    const cat = sbx.cats[slot.catIdx];
    if (cat && cat.abilities.length < 2) cat.abilities.push(card);
  }

  sbx.activeSlot = null;
  renderHomeSetup();
  renderHomePicker();
  renderHomeSummary();
  updateTopbar();
}

function removeFromSlot(type, idx, catIdx) {
  if (type === 'home') { sbx.home = null; sbx.homeItems = []; sbx.cats = []; }
  else if (type === 'homeitem') { sbx.homeItems.splice(idx, 1); }
  else if (type === 'cat') { sbx.cats.splice(catIdx, 1); }
  else if (type === 'gear') { sbx.cats[catIdx].gear.splice(idx, 1); }
  else if (type === 'ability') { sbx.cats[catIdx].abilities.splice(idx, 1); }
  sbx.activeSlot = null;
  renderHomeSetup();
  renderHomePicker();
  renderHomeSummary();
  updateTopbar();
}

/* ──────────────────────────────────────────────────────
   HOME DEVELOPMENT ENGINE
   Cats develop stats slowly over time based on home items.
   Rate modifiers come from breed traits and equipped gear.
   ────────────────────────────────────────────────────── */

// Compute the effective development rates (per 24h) for a cat right now.
// Returns { stat: effectiveRate, ... } including negatives.
function computeEffectiveDevRates(catSetup, homeItems) {
  const breedTraits = (catSetup.breed && catSetup.breed.data && catSetup.breed.data.home_dev_traits) || {};
  const globalMul = breedTraits.multiplier || 1.0;
  const breedStatMul = breedTraits.stat_multipliers || {};

  // Collect gear home_dev_effects
  const gearEffects = (catSetup.gear || []).map(g => {
    const gobj = typeof g === 'string' ? getCard(g) : g;
    return gobj && gobj.data && gobj.data.home_dev_effect ? gobj.data.home_dev_effect : null;
  }).filter(Boolean);

  const rates = {};
  homeItems.forEach(item => {
    const iobj = typeof item === 'string' ? getCard(item) : item;
    if (!iobj || !iobj.data) return;
    (iobj.data.development_rates || []).forEach(dr => {
      const stat = dr.stat;
      const baseRate = dr.rate; // per period_hours
      const period = dr.period_hours || 24;
      const ratePerHour = baseRate / period;

      // Apply breed global multiplier
      let mul = globalMul;
      // Apply breed per-stat multiplier (stacks multiplicatively)
      if (breedStatMul[stat]) mul *= breedStatMul[stat];
      // Apply gear effects
      gearEffects.forEach(ge => {
        if (ge.multiplier) mul *= ge.multiplier;
        if (ge.stat_multipliers && ge.stat_multipliers[stat]) mul *= ge.stat_multipliers[stat];
      });

      rates[stat] = (rates[stat] || 0) + ratePerHour * mul;
    });
  });
  return rates; // rates are per hour; multiply by elapsedHours to get gains
}

// Compute total accumulated dev gains for a cat (base gains + live accrual)
// Returns { stat: totalGain, ... }
function computeHomeDev(catSetup, homeItems) {
  const baseGains = catSetup.home_dev_gains || {};
  const joinedAt = catSetup.home_joined_at || null;
  if (!joinedAt || !homeItems || !homeItems.length) return {...baseGains};

  const elapsedMs = Date.now() - joinedAt;
  const elapsedHours = Math.max(0, elapsedMs / 3600000);
  const rates = computeEffectiveDevRates(catSetup, homeItems);
  const gains = {...baseGains};
  Object.entries(rates).forEach(([stat, ratePerHour]) => {
    gains[stat] = (gains[stat] || 0) + ratePerHour * elapsedHours;
  });
  return gains;
}

function getEffectiveStats(catSetup, homeItems, catIdx) {
  const stats = {...catSetup.breed.data.stats};

  if (catSetup.permanent_stat_bonuses) {
    Object.entries(catSetup.permanent_stat_bonuses).forEach(([stat, val]) => {
      if (stats[stat] !== undefined) stats[stat] = Math.max(1, stats[stat] + (parseInt(val) || 0));
    });
  }

  // Apply permanent home development gains (floored to whole numbers)
  const devGains = computeHomeDev(catSetup, homeItems || []);
  Object.entries(devGains).forEach(([stat, gain]) => {
    const whole = Math.floor(gain);
    if (whole !== 0 && stats[stat] !== undefined) {
      stats[stat] = Math.max(1, stats[stat] + whole);
    }
  });

  (catSetup.gear||[]).forEach(gear => {
    const gobj = typeof gear === 'string' ? getCard(gear) : gear;
    if (!gobj) return;
    (gobj.data.effects||[]).forEach(e => {
      const v = parseModifier(e.modifier);
      if (stats[e.stat] !== undefined) stats[e.stat] = Math.max(1, stats[e.stat] + v);
    });
  });
  (catSetup.abilities||[]).filter(a => {
    const aobj = typeof a === 'string' ? getCard(a) : normalizeAbilityCard(a);
    return aobj && aobj.data && aobj.data.expiry?.type === 'none';
  }).forEach(a => {
    const aobj = typeof a === 'string' ? getCard(a) : normalizeAbilityCard(a);
    if (!aobj) return;
    (aobj.data.stat_buffs||[]).forEach(e => {
      const v = parseModifier(e.modifier);
      if (stats[e.stat] !== undefined) stats[e.stat] = Math.max(1, stats[e.stat] + v);
    });
  });
  // Care-item stat boosts (grooming items, etc.)
  if (catIdx !== undefined) {
    const care = CAT_CARE[String(catIdx)];
    if (care && care.statBoosts) {
      Object.entries(care.statBoosts).forEach(([stat, val]) => {
        if (stats[stat] !== undefined) stats[stat] = Math.max(1, stats[stat] + val);
      });
    }
  }
  return stats;
}

const DOJO_STAT_KEYS = ['strength','agility','stamina','speed','intelligence','affection','amicability','stealth'];
const DOJO_DIFFICULTY = {
  weaker: { label:'Weaker', mult:0.86, note:'Practice timing against a softer opponent.' },
  onpar:  { label:'On Par',  mult:1.00, note:'A fair spar with similar overall power.' },
  strong: { label:'Stronger', mult:1.16, note:'A harder cat, but not wildly above your level.' }
};

function dojoCombatPower(stats) {
  return (
    (Number(stats.strength) || 0) * 1.25 +
    (Number(stats.agility) || 0) * 1.10 +
    (Number(stats.stamina) || 0) * 1.05 +
    (Number(stats.speed) || 0) * 0.90 +
    (Number(stats.intelligence) || 0) * 0.65 +
    (Number(stats.stealth) || 0) * 0.45 +
    (Number(stats.affection) || 0) * 0.25 +
    (Number(stats.amicability) || 0) * 0.20
  );
}

function dojoScaleStats(baseStats, targetPower) {
  const basePower = Math.max(1, dojoCombatPower(baseStats));
  const scale = Math.max(0.72, Math.min(1.28, targetPower / basePower));
  const scaled = {};
  DOJO_STAT_KEYS.forEach(key => {
    const val = Number(baseStats[key]) || 10;
    scaled[key] = Math.max(1, Math.round(val * scale));
  });
  return scaled;
}

function getDojoCatSetup() {
  const cats = sbx.cats || [];
  if (!cats.length) return null;
  if (!cats[DOJO_STATE.catIdx]) DOJO_STATE.catIdx = 0;
  return cats[DOJO_STATE.catIdx] || null;
}

function getDojoOpponentOptions() {
  const cs = getDojoCatSetup();
  if (!cs) return [];
  const catStats = getEffectiveStats(cs, sbx.homeItems || [], DOJO_STATE.catIdx);
  const target = dojoCombatPower(catStats) * (DOJO_DIFFICULTY[DOJO_STATE.difficulty]?.mult || 1);
  const currentBreedId = cardIdOf(cs.breed);
  return getLibrary()
    .filter(c => c.type === 'cat_breed' && c.id !== currentBreedId && c.data && c.data.stats)
    .map(card => {
      const scaledStats = dojoScaleStats(card.data.stats, target);
      return {
        card,
        stats: scaledStats,
        gap: Math.abs(dojoCombatPower(scaledStats) - target)
      };
    })
    .sort((a,b) => a.gap - b.gap || a.card.name.localeCompare(b.card.name))
    .slice(0, 8);
}

function getDojoOpponent() {
  const opts = getDojoOpponentOptions();
  if (!opts.length) return null;
  let found = opts.find(o => o.card.id === DOJO_STATE.opponentId);
  if (!found) {
    found = opts[0];
    DOJO_STATE.opponentId = found.card.id;
  }
  return found;
}

function dojoStatChips(stats) {
  return ['strength','agility','stamina','speed'].map(key =>
    `<span class="dojo-stat">${key.slice(0,3).toUpperCase()} ${Math.round(stats[key] || 0)}</span>`
  ).join('');
}

function dojoRollDamage(attacker, defender, turn, actor) {
  const tempo = (Number(attacker.speed) || 0) + (Number(attacker.agility) || 0);
  const guard = (Number(defender.stamina) || 0) * 0.35 + (Number(defender.agility) || 0) * 0.2;
  const base = 6 + (Number(attacker.strength) || 0) * 0.32 + (Number(attacker.agility) || 0) * 0.14 + turn;
  const variance = 0.86 + Math.random() * 0.28;
  const critChance = Math.min(0.24, 0.05 + tempo / 900);
  const crit = Math.random() < critChance;
  const damage = Math.max(3, Math.round((base * variance * (crit ? 1.45 : 1)) - guard * 0.08));
  const verb = crit ? 'lands a clean critical hit' : actor === 'cat' ? 'finds an opening' : 'pushes back';
  return { damage, crit, text: verb };
}

function simulateDojoFight() {
  const cs = getDojoCatSetup();
  const opp = getDojoOpponent();
  if (!cs || !opp) return;
  const catStats = getEffectiveStats(cs, sbx.homeItems || [], DOJO_STATE.catIdx);
  const oppStats = opp.stats;
  const catName = getCatDisplayName(cs);
  const oppName = opp.card.name;
  let catHp = Math.round(58 + (Number(catStats.stamina) || 10) * 1.15);
  let oppHp = Math.round(58 + (Number(oppStats.stamina) || 10) * 1.15);
  const catFirst = ((catStats.speed || 0) + (catStats.agility || 0) + Math.random() * 18) >= ((oppStats.speed || 0) + (oppStats.agility || 0) + Math.random() * 18);
  const log = [`${catName} squares up with ${oppName}. ${catFirst ? catName : oppName} moves first.`];

  for (let turn = 1; turn <= 6 && catHp > 0 && oppHp > 0; turn++) {
    const order = catFirst ? ['cat','opp'] : ['opp','cat'];
    for (const actor of order) {
      if (catHp <= 0 || oppHp <= 0) break;
      if (actor === 'cat') {
        const hit = dojoRollDamage(catStats, oppStats, turn, 'cat');
        oppHp = Math.max(0, oppHp - hit.damage);
        log.push(`${catName} ${hit.text} for ${hit.damage}. ${oppName} has ${oppHp} stamina left.`);
      } else {
        const hit = dojoRollDamage(oppStats, catStats, turn, 'opp');
        catHp = Math.max(0, catHp - hit.damage);
        log.push(`${oppName} ${hit.text} for ${hit.damage}. ${catName} has ${catHp} stamina left.`);
      }
    }
  }

  const catScore = catHp + dojoCombatPower(catStats) * 0.12;
  const oppScore = oppHp + dojoCombatPower(oppStats) * 0.12;
  const won = catHp > 0 && (oppHp <= 0 || catScore >= oppScore);
  const draw = catHp > 0 && oppHp > 0 && Math.abs(catScore - oppScore) < 5;
  log.push(draw ? 'The dojo bell rings. This one ends even.' : won ? `${catName} takes the practice win.` : `${oppName} wins the exchange. ${catName} learned the shape of the fight.`);
  DOJO_STATE.result = {
    catName,
    oppName,
    won,
    draw,
    catHp,
    oppHp,
    difficulty: DOJO_DIFFICULTY[DOJO_STATE.difficulty]?.label || 'On Par',
    log
  };
  renderGameHomeKeepScroll();
}

function setDojoCatIdx(value) {
  DOJO_STATE.catIdx = Math.max(0, parseInt(value, 10) || 0);
  DOJO_STATE.opponentId = null;
  DOJO_STATE.result = null;
  renderGameHomeKeepScroll();
}

function setDojoDifficulty(value) {
  if (!DOJO_DIFFICULTY[value]) return;
  DOJO_STATE.difficulty = value;
  DOJO_STATE.opponentId = null;
  DOJO_STATE.result = null;
  renderGameHomeKeepScroll();
}

function setDojoOpponent(value) {
  DOJO_STATE.opponentId = value;
  DOJO_STATE.result = null;
  renderGameHomeKeepScroll();
}

function buildDojoHtml() {
  const cats = sbx.cats || [];

/* ══════════════════════════════════════════
   RUN ENGINE
══════════════════════════════════════════ */
const SBX_SPEED = 10; // sandbox runs 10× faster than real time

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ── Limited-edition drops ──
   A small chance per cat, per outside run, to bring back a numbered copy
   of a card marked is_limited in the Studio. Guests (no CZ_USER) never
   roll — there's no account to atomically claim a serial against. Serial
   issuance goes through the issue_card_serial() Postgres RPC, which locks
   the card row so concurrent claims across players can't double-issue the
   same number or exceed edition_size. */
const LIMITED_DROP_INT_FACTOR = 0.002;         // +0.2% chance per intelligence point
const LIMITED_DROP_TREASURE_SENSE_BONUS = 0.05; // gear tagged 'treasure_sense'
const LIMITED_DROP_MAX_CHANCE = 0.15;           // hard cap, 15%

async function tryLimitedCardDrop(runs) {
  if (!CZ_USER || !db || !PLAYER) return;
  const limitedCards = baseLibrary().filter(c => c.is_limited);
  if (!limitedCards.length) return;

  for (const run of runs) {
    const cs = sbx.cats[run.catIdx];
    if (!cs) continue;
    const stats = run.stats || {};
    const { specials } = getGearSpecials(cs.gear || []);
    const chance = Math.min(
      LIMITED_DROP_MAX_CHANCE,
      (stats.intelligence || 0) * LIMITED_DROP_INT_FACTOR + (specials.has('treasure_sense') ? LIMITED_DROP_TREASURE_SENSE_BONUS : 0)
    );
    if (Math.random() >= chance) continue;

    const candidate = pick(limitedCards);
    try {
      const { data: serial, error } = await db.rpc('issue_card_serial', { p_card_id: candidate.id });
      if (error || serial == null) continue; // sold out, or another transient issue — skip silently
      PLAYER.deckIds = [...(PLAYER.deckIds || []), candidate.id];
      sbx.deck = [...(sbx.deck || []), candidate.id];
      PLAYER.cardSerials = PLAYER.cardSerials || {};
      PLAYER.cardSerials[candidate.id] = serial;
      savePlayer();
      showCareToast(`✦ LIMITED DROP! ${run.name} found something rare…`);
      setTimeout(() => openCardModal(candidate.id), 1400);
    } catch(e) { /* network hiccup — skip silently, no near-miss messaging */ }
  }
}

/* ── RUN SUPPORT HELPERS ── */

function getGearSpecials(gearCards) {
  const specials = new Set();
  let postFightRecovery = 0;
  let smokeUses = 0;
  (gearCards || []).forEach(g => {
    const sp = g.data && g.data.special_properties;
    if (sp) {
      specials.add(sp);
      if (sp === 'post_fight_recovery') postFightRecovery += 12;
      if (sp === 'free_escape') smokeUses += 3;
    }
  });
  return { specials, postFightRecovery, smokeUses };
}

function getEquippedAbilityCards(abilityRefs) {
  return (abilityRefs || []).map(a => typeof a === 'string' ? getCard(a) : normalizeAbilityCard(a)).filter(Boolean);
}

function rollAbilityProc(abilityCards, effectType, state, scope = 'default') {
  const effects = abilityCards.flatMap(card => getAbilityEffects(card).map(effect => ({ card, effect })))
    .filter(({ effect }) => effect.effect_type === effectType);
  for (const { card, effect } of effects) {
    const key = `${card.id}:${effectType}:${scope}`;
    if (effect.limit === 'once_per_run' && state[key]) continue;
    const chance = Math.max(0, Math.min(100, parseInt(effect.chance_percent) || 0));
    if (Math.random() * 100 < chance) {
      if (effect.limit === 'once_per_run') state[key] = true;
      return { card, effect, value: parseInt(effect.value) || 0 };
    }
  }
  return null;
}

/* ── ALLY SLOTS: driven by AMI + AFF, calibrated for 0–100 stat scale ──
   1 base + 1 per 40 combined points, hard-capped at 5.
   Early game (~20+20=40)  → 2 slots
   Mid game  (~50+50=100)  → 3 slots
   Late game (~80+80=160)  → 5 slots (cap hit)
   Max stats (~100+100)    → 5 slots (cap)                                */
function getAllySlots(ami, aff) {
  return Math.min(5, Math.max(1, 1 + Math.floor((ami + aff) / 40)));
}

function scheduleRunEncounters(run, startTime) {
  const encounters = run.encounters || [];
  const duration = run.duration_ms || ((run.dur_min || 3) * 60 * 1000 / SBX_SPEED);
  const pacedCount = Math.max(0, encounters.length - 1);
  run.endWall = startTime + duration;
  run.done = false;
  encounters.forEach((enc, i) => {
    enc.revealAtWall = i === 0 ? startTime : startTime + (i/(pacedCount+1)) * duration;
    enc.revealed = false;
  });
  return run;
}

async function createServerOutsideRuns(readyIndices, startTime) {
  if (!db) {
    showCareToast('Supabase is required to start outside runs.');
    return [];
  }
  try {
    if (CZ_USER) await savePlayerToCloud();
    const rpcName = CZ_USER ? 'start_outside_run' : 'generate_outside_run';
    const rpcArgs = CZ_USER
      ? { p_selected_cat_indices: readyIndices }
      : { p_cats: sbx.cats || [], p_selected_cat_indices: readyIndices };
    const { data, error } = await db.rpc(rpcName, rpcArgs);
    if (error || !data || !Array.isArray(data.runs)) {
      console.warn('Server outside run unavailable', error);
      showCareToast('Could not start a server run. Please try again.');
      return [];
    }
    return data.runs.map(run => scheduleRunEncounters({
      ...run,
      catIdx: Number(run.catIdx),
      encounters: Array.isArray(run.encounters) ? run.encounters : [],
      energyCost: Math.max(0, Number(run.energyCost || 0)),
      energySaveNote: run.energySaveNote || ''
    }, startTime));
  } catch(e) {
    console.warn('Server outside run failed', e);
    showCareToast('Could not start a server run. Please try again.');
    return [];
  }
}

async function startRun(selectedCatIndices) {
  if (!sbx.cats.length) return false;
  if (sbx.activeRun && sbx.activeRun.timer) clearInterval(sbx.activeRun.timer);

  // Filter to cats that have enough energy, optionally narrowed by the picker.
  const readyIndices = (Array.isArray(selectedCatIndices) && selectedCatIndices.length
    ? selectedCatIndices
    : sbx.cats.map((cs, ci) => ci)
  ).filter(ci => sbx.cats[ci] && canCatGoOutside(ci, sbx.cats[ci]).canGo);
  if (!readyIndices.length) {
    const { reason } = canCatGoOutside(0, sbx.cats[0]);
    showCareToast('😴 ' + (reason || 'Select at least one ready cat'));
    return false;
  }

  const startTime = Date.now();
  const runs = await createServerOutsideRuns(readyIndices, startTime);
  if (!runs.length) return false;
  runs.forEach(run => {
    const cs = sbx.cats[run.catIdx];
    if (!cs) return;
    const state = getLiveCatState(run.catIdx, cs);
    const energyCost = Math.min(state.energy - 2, Math.round(run.energyCost || 0));
    run.energyCost = energyCost;
    setCatCare(run.catIdx, cs, { energy: Math.max(0, state.energy - energyCost), isResting: false });
  });

  sbx.activeRun = { runs, readyIndices, startWall: startTime, allDone: false, timer: null };
  sbx.activeRun.timer = setInterval(runTick, 300);

  document.getElementById('game-home').style.display = 'none';
  document.getElementById('run-ov').style.display = 'flex';
  buildRunSkeleton();
  runTick();
  return true;
}

function getRunSceneForEncounter(enc) {
  if (!enc) return { key:'travel', icon:'🌙', label:'On the move', thing:'escape' };
  if (enc.type === 'observe') return { key:'travel', icon:'👀', label:'Observing surroundings', thing:'escape' };
  if (enc.type === 'battle' || enc.type === 'pvp-battle') {
    if (enc.friendly || enc.charmed || enc.npcAlly) return { key:'friend', icon:'🤝', label:'Making contact', thing:enc.npcAlly ? 'market' : 'friend' };
    if (enc.avoided || enc.allyAssist) return { key:'travel', icon:'💨', label:'Slipping through', thing:'escape' };
    return { key:'fight', icon:'⚔', label:'Trouble ahead', thing:'fight' };
  }
  if (enc.type === 'friend-win' || enc.type === 'friend-lose') return { key:'friend', icon:enc.icon || '🤝', label:'Social encounter', thing:enc.npcAlly ? 'market' : 'friend' };
  if (enc.type === 'persist-bonus') return { key:'find', icon:'🌆', label:'Checking the street', thing:enc.loot ? 'loot' : 'escape' };
  return { key:'find', icon:'✨', label:'Searching', thing:enc.loot ? 'loot' : 'escape' };
}

function getRunPixelState(runs) {
  let latest = null;
  (runs || []).forEach(run => {
    (run.encounters || []).forEach(enc => {
      if (enc.revealed) latest = enc;
    });
  });
  return getRunSceneForEncounter(latest);
}

function buildRunPixelStageHtml(runs) {
  const scene = getRunPixelState(runs);
  const cats = (runs || []).slice(0, 5).map((run, ri) => {
    const cs = sbx.cats[run.catIdx] || {};
    return `<span class="run-pixel-cat" style="--lane:${ri}">
      ${renderCatFaceHtml(cs.breed, { mood:80, hunger:80, energy:80, isResting:false }, run.catIdx)}
    </span>`;
  }).join('');
  return `<div class="run-pixel-stage" id="run-pixel-stage" data-scene="${scene.key}" style="--run-progress:0">
    <div class="run-pixel-sky"></div>
    <div class="run-pixel-moon"></div>
    <div class="run-pixel-city"></div>
    <div class="run-pixel-road"></div>
    ${cats}
    <div class="run-pixel-encounter" id="run-pixel-encounter">${runEncounterThingHtml(scene.thing)}</div>
    <div class="run-pixel-beat" id="run-pixel-beat"><span class="run-pixel-beat-icon">${scene.icon}</span><span>${scene.label}</span></div>
    <div class="run-pixel-prog"><span></span></div>
  </div>`;
}

function runEncounterThingHtml(kind) {
  if (kind === 'fight' || kind === 'friend' || kind === 'market') {
    const mood = kind === 'fight' ? 'sad' : 'happy';
    const color = kind === 'fight' ? '#667085' : kind === 'market' ? '#d1a65d' : '#c78a4b';
    return `<span class="gh-cat-face ${mood}" style="--cat-fur:${color}">
      <span class="gh-cat-face-tail"></span>
      <span class="gh-cat-face-body"></span>
      <span class="gh-cat-face-paw p1"></span>
      <span class="gh-cat-face-paw p2"></span>
      <span class="gh-cat-face-head">
        <span class="gh-cat-face-eye l"></span>
        <span class="gh-cat-face-eye r"></span>
        <span class="gh-cat-face-nose"></span>
        <span class="gh-cat-face-mouth"></span>
      </span>
    </span>`;
  }
  return `<span class="run-pixel-thing ${kind || 'escape'}"></span>`;
}

function updateRunPixelStage(now, runs) {
  const stage = document.getElementById('run-pixel-stage');
  if (!stage || !runs || !runs.length) return;
  const minStart = sbx.activeRun?.startWall || now;
  const maxEnd = Math.max(...runs.map(r => r.endWall));
  const progress = maxEnd > minStart ? Math.min(100, Math.max(0, ((now - minStart) / (maxEnd - minStart)) * 100)) : 100;
  stage.style.setProperty('--run-progress', progress.toFixed(1));
  const scene = getRunPixelState(runs);
  stage.dataset.scene = scene.key;
  const beat = document.getElementById('run-pixel-beat');
  if (beat) beat.innerHTML = `<span class="run-pixel-beat-icon">${scene.icon}</span><span>${scene.label}</span>`;
  const encounter = document.getElementById('run-pixel-encounter');
  if (encounter && encounter.dataset.kind !== scene.thing) {
    encounter.dataset.kind = scene.thing;
    encounter.innerHTML = runEncounterThingHtml(scene.thing);
  }
}

function buildRunSkeleton() {
  const el = document.getElementById('sbx-results');
  if (!el || !sbx.activeRun) return;
  // Remove any loot footer left over from a previous run
  const oldFoot = document.getElementById('run-loot-footer');
  if (oldFoot) oldFoot.remove();
  const { runs } = sbx.activeRun;
  let html = `<div class="run-hdr">
    <h2 id="run-title">🐾 ${runs.length===1 ? runs[0].name+' is outside' : runs.length+' cats are outside'}…</h2>
    <div class="run-timer-row">
      <span style="font-family:var(--fm);font-size:10px;color:var(--t3)">Est. return in</span>
      <span class="run-timer-val" id="run-timer-val">--:--</span>
      <span class="run-speed-note">10× sandbox speed</span>
    </div>
  </div>
  ${buildRunPixelStageHtml(runs)}
  <button class="run-skip-btn" id="run-skip-btn" onclick="skipRun()">⏭ Skip — show all results</button>`;
  runs.forEach((run, ri) => {
    if (runs.length > 1) html += `<div class="run-cat-lbl">🐱 ${run.name}</div>`;
    html += `<div class="run-feed" id="run-feed-${ri}"></div>`;
  });
  html += `<div id="run-loot-area"></div>`;
  el.innerHTML = html;
}

function runTick() {
  if (!sbx.activeRun) return;
  const now = Date.now();
  const { runs } = sbx.activeRun;

  // Update countdown
  const maxEnd = Math.max(...runs.map(r => r.endWall));
  const rem_s = Math.max(0, Math.ceil((maxEnd - now) / 1000));
  const timerEl = document.getElementById('run-timer-val');
  if (timerEl) timerEl.textContent = String(Math.floor(rem_s/60)).padStart(2,'0') + ':' + String(rem_s%60).padStart(2,'0');
  updateRunPixelStage(now, runs);

  // Reveal events
  runs.forEach((run, ri) => {
    if (run.done) return;
    const feed = document.getElementById('run-feed-'+ri);
    run.encounters.forEach(enc => {
      if (!enc.revealed && now >= enc.revealAtWall) {
        enc.revealed = true;
        if (feed) {
          const div = document.createElement('div');
          div.className = 'run-event';
          div.innerHTML = buildEventHtml(enc);
          feed.appendChild(div);
          const el = document.getElementById('sbx-results');
          if (el) el.scrollTop = el.scrollHeight;
        }
      }
    });
    if (now >= run.endWall && run.encounters.every(e => e.revealed)) run.done = true;
  });

  if (runs.every(r => r.done)) {
    clearInterval(sbx.activeRun.timer);
    sbx.activeRun.timer = null;
    sbx.activeRun.allDone = true;
    finishRun();
  }
}

function skipRun() {
  if (!sbx.activeRun) return;
  if (sbx.activeRun.timer) { clearInterval(sbx.activeRun.timer); sbx.activeRun.timer = null; }
  sbx.activeRun.runs.forEach((run, ri) => {
    const feed = document.getElementById('run-feed-'+ri);
    run.encounters.forEach(enc => {
      if (!enc.revealed) {
        enc.revealed = true;
        if (feed) {
          const div = document.createElement('div');
          div.className = 'run-event';
          div.style.animation = 'none';
          div.innerHTML = buildEventHtml(enc);
          feed.appendChild(div);
        }
      }
    });
    run.done = true;
  });
  updateRunPixelStage(Date.now(), sbx.activeRun.runs);
  sbx.activeRun.allDone = true;
  finishRun();
}

function lootPillHtml(loot, extraLoot = []) {
  const cards = [loot, ...(extraLoot || [])].filter(Boolean);
  if (!cards.length) return '';
  return `<div class="ev-loot" style="margin-top:6px">${cards.map(card => {
    const rc = RAR_COLOR[card.rarity];
    return `<span class="loot-pill" style="color:${rc};border-color:color-mix(in srgb,${rc} 40%,transparent);background:color-mix(in srgb,${rc} 8%,transparent)">${TYPE_META[card.type]?TYPE_META[card.type].emoji:'📦'} ${card.name} <span style="opacity:.6;font-size:8px">${card.rarity}</span></span>`;
  }).join('')}</div>`;
}

function battleSummaryDetailsHtml(title, summary, logHtml, footerHtml = '', loot = null, extraLoot = []) {
  return `<details class="btl-details">
    <summary class="btl-details-summary">
      <span class="btl-summary-top">
        <span class="btl-summary-title">${title}</span>
        <span class="btl-summary-chev">›</span>

}

function buildBattleEventHtml(enc) {
  const realWin  = enc.won && !enc.avoided;
  const icoClass = enc.charmed ? 'ev-friend-w' : (realWin ? 'ev-fight-w' : 'ev-fight-l');
  const title    = enc.charmed
    ? `Charmed a ${enc.enemy} — no fight needed`
    : enc.avoided
      ? `Slipped away from a ${enc.enemy}`
      : (realWin ? `Defeated a ${enc.enemy}` : `Lost to a ${enc.enemy}`);

  const logHtml = `<div class="btl-log">${(enc.battleLog||[]).map(l =>
    `<div class="btl-r ${l.cls}">${l.text}</div>`).join('')}</div>`;

  const persistHtml = `<div class="btl-persist-note ${enc.persistAfter?'yes':'no'}">${enc.persistAfter?'🌆':'🏡'} ${enc.persistText}</div>`;
  const outcome = enc.charmed ? 'Charm worked' : enc.avoided ? 'Clean escape' : realWin ? 'Won the fight' : 'Retreated';
  const lootCount = [enc.loot, ...(enc.extraLoot || [])].filter(Boolean).length;
  const summary = `${outcome} · ${(enc.battleLog || []).length} beat${(enc.battleLog || []).length === 1 ? '' : 's'}${lootCount ? ` · found ${lootCount} card${lootCount === 1 ? '' : 's'}` : ''}`;

  return `<div class="ev-ico ${icoClass}">${enc.icon}</div>
    <div class="ev-body">
      ${battleSummaryDetailsHtml(title, summary, logHtml, persistHtml, enc.loot, enc.extraLoot)}
    </div>`;
}

function buildPersistBonusHtml(enc) {
  const intros = [
    n => `${n} was still in the neighbourhood. Made use of the time.`,
    n => `While the adrenaline was still running, ${n} had a quick look around.`,
    n => `Still out there — ${n} checked the usual spots.`,
  ];
  const intro   = pick(intros)(enc.catName || '');
  const noFind  = `<div class="ev-detail" style="color:var(--t3);font-size:10.5px;margin-top:3px">Kept an eye out but didn't find anything new.</div>`;
  return `<div class="ev-ico ev-persist">🌆</div>
    <div class="ev-body">
      <div class="ev-detail">${intro}</div>
      ${enc.abilityNotes && enc.abilityNotes.length ? `<div class="ev-detail" style="color:#a78bfa;font-size:10px;margin-top:3px">${enc.abilityNotes.join(' · ')}</div>` : ''}
      ${enc.loot ? lootPillHtml(enc.loot, enc.extraLoot) : noFind}
    </div>`;
}

function buildPvPBattleHtml(enc) {
  const { opponent, won, draw, friendly, pvpResult, repDelta, coins } = enc;
  const repSign  = repDelta > 0 ? '+' : '';
  const repClass = repDelta > 0 ? 'pvp-rep-pos' : repDelta < 0 ? 'pvp-rep-neg' : 'pvp-rep-zero';
  let icoClass, title;
  if (friendly) {
    icoClass = 'ev-friend-w';
    title = `Ran into ${opponent.catName} (${opponent.ownerName}) · Rep ${opponent.rep} — no beef`;
  } else if (draw) {
    icoClass = 'ev-friend-l';
    title = `Drew with ${opponent.catName} (${opponent.ownerName}) · Rep ${opponent.rep}`;
  } else if (won) {
    icoClass = 'ev-fight-w';
    title = `Defeated ${opponent.catName} (${opponent.ownerName}) · Rep ${opponent.rep}`;
  } else {
    icoClass = 'ev-fight-l';
    title = `Lost to ${opponent.catName} (${opponent.ownerName}) · Rep ${opponent.rep}`;
  }
  const logHtml = `<div class="btl-log">${(pvpResult.log||[]).map(l =>
    `<div class="btl-r ${l.cls}">${l.text}</div>`).join('')}</div>`;
  const footerHtml = `<div class="pvp-footer">
    <span class="pvp-rep-delta ${repClass}">⭐ ${repSign}${repDelta} REP</span>
    ${coins > 0 ? `<span class="pvp-coins">🪙 +${coins}</span>` : ''}
    ${enc.befriendable ? `<span class="pvp-befriended">🐾 New ally: ${enc.opponent.catName}</span>` : enc.pvpResult.outcome === 'submission' && won ? `<span class="pvp-ally">🤝 Possible ally</span>` : ''}
    ${enc.allyAssist ? `<span class="pvp-assist">🛡 ${enc.allyAssist.catName} had your back</span>` : ''}
  </div>`;
  const outcome = friendly ? 'Peaceful pass' : draw ? 'No clear winner' : won ? 'Victory' : 'Retreated';
  const rewardBits = [`${repSign}${repDelta} REP`];
  if (coins > 0) rewardBits.push(`+${coins} coins`);
  const lootCount = [enc.loot, ...(enc.extraLoot || [])].filter(Boolean).length;
  if (lootCount) rewardBits.push(`found ${lootCount} card${lootCount === 1 ? '' : 's'}`);
  const summary = `${outcome} · ${rewardBits.join(' · ')}`;
  return `<div class="ev-ico ${icoClass}">${enc.icon}</div>
    <div class="ev-body">
      ${battleSummaryDetailsHtml(title, summary, logHtml, footerHtml, enc.loot, enc.extraLoot)}
    </div>`;
}

function buildEventHtml(enc) {
  if (enc.type === 'observe') {
    return `<div class="ev-ico ev-find">${enc.icon}</div>
      <div class="ev-body">
        <div class="ev-detail">${enc.intro}</div>
      </div>`;
  }
  if (enc.type === 'pvp-battle')    return buildPvPBattleHtml(enc);
  if (enc.type === 'battle')        return buildBattleEventHtml(enc);
  if (enc.type === 'persist-bonus') return buildPersistBonusHtml(enc);

  const icoClass = {
    'friend-win':'ev-friend-w','friend-lose':'ev-friend-l','find':'ev-find'
  }[enc.type] || 'ev-find';
  return `<div class="ev-ico ${icoClass}">${enc.icon}</div>
    <div class="ev-body">
      <div class="ev-detail">${enc.intro}${enc.outcome ? ' ' + enc.outcome : ''}</div>
      ${enc.abilityNotes && enc.abilityNotes.length ? `<div class="ev-detail" style="color:#a78bfa;font-size:10px;margin-top:3px">${enc.abilityNotes.join(' · ')}</div>` : ''}
      ${enc.npcAlly ? `<div class="pvp-footer"><span class="pvp-befriended">🐾 New ally: ${enc.npcAlly.name}</span></div>` : ''}
      ${lootPillHtml(enc.loot, enc.extraLoot)}
    </div>`;
}

function finishRun() {
  const { runs, readyIndices } = sbx.activeRun;

  // Fire-and-forget: each cat gets an independent roll for a limited-edition
  // find. Not awaited — the reveal (if any) surfaces asynchronously via its
  // own toast + card modal once the server confirms a serial was claimed.
  tryLimitedCardDrop(runs);

  // ── Capture pre-boost state, apply return stat changes, store diffs ──
  const returnDiffs = {};
  if (readyIndices && readyIndices.length) {
    // Check if home items protect hunger (premium food = slower hunger drain)
    const hasProtectedFood = (sbx.homeItems || []).some(hi => {
      const card = typeof hi === 'string' ? getCard(hi) : hi;
      return card && card.data && card.data.special_properties === 'premium_food';
    });

    readyIndices.forEach(ci => {
      const cs = sbx.cats[ci]; if (!cs) return;
      const traits    = getTraits(cs.breed);
      const preState  = getLiveCatState(ci, cs);
      const run       = runs.find(r => r.catIdx === ci);

      // Mood boost for going outside
      const moodBoost = Math.round(8 * traits.outdoor_mood_boost);
      setCatCare(ci, cs, { mood: Math.min(100, preState.mood + moodBoost) });

      // Hunger drain from exertion — proportional to run length, halved if premium food active
      const baseHungerDrain = Math.round(10 + (run ? run.dur_min * 0.7 : 10));
      const abilityCards = getEquippedAbilityCards(cs.abilities || []);
      const hungerProc = rollAbilityProc(abilityCards, 'hunger_drain_reduce', {}, `return-${ci}`);
      const hungerSave = hungerProc ? Math.min(80, hungerProc.value || 15) / 100 : 0;
      const protectedDrain = hasProtectedFood ? Math.round(baseHungerDrain * 0.4) : baseHungerDrain;
      const hungerDrain = Math.round(protectedDrain * (1 - hungerSave));
      if (run && hungerProc) run.hungerSaveNote = `${hungerProc.card.name}: -${Math.round(hungerSave * 100)}% hunger drain`;
      const postMood = getLiveCatState(ci, cs);
      setCatCare(ci, cs, { hunger: Math.max(0, postMood.hunger - hungerDrain) });

      // Record diffs for the return animation
      returnDiffs[ci] = {
        moodDiff:   moodBoost,
        hungerDiff: -hungerDrain,
        energyDiff: -(run ? run.energyCost : 0),
        prevHunger: preState.hunger,
        prevMood:   preState.mood,
        prevEnergy: preState.energy,
      };
    });
  }
  // ── Apply PvP rep changes, coins, and Solo Run Bonus ──
  readyIndices.forEach(ci => {
    const cs  = sbx.cats[ci]; if (!cs) return;
    const run = runs.find(r => r.catIdx === ci); if (!run) return;

    // Solo run: no ally assist fired on any PvP encounter this run
    const isSoloRun = !run.encounters.some(e => e.type === 'pvp-battle' && e.allyAssist);

    let repDelta = 0, coinsEarned = 0, soloBonusRep = 0, soloBonusCoins = 0;
    run.encounters.forEach(enc => {
      if (enc.type !== 'pvp-battle') return;
      const rd = enc.repDelta || 0;
      const co = enc.coins   || 0;
      repDelta    += rd;
      coinsEarned += co;
      // Solo bonus: +20% rep and +15% coins on every unassisted win
      if (isSoloRun && enc.won && !enc.friendly && rd > 0) {
        soloBonusRep   += Math.round(rd * 0.20);
        soloBonusCoins += Math.round(co * 0.15);
      }
    });
    repDelta    += soloBonusRep;
    coinsEarned += soloBonusCoins;

    if (repDelta !== 0)   cs.rep    = Math.max(0, (cs.rep    || 100) + repDelta);
    if (coinsEarned > 0)  sbx.coins = Math.max(0, (sbx.coins || 0)  + coinsEarned);

    // Store for the footer display
    run.isSoloRun      = isSoloRun;
    run.soloBonusRep   = soloBonusRep;
    run.soloBonusCoins = soloBonusCoins;

    // ── Alliance: process befriendable encounters ──
    if (!cs.allies) cs.allies = [];
    // Slot count uses the effective stats from this run (gear bonuses included)
    const _runAmi = (run.stats && run.stats.amicability) || 0;
    const _runAff = (run.stats && run.stats.affection)   || 0;
    const allySlotCount = getAllySlots(_runAmi, _runAff);
    // Trim to current slot count in case stats dropped since last run
    while (cs.allies.length > allySlotCount) cs.allies.shift();
    run.encounters.forEach(enc => {
      if (enc.type === 'friend-win' && enc.npcAlly) {
        const npc = enc.npcAlly;
        if (cs.allies.some(a => a.cardId === npc.id)) return;
        if (cs.allies.length >= allySlotCount) cs.allies.shift();
        cs.allies.push({
          ownerName: 'Marketplace',
          catName: npc.name,
          rep: 200,
          stats: npc.data?.stats || {},
          cardId: npc.id,
          npc: true,
          befriendedAt: Date.now()
        });
        return;
      }
      if (enc.type !== 'pvp-battle' || !enc.befriendable || !enc.opponent) return;
      const opp = enc.opponent;
      // Avoid duplicates (same catName + ownerName)
      if (cs.allies.some(a => a.catName === opp.catName && a.ownerName === opp.ownerName)) return;
      // At slot cap, drop the oldest ally to make room
      if (cs.allies.length >= allySlotCount) cs.allies.shift();
      cs.allies.push({ ownerName: opp.ownerName, catName: opp.catName, rep: opp.rep, stats: opp.stats, befriendedAt: Date.now() });
    });
  });

  GH_RETURN_DIFFS = returnDiffs;
  updateSendOutsideButton();

  const title = document.getElementById('run-title');
  if (title) title.textContent = '🏡 ' + (runs.length===1 ? runs[0].name+' is home' : runs.length+' cats are home') + '!';
  const timerRow = document.querySelector('.run-timer-row');
  if (timerRow) timerRow.style.display = 'none';
  const skipBtn = document.getElementById('run-skip-btn');
  if (skipBtn) skipBtn.style.display = 'none';

  const allLoot = runs.flatMap(r => r.encounters.flatMap(e => [e.loot, ...(e.extraLoot || [])].filter(Boolean)));
  if (!sbx.activeRun.lootAwarded && allLoot.length) {
    allLoot.forEach(card => awardOwnedCard(card.id));
    sbx.activeRun.lootAwarded = true;
    savePlayer();
  }
  // ── Build loot footer — compact rows in a collapsible section ──
  const sbxpResults = document.getElementById('sbxp-results');
  const oldFoot = document.getElementById('run-loot-footer');
  if (oldFoot) oldFoot.remove();

  // ── Solo Run banners — only show when the bonus actually paid out ──
  const soloRuns = runs.filter(r => r.isSoloRun && (r.soloBonusRep > 0 || r.soloBonusCoins > 0));
  const soloBannerHtml = soloRuns.length ? `<div class="solo-run-banners">${soloRuns.map(r => `
    <div class="solo-run-banner">
      <div class="solo-run-icon">⚡</div>
      <div class="solo-run-body">
        <div class="solo-run-title">${r.name} ran solo</div>
        <div class="solo-run-desc">No backup needed · bonus applied</div>
      </div>
      <div class="solo-run-rewards">
        ${r.soloBonusRep   > 0 ? `<span class="solo-rep">+${r.soloBonusRep} REP</span>`    : ''}
        ${r.soloBonusCoins > 0 ? `<span class="solo-coins">+${r.soloBonusCoins} 🪙</span>` : ''}
      </div>
    </div>`).join('')}</div>` : '';

  let lootInner = '';
  if (allLoot.length) {
    const rows = allLoot.map(card => {
      const tm = TYPE_META[card.type] || { color:'var(--t3)', label:card.type };
      const rc = RAR_COLOR[card.rarity] || 'var(--t3)';
      const effs = card.type === 'consumable' ? [] : getEffects(card);
      const effStr = card.type === 'consumable'
        ? formatConsumableEffects(card).slice(0, 3).join(' · ')
        : effs.map(e => { const v=parseModifier(e.modifier); return `${e.stat} ${v>=0?'+':''}${v}`; }).join(' · ');
      return `<div class="loot-row" onclick="openCardModal('${card.id}')">
        <span class="loot-row-dot" style="background:${tm.color}"></span>
        <div class="loot-row-info">
          <span class="loot-row-name">${card.name}</span>
          ${effStr ? `<span class="loot-row-effs">${effStr}</span>` : ''}
        </div>
        <span class="loot-row-rar" style="color:${rc}">${card.rarity}</span>
        <span class="loot-row-arr">›</span>
      </div>`;
    }).join('');
    lootInner = `<details class="loot-details" open>
      <summary class="loot-details-summary">
        <span class="loot-details-icon">🎒</span>
        <span class="loot-details-lbl">Items brought home</span>
        <span class="loot-details-count">${allLoot.length}</span>
        <span class="loot-details-chev">›</span>
      </summary>
      <div class="loot-rows">${rows}</div>
    </details>`;
  } else {
    lootInner = `<div class="loot-empty">Nothing found this time.</div>`;
  }

  const footDiv = document.createElement('div');
  footDiv.id = 'run-loot-footer';
  footDiv.className = 'run-loot-footer';
  footDiv.innerHTML = `
    <div class="run-loot-footer-scroll">${soloBannerHtml}${lootInner}</div>
    <div class="run-loot-footer-btn">
      <button class="btn-go primary" style="width:100%;max-width:100%" onclick="returnToGameHome()">🏠 Back to Home</button>
    </div>`;
  if (sbxpResults) sbxpResults.appendChild(footDiv);
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showOnboardStep(step) {
  ONBOARD.step = step;
  const ov = document.getElementById('onboard');
  if (!ov) return;
  ov.style.display = 'flex';
  // Draft and reveal need full-height locked layout; other steps use the normal scrollable overlay
  ov.classList.toggle('draft-mode', step === 'draft');
  ov.classList.toggle('reveal-mode', step === 'reveal');
  if (step === 'register') ov.innerHTML = buildRegisterHtml();
  else if (step === 'draft')  ov.innerHTML = buildDraftHtml();
  else if (step === 'reveal') { ov.innerHTML = buildRevealHtml(); updateRevealBudget(); setTimeout(triggerRevealFlips, 350); }
}
