<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cazooka Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&family=Bodoni+Moda:wght@600;700&display=swap">

<style>
/* ── TOKENS ── */
:root {
  --bg:#0D1117; --s1:#131922; --s2:#1A2235; --s3:#212B42;
  --bd:#252D44; --bd2:#303C58;
  --t1:#E2E8F5; --t2:#8892A8; --t3:#4E5870;
  --acc:#F0A030; --acc2:#FFC860; --acc-bg:rgba(240,160,48,.1);
  --col-breed:#F97316; --col-home:#22C55E; --col-item:#38BDF8;
  --col-gear:#F43F5E; --col-ability:#A855F7;
  --rar-common:#94A3B8; --rar-uncommon:#34D399; --rar-rare:#60A5FA;
  --rar-epic:#A78BFA; --rar-legendary:#F0A030;
  --fd:'Syne',sans-serif; --fb:'DM Sans',sans-serif; --fm:'DM Mono',monospace;
  --r-sm:4px; --r-md:9px; --r-lg:13px; --r-f:9999px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EBF0FA;--s1:#fff;--s2:#F3F5FC;--s3:#E8ECF7;
  --bd:#D0D6EE;--bd2:#B8C0DA;--t1:#141C34;--t2:#546080;--t3:#9AA0B8;
  --acc-bg:rgba(240,160,48,.09);
}}
:root[data-theme="light"]{
  --bg:#EBF0FA;--s1:#fff;--s2:#F3F5FC;--s3:#E8ECF7;
  --bd:#D0D6EE;--bd2:#B8C0DA;--t1:#141C34;--t2:#546080;--t3:#9AA0B8;
  --acc-bg:rgba(240,160,48,.09);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;font-size:15px;background:var(--bg)}
/* This is a mobile/tablet game — on large screens, frame it to a vertical
   tablet width instead of stretching edge-to-edge. Admin (admin.html) is a
   separate document and is unaffected. */
body{background:var(--bg);color:var(--t1);font-family:var(--fb);line-height:1.5;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;position:relative;max-width:768px;margin:0 auto;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
.app-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}

/* ── HEADER ── */
.hdr{height:50px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--s1);border-bottom:1px solid var(--bd);z-index:100}
.hdr-logo{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--acc2)}
.hdr-back{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:4px 12px;background:none;border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t3);cursor:pointer;transition:all .15s}
.hdr-back:hover{color:var(--acc2);border-color:var(--acc)}
.hdr-section-title{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3)}
.hdr-sep{width:1px;height:20px;background:var(--bd)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.hdr-version{font-family:var(--fm);font-size:9px;color:var(--t3);letter-spacing:.05em}
/* ── DASHBOARD ── */
.dash-wrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:40px 24px 60px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.dash-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.dash-hero-eyebrow{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--t3)}
.dash-hero-title{font-family:var(--fd);font-weight:800;font-size:clamp(36px,6vw,72px);letter-spacing:.03em;color:var(--t1);line-height:1}
.dash-hero-sub{font-family:var(--fb);font-size:14px;color:var(--t2);margin-top:4px}
.dash-nav-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.dash-navcard{flex:1;min-width:260px;max-width:310px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:28px 26px 22px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:all .18s;position:relative;overflow:hidden}
.dash-navcard::before{content:'';position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at top left,var(--acc-bg),transparent 70%);transition:opacity .2s;pointer-events:none}
.dash-navcard:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.dash-navcard:hover::before{opacity:1}
.dash-navcard-icon{font-size:30px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,200,96,.25))}
.dash-navcard-title{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--t1);letter-spacing:.01em}
.dash-navcard-desc{font-family:var(--fb);font-size:12px;color:var(--t2);line-height:1.55;flex:1}
.dash-navcard-foot{font-family:var(--fm);font-size:9.5px;color:var(--acc2);margin-top:4px;letter-spacing:.03em}
.dash-stats-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.dash-stat-pill{display:flex;flex-direction:column;gap:2px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:10px 16px;min-width:80px}
.dash-stat-pill-n{font-family:var(--fd);font-size:22px;font-weight:700;line-height:1}
.dash-stat-pill-l{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-top:1px}
.dash-edits-row{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:12px 18px;width:100%;max-width:680px;display:flex;align-items:center;gap:10px}
.dash-edits-label{font-family:var(--fm);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);flex-shrink:0}
.dash-edits-list{font-family:var(--fb);font-size:11px;color:var(--t2);flex:1}
.dash-edits-clear{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;background:none;border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t3);cursor:pointer;flex-shrink:0;transition:all .15s}
.dash-edits-clear:hover{border-color:#F43F5E;color:#F43F5E}

/* ── TAB PANELS ── */
.tab-content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.tab-panel.hidden{display:none}

/* ── LIBRARY ── */
.lib-panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lib-top{flex-shrink:0;padding:12px 20px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);flex-wrap:wrap}
#lib-series-filter{flex-shrink:0;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lib-count{font-family:var(--fm);font-size:10px;color:var(--t3);margin-left:auto;white-space:nowrap}
.lib-new-btn{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:5px 14px;background:var(--acc2);border:none;border-radius:var(--r-md);color:#0D1117;cursor:pointer;font-weight:600;transition:opacity .15s;white-space:nowrap;flex-shrink:0}
.lib-new-btn:hover{opacity:.85}
.filter-grp{display:flex;gap:4px;align-items:center}
.filter-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);margin-right:2px}
.fchip{font-family:var(--fm);font-size:9.5px;padding:3px 10px;border-radius:var(--r-f);border:1px solid var(--bd);background:transparent;color:var(--t3);cursor:pointer;transition:all .15s;white-space:nowrap}
.fchip:hover{border-color:var(--bd2);color:var(--t2)}
.fchip.on{border-color:currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.fchip[data-type="all"].on,.fchip[data-rar="all"].on{color:var(--t1);border-color:var(--bd2);background:var(--s3)}
.fchip[data-type="cat_breed"].on{color:var(--col-breed)}
.fchip[data-type="home"].on{color:var(--col-home)}
.fchip[data-type="home_item"].on{color:var(--col-item)}
.fchip[data-type="battle_gear"].on{color:var(--col-gear)}
.fchip[data-type="special_ability"].on{color:var(--col-ability)}
.fchip[data-type="consumable"].on{color:var(--acc2)}
.fchip[data-rar="common"].on{color:var(--rar-common)}
.fchip[data-rar="uncommon"].on{color:var(--rar-uncommon)}
.fchip[data-rar="rare"].on{color:var(--rar-rare)}
.fchip[data-rar="epic"].on{color:var(--rar-epic)}
.lib-search{font-family:var(--fb);font-size:12px;padding:5px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t1);outline:none;width:160px;transition:border-color .15s}
.lib-search:focus{border-color:var(--bd2)}
.lib-grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px;align-content:start;justify-content:center;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.lib-grid .cv{cursor:pointer;transition:transform .13s,box-shadow .13s;height:294px;flex-shrink:0;display:flex;flex-direction:column}
.lib-grid .cv:hover{transform:translateY(-3px);box-shadow:0 0 0 2px var(--cv-r,var(--cv-c)),0 16px 40px rgba(0,0,0,.55)}
/* Library cards: proportionally scaled-down version of the lightbox (0.7×) */
.lib-grid .cv .cv-art{height:70px!important;font-size:34px!important;flex-shrink:0!important}
.lib-grid .cv .cv-art::after{display:none}
.lib-grid .cv .cv-hdr{padding:7px 10px 6px!important}
.lib-grid .cv .cv-name{font-size:12.5px!important}
.lib-grid .cv .cv-body{flex:1;min-height:0;overflow:hidden;padding:7px 10px 7px!important;gap:5px!important}
.lib-grid .cv .cv-stats-grid{gap:2px 6px!important}
.lib-grid .cv .cv-desc{font-size:10px!important}
.lib-grid .cv .cv-subtext{font-size:9px!important}
.lib-grid .cv .cvs-n{font-size:7px!important}
.lib-grid .cv .cvs-v{font-size:7px!important}
.lib-grid .cv .cv-foot{flex-shrink:0!important;padding:6px 10px 7px!important}

/* ── CARD TILES ── */
.ctile{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:13px 14px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.ctile:hover{border-color:var(--tile-c,var(--bd2));box-shadow:0 0 0 1px var(--tile-c,var(--bd2)),0 6px 20px rgba(0,0,0,.3)}
.ctile-top{display:flex;align-items:center;gap:7px}
.ctile-type-dot{width:7px;height:7px;border-radius:50%;background:var(--tile-c);flex-shrink:0}
.ctile-type-lbl{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--tile-c)}
.ctile-rar{margin-left:auto;font-family:var(--fm);font-size:7.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:var(--r-f);border:1px solid color-mix(in srgb,var(--rar-c) 50%,transparent);background:color-mix(in srgb,var(--rar-c) 10%,transparent);color:var(--rar-c)}
.ctile-name{font-family:var(--fd);font-weight:700;font-size:13.5px;color:var(--t1);line-height:1.2}
.ctile-desc{font-size:11px;color:var(--t2);font-style:italic;line-height:1.45}
.ctile-effects{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.ctile-eff{font-family:var(--fm);font-size:9px;padding:2px 6px;border-radius:3px;background:var(--s3);color:var(--t2)}
.ctile-eff.pos{color:#34D399;background:rgba(52,211,153,.1)}
.ctile-eff.neg{color:#F87171;background:rgba(248,113,113,.1)}
.ctile-starter{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1}
.ctile-cost{font-family:var(--fm);font-size:9px;color:var(--acc);letter-spacing:.02em}
.ctile-stats{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:2px}
.ctile-stat{display:flex;justify-content:space-between;align-items:center;gap:4px}
.ctile-stat-n{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--t3)}
.ctile-stat-bar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.ctile-stat-fill{height:100%;border-radius:2px}
.ctile-stat-v{font-family:var(--fm);font-size:8px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}

/* ── SANDBOX WRAPPER ── */
.sbx-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sbx-topbar{flex-shrink:0;height:44px;padding:0 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;background:var(--s1)}
.sbx-stat{display:flex;align-items:center;gap:6px}
.sbx-stat-lbl{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3)}
.sbx-stat-val{font-family:var(--fm);font-size:12px;font-weight:600}
.sbx-divider{width:1px;height:18px;background:var(--bd)}
.sbx-mode-tabs{display:flex;gap:3px;margin-left:auto}
.smt{font-family:var(--fm);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;padding:5px 13px;background:none;border:1px solid transparent;border-radius:var(--r-md);color:var(--t3);cursor:pointer;transition:all .15s}
.smt:hover{color:var(--t2);border-color:var(--bd)}
.smt.on{color:var(--acc2);border-color:var(--acc);background:var(--acc-bg)}
.smt:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.sbx-new-game{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:5px 10px;background:none;border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t3);cursor:pointer;margin-left:6px;transition:all .15s}
.sbx-new-game:hover{border-color:#F43F5E;color:#F43F5E}
.sbx-panel{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.sbx-panel.hidden{display:none}

/* 3-col layout shared by shop + home modes */
.sbx-cols{flex:1;min-height:0;display:grid;grid-template-columns:200px 1fr 240px;overflow:hidden}

/* LEFT panel */
.sbx-left{background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sbx-left-topbar{flex-shrink:0;padding:8px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:3px}
.sbx-left-hint{flex-shrink:0;padding:6px 10px;border-bottom:1px solid var(--bd);font-family:var(--fm);font-size:9px;color:var(--t3);font-style:italic}
.sbx-left-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sli{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;transition:all .12s;user-select:none}
.sli:hover{background:var(--s2);border-color:var(--bd)}
.sli.on{background:var(--s3);border-color:var(--bd2)}
.sli-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sli-name{font-size:11.5px;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sli-cost{font-family:var(--fm);font-size:9px;flex-shrink:0}
.sli-hint{font-size:11px;color:var(--t3);font-style:italic;padding:16px 8px;text-align:center}

/* CENTER panel */
.sbx-center{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:24px 20px;gap:16px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sbx-placeholder{color:var(--t3);font-size:12px;font-style:italic;padding-top:60px;text-align:center;line-height:1.7}

/* CARD VISUAL */
.cv{position:relative;width:210px;flex-shrink:0;border-radius:12px;overflow:hidden;border:1.5px solid var(--cv-r,var(--cv-c,var(--bd)));box-shadow:0 0 0 1px color-mix(in srgb,var(--cv-r,var(--cv-c,var(--bd))) 28%,transparent),0 10px 36px rgba(0,0,0,.45)}
.cv-full-art-img{position:absolute;inset:0;z-index:0;background-repeat:no-repeat;user-select:none}
.cv-full-art-tint{position:absolute;inset:0;z-index:1;pointer-events:none}
.cv.art-full .cv-hdr,.cv.art-full .cv-body,.cv.art-full .cv-foot{position:relative;z-index:2;background:transparent}
.cv-hdr{padding:9px 12px 7px;background:color-mix(in srgb,var(--cv-c) 10%,var(--s2))}
.cv-trow{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.cv-tdot{width:6px;height:6px;border-radius:50%;background:var(--cv-c);flex-shrink:0}
.cv-tlbl{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--cv-c);flex:1}
.cv-rpill{font-family:var(--fm);font-size:7px;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--cv-r) 50%,transparent);background:color-mix(in srgb,var(--cv-r) 12%,transparent);color:var(--cv-r)}
.cv-name{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:14px;color:var(--t1);line-height:1.25;text-wrap:balance}
.cv-series{font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--cv-c);opacity:.75;margin-top:2px}
.cv-art{height:96px;background:linear-gradient(135deg,color-mix(in srgb,var(--cv-r,var(--cv-c)) 28%,var(--s3)),color-mix(in srgb,var(--cv-r,var(--cv-c)) 6%,var(--s2)));display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden;user-select:none}
.cv-art::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,var(--s1))}
.cv-body{padding:8px 12px 10px;background:var(--s1);display:flex;flex-direction:column;gap:8px}
.cv-desc{font-size:10.5px;color:var(--t2);font-style:italic;line-height:1.45}
.cv-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.cvs{display:flex;align-items:center;gap:4px}
.cvs-n{font-family:var(--fm);font-size:7.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--t3);width:26px;flex-shrink:0}
.cvs-bar{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.cvs-fill{height:100%;border-radius:2px;background:var(--cv-c)}
.cvs-v{font-family:var(--fm);font-size:7.5px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.cv-effs{display:flex;flex-wrap:wrap;gap:3px}
.cv-eff{font-family:var(--fm);font-size:8.5px;padding:2px 7px;border-radius:3px;background:var(--s3);color:var(--t2)}
.cv-eff.pos{color:#34D399;background:rgba(52,211,153,.1)}
.cv-eff.neg{color:#F87171;background:rgba(248,113,113,.1)}
.cv-hchips{display:flex;gap:5px;flex-wrap:wrap}
.cv-hchip{font-family:var(--fm);font-size:9px;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--t2)}
.cv-foot{padding:7px 12px 9px;background:color-mix(in srgb,var(--cv-c) 6%,var(--s2));border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.cv-cost{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--acc2)}
.cv-startpill{font-family:var(--fm);font-size:7.5px;padding:2px 8px;border-radius:999px;background:var(--acc-bg);border:1px solid var(--acc);color:var(--acc2)}
.cv-subtext{font-family:var(--fm);font-size:9px;color:var(--t3)}

/* Add-to-deck area */
.sbx-add-area{display:flex;flex-direction:column;align-items:center;gap:8px;width:210px}
.btn-add{width:100%;padding:9px;border:none;border-radius:var(--r-md);font-family:var(--fd);font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;letter-spacing:.01em}
.btn-add.can-buy{background:var(--acc);color:#150e00}
.btn-add.can-buy:hover{background:var(--acc2);transform:translateY(-1px)}
.btn-add.in-deck{background:var(--s3);color:var(--t2);border:1px solid var(--bd);cursor:default}
.btn-add.no-coins{background:var(--s3);color:var(--t3);border:1px solid var(--bd);cursor:not-allowed;opacity:.55}
.add-note{font-family:var(--fm);font-size:9.5px;color:var(--t3);text-align:center}

/* RIGHT panel */
.sbx-right{background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sbx-right-hdr{flex-shrink:0;padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px}
.srh-title{font-family:var(--fm);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);flex:1}
.srh-clear{font-family:var(--fm);font-size:9px;padding:3px 8px;background:none;border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t3);cursor:pointer;transition:all .15s}
.srh-clear:hover{border-color:#F43F5E;color:#F43F5E}
.sbx-right-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:7px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.srl-item{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md)}
.srl-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.srl-name{font-size:11px;color:var(--t1);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srl-cost{font-family:var(--fm);font-size:9px;color:var(--t3);flex-shrink:0}
.srl-rm{font-size:11px;color:var(--t3);cursor:pointer;padding:0 3px;flex-shrink:0;transition:color .1s}
.srl-rm:hover{color:#F43F5E}
.srl-empty{font-size:11px;color:var(--t3);font-style:italic;text-align:center;padding:20px 10px}
.sbx-right-foot{flex-shrink:0;padding:10px 12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.btn-go{width:100%;padding:9px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--s2);color:var(--t1);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-go:hover{border-color:var(--col-home);color:var(--col-home)}
.btn-go.primary{background:var(--acc);border-color:var(--acc);color:#150e00;font-family:var(--fd);font-weight:700}
.btn-go.primary:hover{background:var(--acc2);border-color:var(--acc2)}
.btn-go:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

/* HOME SETUP (center in home mode) */
.home-setup{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;width:100%}
.hs-sec{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.hs-sec-title{font-family:var(--fd);font-weight:700;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hs-sec-title small{font-family:var(--fm);font-size:8.5px;color:var(--t3);font-weight:400}
.hs-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hs-lbl{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);min-width:36px;flex-shrink:0}
.dslot{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;background:var(--s2);border:1.5px dashed var(--bd);border-radius:var(--r-md);color:var(--t3);font-size:11px;cursor:pointer;transition:all .12s;font-family:var(--fb);max-width:180px}
.dslot:hover{border-color:var(--bd2);color:var(--t2)}
.dslot.filled{border-style:solid;background:var(--s3);color:var(--t1);border-color:var(--bd2)}
.dslot.picking{border-color:var(--acc)!important;background:var(--acc-bg)!important;color:var(--acc2)!important}
.dslot-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dslot-rm{font-size:10px;color:var(--t3);margin-left:2px;flex-shrink:0;transition:color .1s}
.dslot-rm:hover{color:#F43F5E}
.cat-block{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.cb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb-loadout{display:flex;gap:5px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--bd)}
.cat-lbl{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);min-width:36px;flex-shrink:0}

/* HOME SUMMARY (right panel in home mode) */
.home-sum-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.hsum-cat{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.hsum-cat-name{font-family:var(--fd);font-weight:700;font-size:12px;color:var(--t1)}
.hsum-stats{display:flex;flex-wrap:wrap;gap:3px}
.hsum-stat{font-family:var(--fm);font-size:8.5px;padding:2px 5px;background:var(--s3);border-radius:3px;color:var(--t2)}
.hsum-stat.hi{color:#34D399;background:rgba(52,211,153,.1)}
.hsum-stat.lo{color:#F87171;background:rgba(248,113,113,.1)}
.hsum-empty{font-size:11px;color:var(--t3);font-style:italic;text-align:center;padding:20px 10px}

/* RESULTS */
.sbx-results{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:center;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.sim-hdr{text-align:center;padding:4px 0 8px;width:100%;max-width:620px}
.sim-hdr h2{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--t1)}
.sim-hdr p{font-size:12px;color:var(--t3);margin-top:3px}
.sim-cat-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);overflow:hidden;width:100%;max-width:620px}
.scc-hdr{padding:10px 16px;background:color-mix(in srgb,var(--col-breed) 8%,var(--s2));border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scc-name{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--t1)}
.scc-stat-chips{display:flex;gap:5px;flex-wrap:wrap}
.scc-chip{font-family:var(--fm);font-size:8.5px;padding:2px 6px;background:var(--s3);border-radius:3px;color:var(--t2)}
.scc-events{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.scc-event{display:flex;gap:10px;align-items:flex-start}
.ev-ico{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.ev-fight-w{background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.28)}
.ev-fight-l{background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.2)}
.ev-friend-w{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.28)}
.ev-friend-l{background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.2)}
.ev-find{background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.28)}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:12.5px;font-weight:600;color:var(--t1);margin-bottom:3px}
.ev-detail{font-size:11px;color:var(--t2);line-height:1.5}
.ev-loot{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.loot-pill{font-family:var(--fm);font-size:9px;padding:3px 9px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:4px;white-space:normal;word-break:break-word;max-width:100%}
.scc-none{padding:16px;font-size:11px;color:var(--t3);font-style:italic;text-align:center}
.sim-footer{display:flex;gap:10px;max-width:620px;width:100%;justify-content:center;padding-bottom:8px}

/* ── RUN NARRATIVE ── */
.run-hdr{text-align:center;width:100%;max-width:640px;flex-shrink:0}
.run-hdr h2{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--t1)}
.run-timer-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:5px}
.run-timer-val{font-family:var(--fm);font-size:15px;font-weight:600;color:var(--acc2)}
.run-speed-note{font-family:var(--fm);font-size:8px;color:var(--t3);background:var(--s3);padding:2px 8px;border-radius:999px}
.run-skip-btn{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:6px 18px;background:none;border:1px solid var(--bd);border-radius:999px;color:var(--t2);cursor:pointer;transition:all .15s;flex-shrink:0}
.run-skip-btn:hover{border-color:var(--acc);color:var(--acc2)}
.run-pixel-stage{position:relative;width:100%;max-width:640px;height:126px;overflow:hidden;border:1px solid var(--bd);border-radius:var(--r-lg);background:#101720;box-shadow:0 16px 50px rgba(0,0,0,.22) inset;image-rendering:pixelated;flex-shrink:0}
.run-pixel-sky{position:absolute;inset:0 0 42px;background:linear-gradient(180deg,#172943,#101720)}
.run-pixel-moon{position:absolute;right:38px;top:18px;width:16px;height:16px;background:#d7deea;box-shadow:0 0 0 4px rgba(215,222,234,.08);border-radius:2px}
.run-pixel-city{position:absolute;left:0;right:0;bottom:38px;height:42px;background:repeating-linear-gradient(90deg,#202b3b 0 22px,#162131 22px 34px);opacity:.9;animation:run-city-scroll 18s linear infinite}
.run-pixel-city:after{content:"";position:absolute;inset:9px 0 0;background:repeating-linear-gradient(90deg,transparent 0 10px,#f6c96d 10px 13px,transparent 13px 24px)}
.run-pixel-road{position:absolute;left:0;right:0;bottom:0;height:42px;background:#1f2937;border-top:4px solid #334155;animation:run-road-scroll .9s linear infinite}
.run-pixel-road:after{content:"";position:absolute;left:0;right:0;top:18px;height:3px;background:repeating-linear-gradient(90deg,#f3c45f 0 24px,transparent 24px 54px)}
.run-pixel-cat{position:absolute;left:calc(11% + var(--lane)*50px);bottom:20px;transform:scale(.82);animation:run-cat-hop .42s steps(2,end) infinite;z-index:4}
.run-pixel-cat .gh-cat-face{animation:none}
.run-pixel-encounter{position:absolute;right:92px;bottom:23px;width:72px;height:62px;z-index:3;animation:run-encounter-pop .34s steps(3,end)}
.run-pixel-encounter .gh-cat-face{transform:scale(.78);animation:none}
.run-pixel-encounter[data-kind="fight"] .gh-cat-face{--cat-fur:#596173}
.run-pixel-encounter[data-kind="friend"] .gh-cat-face{--cat-fur:#c78a4b}
.run-pixel-encounter[data-kind="market"] .gh-cat-face{--cat-fur:#d1a65d}
.run-pixel-thing{position:absolute;left:14px;top:8px;width:38px;height:38px;image-rendering:pixelated}
.run-pixel-thing.loot{background:#f6c75a;clip-path:polygon(50% 0,63% 35%,100% 50%,63% 65%,50% 100%,37% 65%,0 50%,37% 35%);box-shadow:0 0 0 5px rgba(246,199,90,.14)}
.run-pixel-thing.escape{width:52px;height:20px;left:6px;top:24px;background:repeating-linear-gradient(90deg,#94a3b8 0 8px,transparent 8px 15px);opacity:.8}
.run-pixel-thing.market{width:44px;height:38px;left:8px;top:14px;background:#8b5e34;box-shadow:0 4px 0 #4b3324}
.run-pixel-thing.market:before{content:"";position:absolute;left:-4px;top:-12px;width:52px;height:14px;background:#d8a95b;clip-path:polygon(0 100%,12% 0,88% 0,100% 100%)}
.run-pixel-beat{position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:4px;border:1px solid rgba(255,255,255,.13);background:rgba(8,12,18,.78);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);max-width:230px;z-index:5}
.run-pixel-beat-icon{font-size:17px;line-height:1}
.run-pixel-prog{position:absolute;left:12px;right:12px;bottom:8px;height:4px;background:rgba(255,255,255,.11);border-radius:1px;overflow:hidden}
.run-pixel-prog span{display:block;height:100%;width:calc(var(--run-progress,0)*1%);background:var(--acc);transition:width .28s linear}
.run-pixel-stage[data-scene="fight"] .run-pixel-sky{background:linear-gradient(180deg,#382029,#141018)}
.run-pixel-stage[data-scene="friend"] .run-pixel-sky{background:linear-gradient(180deg,#17352a,#101720)}
.run-pixel-stage[data-scene="find"] .run-pixel-sky{background:linear-gradient(180deg,#26224b,#101720)}
@keyframes run-city-scroll{from{background-position:0 0}to{background-position:-340px 0}}
@keyframes run-road-scroll{from{background-position:0 0}to{background-position:-54px 0}}
@keyframes run-cat-hop{0%,100%{bottom:20px}50%{bottom:24px}}
@keyframes run-encounter-pop{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:560px){
  .run-pixel-stage{height:112px}
  .run-pixel-cat{left:calc(7% + var(--lane)*34px);transform:scale(.66)}
  .run-pixel-encounter{right:46px;transform:scale(.78);transform-origin:right bottom}
  .run-pixel-beat{left:10px;right:10px;top:8px;max-width:none;font-size:8px;padding:5px 8px}
}
.run-cat-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);width:100%;max-width:640px;padding-top:4px;flex-shrink:0}
.run-feed{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px}
.run-event{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:10px 14px;animation:ev-slide-in .38s cubic-bezier(.34,1.2,.64,1)}
@keyframes ev-slide-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.btl-details{border:none;outline:none}
.btl-details-summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:0;user-select:none}
.btl-details-summary::-webkit-details-marker{display:none}
.btl-summary-top{display:flex;align-items:center;gap:8px}
.btl-summary-title{font-size:12.5px;font-weight:600;color:var(--t1);flex:1;min-width:0}
.btl-summary-chev{font-size:12px;color:var(--t3);transition:transform .2s}
.btl-details[open] .btl-summary-chev{transform:rotate(90deg)}
.btl-summary-line{font-family:var(--fb);font-size:10.5px;color:var(--t3);line-height:1.45}
.loot-cards-section{width:100%;max-width:640px;flex-shrink:0}
.loot-cards-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);text-align:center;margin-bottom:14px}
.loot-cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
/* Bar animation on return from adventure */
@keyframes gh-bar-fill{from{width:var(--gh-bar-from)}to{width:var(--gh-bar-to)}}
.gh-need-fill-anim{animation:gh-bar-fill 1.1s cubic-bezier(.4,0,.2,1) forwards}
/* Stat diff labels */
.gh-diff{font-family:var(--fm);font-size:8px;font-weight:700;margin-left:5px;animation:gh-diff-fade 4s ease forwards}
.gh-diff.pos{color:#34D399}
.gh-diff.neg{color:#F43F5E}
@keyframes gh-diff-fade{0%,60%{opacity:1}100%{opacity:0}}
/* Compact loot rows */
.loot-details{border:none;outline:none}
.loot-details-summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0 6px;cursor:pointer;user-select:none;font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.loot-details-summary::-webkit-details-marker{display:none}
.loot-details-summary:hover{color:var(--t1)}
.loot-details-icon{font-size:14px;line-height:1}
.loot-details-lbl{flex:1}
.loot-details-count{background:var(--s3);border:1px solid var(--bd);border-radius:var(--r-f);padding:1px 7px;font-size:9px;color:var(--t3)}
.loot-details-chev{font-size:12px;color:var(--t3);transition:transform .2s}
.loot-details[open] .loot-details-chev{transform:rotate(90deg)}
.loot-rows{display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.loot-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);background:var(--s2);border:1px solid var(--bd);cursor:pointer;transition:border-color .15s}
.loot-row:hover{border-color:var(--acc)}
.loot-row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.loot-row-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.loot-row-name{font-family:var(--fb);font-size:12px;font-weight:600;color:var(--t1);white-space:normal;word-break:break-word}
.loot-row-effs{font-family:var(--fm);font-size:9px;color:var(--t3);white-space:normal;word-break:break-word}
.loot-row-rar{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.loot-row-arr{font-size:13px;color:var(--t3);flex-shrink:0}
.loot-empty{font-family:var(--fm);font-size:11px;color:var(--t3);text-align:center;padding:12px 0}
/* ── Loot footer — appended outside the scroll container ── */
.run-loot-footer{flex-shrink:0;display:flex;flex-direction:column;border-top:1px solid var(--bd);background:var(--bg)}
.run-loot-footer-scroll{overflow-y:auto;overflow-x:hidden;max-height:40vh;padding:16px 20px 8px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.run-loot-footer-btn{padding:12px 20px 16px;background:var(--bg)}

/* misc */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--t3)}
.empty-state p{font-size:12px;font-style:italic}

/* ── CARD LIGHTBOX MODAL ── */
.card-modal{position:absolute;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.card-modal.hidden{display:none}
.cmo-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer}
.cmo-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;animation:cmo-in .2s cubic-bezier(.34,1.4,.64,1)}
@keyframes cmo-in{from{opacity:0;transform:scale(.84) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* Lightbox card: same 1:1.4 TCG ratio as library cards, just larger */
.cmo-cv{width:300px!important;height:420px!important;display:flex!important;flex-direction:column!important}
.cmo-cv .cv-art{height:100px!important;font-size:48px!important;flex-shrink:0!important}
.cmo-cv .cv-art::after{display:none}
.cmo-cv .cv-hdr{flex-shrink:0!important;padding:10px 14px 8px!important}
.cmo-cv .cv-name{font-size:16px!important}
.cmo-cv .cv-body{flex:1!important;min-height:0!important;overflow:hidden!important;padding:10px 14px 10px!important;gap:8px!important}
.cmo-cv .cvs-n{font-size:9px!important;width:30px!important}
.cmo-cv .cvs-v{font-size:9px!important}
.cmo-cv .cvs-bar{height:4px!important}
.cmo-cv .cv-stats-grid{gap:3px 10px!important}
.cmo-cv .cv-desc{font-size:11.5px!important}
.cmo-cv .cv-subtext{font-size:10px!important}
.cmo-cv .cv-eff{font-size:10px!important;padding:3px 9px!important}
.cmo-cv .cv-foot{flex-shrink:0!important;padding:8px 14px 10px!important}
.cmo-cv .cv-cost{font-size:14px!important}
.cmo-cv .cv-hchip{font-size:10.5px!important}
.cmo-close{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:6px 18px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-f);color:var(--t2);cursor:pointer;transition:all .15s}
.cmo-close:hover{border-color:#F43F5E;color:#F43F5E}
.cmo-peek-close{position:absolute;top:16px;right:16px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cmo-peek-close:hover{border-color:#F43F5E;color:#F43F5E}
/* Card Edit Panel */
.card-edit-panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);width:300px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:cmo-in .18s cubic-bezier(.34,1.4,.64,1)}
.cep-title{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--t1);border-bottom:1px solid var(--bd);padding-bottom:8px;margin-bottom:2px}
.cep-row{display:flex;flex-direction:column;gap:3px}
.cep-lbl{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}

.eful-stat-row{display:flex;align-items:center;gap:8px}

  .eful-form{padding:14px 16px 8px}
}
.ncm-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}

.ncm-close-x{font-family:var(--fm);font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:var(--r-md);transition:all .12s}
.ncm-close-x:hover{color:#F43F5E}

.ncm-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)}

.ncm-section-title{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:2px}
.ncm-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 12px}

.ncm-stat-lbl{font-family:var(--fm);font-size:8.5px;color:var(--t3);width:32px;flex-shrink:0}

.ob-info-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}

/* Face-down draft card — flip mechanic */
@keyframes ob-card-pop{from{opacity:0;transform:scale(.88) translateY(6px)}to{opacity:1;transform:none}}
.ob-dc{aspect-ratio:5/7;border-radius:var(--r-md);cursor:pointer;position:relative;user-select:none;animation:ob-card-pop .18s ease both}
.ob-dc.locked{cursor:default;opacity:.45;pointer-events:none}
.ob-dc-inner{position:absolute;inset:0;border-radius:var(--r-md);transform-style:preserve-3d;transition:transform .46s cubic-bezier(.4,0,.2,1)}
.ob-dc-inner.flipped{transform:rotateY(180deg)}
.ob-dc-back{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--s2);border:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,box-shadow .15s}
.ob-dc:not(.locked):hover .ob-dc-back{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.ob-dc-front{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);overflow:hidden}
.ob-dc-logo{font-family:var(--fd);font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em}
.ob-dc-paw{font-size:22px;opacity:.35}
.ob-dc-num{font-family:var(--fm);font-size:9px;color:var(--t3)}
/* Reveal — full-height locked layout like draft-mode */
.onboard-ov.reveal-mode{overflow:hidden;padding:0;justify-content:stretch}
.ob-reveal{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;max-width:600px;margin:0 auto}
.ob-reveal-sticky-top{flex-shrink:0;padding:20px 20px 0;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg)}
.ob-reveal-title{font-family:var(--fd);font-size:clamp(22px,5vw,36px);font-weight:700;text-align:center}
.ob-reveal-sub{font-family:var(--fb);font-size:12px;color:var(--t2);text-align:center}
.ob-reveal-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 20px 8px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.ob-reveal-groups{display:flex;flex-direction:column;gap:18px;width:100%}
.ob-reveal-group{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ob-reveal-glbl{display:flex;align-items:center;gap:8px}
.ob-reveal-gname{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3)}
.ob-reveal-gcards{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start}
.ob-reveal-sticky-bot{flex-shrink:0;padding:12px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--bd)}
/* Flip card */
.ob-flip-wrap{width:130px;flex-shrink:0;perspective:700px;cursor:pointer}
.ob-flip-inner{width:100%;aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.ob-flip-inner.flipped{transform:rotateY(180deg)}
.ob-flip-back,.ob-flip-front{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ob-flip-back{background:var(--s2);border:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ob-flip-back-logo{font-family:var(--fd);font-size:9px;font-weight:700;color:var(--t3);letter-spacing:.1em}
.ob-flip-back-paw{font-size:28px;opacity:.3}
.ob-flip-front{transform:rotateY(180deg);overflow:hidden}
/* Draft/reveal reuse the real .cv card face (buildCardFaceHtml) so what
   you draft looks exactly like the card you end up with, full-bleed art
   included — scoped here to fill the flip-card container and shrink the
   inner text/art to fit these smaller sizes. */
.ob-dc-front .cv,.ob-flip-front .cv{width:100%;height:100%;display:flex;flex-direction:column;cursor:default}
/* Full-bleed art can land under the text anywhere — a busy photo makes
   name/stats unreadable without a scrim. Force a legible dark backing +
   light text here regardless of the card's own colors or the app theme,
   since this is standardized draft/reveal presentation, not the real card. */
.ob-dc-front .cv.art-full .cv-hdr,.ob-dc-front .cv.art-full .cv-body,.ob-dc-front .cv.art-full .cv-foot,
.ob-flip-front .cv.art-full .cv-hdr,.ob-flip-front .cv.art-full .cv-body,.ob-flip-front .cv.art-full .cv-foot{
  background:rgba(13,17,23,.62);--t1:#F3F5FC;--t2:#C7CEE0;--t3:#9AA3BC;
}
.ob-dc-front .cv .cv-art{height:64px!important;font-size:30px!important;flex-shrink:0!important}
.ob-dc-front .cv .cv-hdr{padding:8px 10px 6px!important}
.ob-dc-front .cv .cv-name{font-size:12px!important}
.ob-dc-front .cv .cv-body{flex:1!important;min-height:0!important;overflow:hidden!important;padding:6px 10px 6px!important;gap:5px!important;justify-content:flex-end!important}
.ob-dc-front .cv .cv-subtext{font-size:8.5px!important}
.ob-dc-front .cv .cvs-n,.ob-dc-front .cv .cvs-v{font-size:7px!important}
.ob-dc-front .cv .cv-foot{flex-shrink:0!important;padding:6px 10px 7px!important}

.ob-flip-front .cv.unaffordable{opacity:.35;filter:grayscale(.7)}
.ob-flip-front .cv .cv-art{height:38px!important;font-size:18px!important;flex-shrink:0!important}
.ob-flip-front .cv .cv-hdr{padding:6px 8px 4px!important}
.ob-flip-front .cv .cv-name{font-size:9.5px!important}
.ob-flip-front .cv .cv-series,.ob-flip-front .cv .cv-tlbl{font-size:6.5px!important}
.ob-flip-front .cv .cv-body{flex:1!important;min-height:0!important;overflow:hidden!important;padding:5px 8px 4px!important;gap:3px!important;justify-content:flex-end!important}
.ob-flip-front .cv .cv-subtext{font-size:7.5px!important}
.ob-flip-front .cv .cvs-n,.ob-flip-front .cv .cvs-v{font-size:6.5px!important}
.ob-flip-front .cv .cv-foot{flex-shrink:0!important;padding:4px 8px 5px!important}
.ob-flip-front .cv .cv-cost{font-size:10px!important}
.omc-info-btn{font-family:var(--fm);font-size:9px;width:18px;height:18px;border-radius:50%;border:1px solid var(--bd2);background:var(--s3);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;line-height:1;padding:0}
.omc-info-btn:hover{border-color:var(--acc);color:var(--acc2);background:var(--acc-bg)}
/* Budget bar */
.ob-budget-bar{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.ob-budget-row{display:flex;justify-content:space-between;align-items:baseline}
.ob-budget-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3)}
.ob-budget-num{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--acc2);transition:color .2s}
.ob-budget-num.danger{color:#F43F5E}
.ob-budget-spent-val{font-family:var(--fm);font-size:12px;color:var(--t2)}
.ob-budget-track{height:6px;background:var(--s3);border-radius:var(--r-f);overflow:hidden}
.ob-budget-fill{height:100%;background:var(--acc);border-radius:var(--r-f);transition:width .3s ease,background .2s}
.ob-budget-fill.danger{background:#F43F5E}
.ob-reveal-hint{font-family:var(--fb);font-size:11px;color:var(--t3);text-align:center;line-height:1.55}
@media(min-width:768px){
  .ob-draft-head{padding:26px 36px 18px}
  .ob-draft-scroll{padding:18px 40px}
  .ob-draft-title{font-size:34px}
  .ob-draft-foot{padding:14px 40px}
}
@media(max-width:767px){
  .ob-draft{max-width:700px}
  .ob-draft-head{padding:24px 20px 16px}
  .ob-draft-scroll{padding:16px 20px}
  .ob-draft-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ob-draft-title{font-size:clamp(22px,5vw,36px)}
  .ob-draft-foot{padding:14px 20px}
}

/* ── GAME HOME ── */
.game-ov{position:absolute;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.gh-hdr{flex-shrink:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--s1);border-bottom:1px solid var(--bd)}
.gh-home-name{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--t1);flex:1}
.gh-coins{font-family:var(--fm);font-size:12px;color:var(--acc2);display:flex;align-items:center;gap:5px}
.gh-hdr-right{display:flex;gap:12px;align-items:center}
.gh-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:20px}
.gh-cats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:860px}
.gh-cat{border:1px solid rgba(255,255,255,0.09);border-radius:0;padding:20px;display:flex;flex-direction:column;gap:14px;background:rgba(10,14,20,0.76);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.gh-cat-top{display:flex;align-items:center;gap:12px}
.gh-cat-face{--cat-fur:#d8b36a;position:relative;width:60px;height:54px;flex:0 0 60px;display:block;filter:drop-shadow(0 0 10px rgba(255,200,96,.16));animation:cat-face-bob 3.8s ease-in-out infinite;image-rendering:pixelated}
.gh-cat-face-head{position:absolute;left:23px;top:2px;width:34px;height:31px;background:var(--cat-fur);border-radius:4px 6px 5px 4px;box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.08) inset;z-index:2}
.gh-cat-face-head:before,.gh-cat-face-head:after{content:"";position:absolute;top:-9px;width:13px;height:13px;background:var(--cat-fur);clip-path:polygon(50% 0,0 100%,100% 100%)}
.gh-cat-face-head:before{left:2px}.gh-cat-face-head:after{right:2px}
.gh-cat-face-eye{position:absolute;top:11px;width:5px;height:6px;background:#0b111a;border-radius:1px;transition:height .22s,top .22s,transform .22s}
.gh-cat-face-eye.l{left:8px}.gh-cat-face-eye.r{right:8px}
.gh-cat-face-nose{position:absolute;left:15px;top:19px;width:4px;height:3px;background:#5c3041;border-radius:1px}
.gh-cat-face-mouth{position:absolute;left:14px;top:24px;width:7px;height:3px;border-bottom:2px solid #0b111a;border-radius:0 0 8px 8px;transition:all .22s}
.gh-cat-face-snout{position:absolute;right:-5px;top:13px;width:9px;height:7px;background:var(--cat-fur);border-radius:0 3px 3px 0}
.gh-cat-face-body{position:absolute;left:8px;bottom:9px;width:38px;height:20px;background:var(--cat-fur);border-radius:8px 4px 4px 5px;box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.06) inset;z-index:1}
.gh-cat-face-tail{position:absolute;left:1px;bottom:21px;width:18px;height:6px;background:var(--cat-fur);border-radius:6px 0 0 6px;box-shadow:-4px -5px 0 -1px var(--cat-fur);opacity:.95;transform-origin:right center;animation:cat-tail-sway 2.2s ease-in-out infinite}
.gh-cat-face-paw{position:absolute;bottom:4px;width:7px;height:8px;background:var(--cat-fur);border-radius:0 0 2px 2px;box-shadow:0 3px 0 rgba(0,0,0,.16);z-index:0}
.gh-cat-face-paw.p1{left:17px}.gh-cat-face-paw.p2{left:38px;animation-delay:.18s}
.gh-cat-face.walking .gh-cat-face-paw.p1,.run-pixel-cat .gh-cat-face-paw.p1{animation:cat-paw-step .32s steps(2,end) infinite}
.gh-cat-face.walking .gh-cat-face-paw.p2,.run-pixel-cat .gh-cat-face-paw.p2{animation:cat-paw-step .32s steps(2,end) infinite reverse}
.gh-cat-face.happy .gh-cat-face-eye{height:3px;top:13px;border-radius:999px}
.gh-cat-face.happy .gh-cat-face-mouth{height:5px;border-bottom-width:2px}
.gh-cat-face.ok .gh-cat-face-mouth{width:8px;height:1px;border-bottom-width:2px;border-radius:0;top:25px}
.gh-cat-face.sad .gh-cat-face-eye{height:5px;transform:translateY(1px)}
.gh-cat-face.sad .gh-cat-face-mouth{top:26px;height:5px;border-bottom:none;border-top:2px solid #0b111a;border-radius:8px 8px 0 0}
.gh-cat-face.hungry .gh-cat-face-mouth{left:15px;width:5px;height:5px;border:2px solid #0b111a;border-radius:50%}
.gh-cat-face.tired .gh-cat-face-eye{height:2px;top:14px}
.gh-cat-face.sleeping{animation:cat-face-sleep 4.8s ease-in-out infinite}
.gh-cat-face.sleeping .gh-cat-face-eye{height:2px;top:14px}
.gh-cat-face.sleeping .gh-cat-face-mouth{left:16px;width:4px;height:4px;border:2px solid #0b111a;border-radius:50%}
.gh-cat-face.sleeping:after{content:"Z";position:absolute;right:-1px;top:0;font-family:var(--fm);font-size:10px;color:#60a5fa;animation:cat-face-zzz 2.2s ease-in-out infinite}
@keyframes cat-face-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes cat-face-sleep{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(2px) rotate(1deg)}}
@keyframes cat-face-zzz{0%{opacity:0;transform:translate(0,5px)}35%{opacity:1}100%{opacity:0;transform:translate(7px,-12px)}}
@keyframes cat-tail-sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes cat-paw-step{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.gh-cat-info{flex:1}
.gh-cat-name{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--t1)}
.gh-cat-breed{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-top:1px}
.gh-cat-rep{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#f0a030;margin-top:3px;display:flex;align-items:center;gap:3px}
.gh-cat-rep-val{font-size:11px;font-weight:600;color:var(--acc2)}
.pvp-footer{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.pvp-rep-delta{font-family:var(--fm);font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--r-f);letter-spacing:.04em}
.pvp-rep-pos{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.pvp-rep-neg{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.pvp-rep-zero{background:var(--s3);color:var(--t3);border:1px solid var(--bd)}
.pvp-coins{font-family:var(--fm);font-size:10px;color:var(--acc2);padding:2px 8px;background:var(--acc-bg);border-radius:var(--r-f);border:1px solid rgba(240,160,48,.3)}
.pvp-ally{font-family:var(--fm);font-size:10px;color:#a855f7;padding:2px 8px;background:rgba(168,85,247,.1);border-radius:var(--r-f);border:1px solid rgba(168,85,247,.3)}
.pvp-befriended{font-family:var(--fm);font-size:10px;color:#34d399;padding:2px 8px;background:rgba(52,211,153,.1);border-radius:var(--r-f);border:1px solid rgba(52,211,153,.3);animation:_pulseG .6s ease 2}
.solo-run-banners{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.solo-run-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(240,160,48,.07);border:1px solid rgba(240,160,48,.28);border-radius:var(--r-md)}
.solo-run-icon{font-size:20px;line-height:1;flex-shrink:0}
.solo-run-body{flex:1;min-width:0}
.solo-run-title{font-family:var(--fb);font-size:12px;font-weight:600;color:var(--t1)}
.solo-run-desc{font-family:var(--fm);font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.solo-run-rewards{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.solo-rep{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--acc2);letter-spacing:.04em}
.solo-coins{font-family:var(--fm);font-size:10px;color:var(--acc2)}
.pvp-assist{font-family:var(--fm);font-size:10px;color:#60a5fa;padding:2px 8px;background:rgba(96,165,250,.1);border-radius:var(--r-f);border:1px solid rgba(96,165,250,.3)}
@keyframes _pulseG{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px rgba(52,211,153,.25)}}
/* ── ALLIES SECTION ── */
.gh-allies{margin-top:10px;padding-top:9px;border-top:1px solid rgba(52,211,153,.18)}
.gh-allies-hdr{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.gh-allies-title{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:#34d399}
.gh-allies-count{font-family:var(--fm);font-size:8.5px;color:var(--t3);margin-left:auto}
.gh-ally-list{display:flex;flex-direction:column;gap:5px}
.gh-ally-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15);border-radius:var(--r-md);transition:background .15s}
.gh-ally-chip:hover{background:rgba(52,211,153,.1)}
.gh-ally-emoji{font-size:18px;line-height:1;flex-shrink:0}
.gh-ally-info{flex:1;min-width:0}
.gh-ally-name{font-family:var(--fb);font-size:11px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-ally-owner{font-family:var(--fm);font-size:8.5px;color:var(--t3);letter-spacing:.03em}
.gh-ally-rep{font-family:var(--fm);font-size:9px;color:#fbbf24;flex-shrink:0}
.gh-allies-empty{font-family:var(--fb);font-size:11px;color:var(--t3);font-style:italic;padding:4px 0}
.gh-cat-name-row{display:flex;align-items:center;gap:8px;min-width:0}
.gh-cat-name-card{cursor:pointer;transition:color .15s ease}
.gh-cat-name-card:hover{color:var(--acc2)}
.gh-nick-btn{border:1px solid var(--bd);background:var(--s2);color:var(--acc2);border-radius:999px;padding:3px 8px;font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.gh-nick-btn:hover{border-color:var(--acc);color:var(--acc)}
.gh-nick-bonus{font-family:var(--fm);font-size:8px;color:#34d399;margin-left:4px}
.gh-needs{display:flex;flex-direction:column;gap:9px}
.gh-need-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.gh-need-lbl{font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3)}
.gh-need-pct{font-family:var(--fm);font-size:9px;color:var(--t2)}
.gh-need-bar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.gh-need-fill{height:100%;border-radius:4px;transition:width .6s ease}
.gh-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gh-act-btn{padding:8px 4px;font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:.06em;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);color:var(--t2);cursor:pointer;transition:all .15s;text-align:center}
.gh-act-btn:hover{border-color:var(--acc);color:var(--acc2)}
.gh-act-btn.on{border-color:var(--acc);color:var(--acc2);background:var(--acc-bg)}
.gh-cat-status{font-family:var(--fm);font-size:9px;color:var(--t3);text-align:center;padding-top:2px}
/* Care action sheet (feed/groom item picker) */
.gh-action-sheet{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.gh-action-sheet-title{font-family:var(--fm);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:2px}
.gh-care-option{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-md);border:1px solid var(--bd);background:var(--s3);cursor:pointer;transition:background .15s;text-align:left;width:100%}
.gh-care-option:hover{background:var(--s1)}
.gh-care-option-icon{font-size:20px;flex-shrink:0}
.gh-care-option-body{flex:1;min-width:0}
.gh-care-option-name{font-family:var(--fd);font-size:12px;color:var(--t1)}
.gh-care-option-desc{font-family:var(--fm);font-size:9.5px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-care-option-effects{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.gh-care-option-eff{font-family:var(--fm);font-size:8px;background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.25);border-radius:4px;padding:1px 5px;color:#60a5fa}
.gh-care-option-eff.stat{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.3);color:#34D399}
.gh-care-mkt-btn{width:100%;padding:10px;font-family:var(--fm);font-size:11px;font-weight:700;border-radius:var(--r-md);border:none;background:var(--acc);color:#0D1117;cursor:pointer;margin-top:2px}

/* Home tab */
.gh-home-tab{display:flex;flex-direction:column;gap:14px;width:100%;max-width:860px}

/* Cloud-backed card library: Supabase is the only source of card data.

let REMOTE_CARDS = null;

async function loadCardsFromCloud() {
  if (!db) return;
  const { data, error } = await db.from('cards').select('*');
  if (error || !data || !data.length) return;
  REMOTE_CARDS = data;
  try { localStorage.setItem('cz_remote_cards_cache', JSON.stringify(data)); } catch(e) {}
}

function baseLibrary() {
  if (REMOTE_CARDS) return REMOTE_CARDS;
  try {
    const cached = JSON.parse(localStorage.getItem('cz_remote_cards_cache') || 'null');
    if (cached && cached.length) return cached;
  } catch(e) {}
  return [];
}

function effectiveCard(card) {
  const edit = CARD_EDITS[card.id];
  if (!edit) return normalizeAbilityCard(card);
  // A local edit stamped against an older version of this card (server-side
  // change since) is dropped rather than merged against a shape it no longer matches.
  if (edit._baseUpdatedAt !== undefined && edit._baseUpdatedAt !== (card.updated_at || null)) {
    return normalizeAbilityCard(card);
  }
  const merged = {...card};
  if (edit.name !== undefined) merged.name = edit.name;
  if (edit.description !== undefined) merged.description = edit.description;
  if (edit.coin_cost !== undefined) merged.coin_cost = edit.coin_cost;
  if (edit.rarity !== undefined) merged.rarity = edit.rarity;
  if (edit.data) {
    merged.data = {...card.data, ...edit.data};
    if (edit.data.stats) merged.data.stats = {...card.data.stats, ...edit.data.stats};
    if (edit.data.effects) merged.data.effects = edit.data.effects;
    if (edit.data.ability_effects) merged.data.ability_effects = edit.data.ability_effects;
  }
  return normalizeAbilityCard(merged);
}

function getLibrary() { return [...baseLibrary().map(effectiveCard), ...CONSUMABLE_CARDS.map(effectiveCard), ...NPC_CARDS.map(effectiveCard), ...CUSTOM_CARDS.map(normalizeAbilityCard)]; }

function getCard(id) { return getLibrary().find(c => c.id === id) || null; }

function isOwnableCard(card) {
  return !!card && card.npc !== true && card.obtainable !== false;
}

function getAllPlayerCats() {
  const cats = [...(sbx.cats || [])];
  Object.values(sbx.savedHomes || {}).forEach(saved => {
    (saved.cats || []).forEach(cs => cats.push(cs));
  });
  return cats;
}

function hasNpcAlly(cardId) {
  return getAllPlayerCats().some(cs => (cs.allies || []).some(a => a.cardId === cardId));
}

function getMarketplaceDiscount() {
  const npc = getCard(MARKETPLACE_CAT_ID);
  if (!npc || !hasNpcAlly(MARKETPLACE_CAT_ID)) return 0;
  return Math.max(0, Math.min(0.8, npc.data?.market_discount || 0));
}

function getMarketPrice(cardOrId) {
  const card = typeof cardOrId === 'string' ? getCard(cardOrId) : cardOrId;
  const base = Math.max(0, (card && card.coin_cost) || 0);
  const discount = getMarketplaceDiscount();
  if (!discount || base <= 0) return base;
  return Math.max(1, Math.ceil(base * (1 - discount)));
}

function marketPriceHtml(cardOrId) {
  const card = typeof cardOrId === 'string' ? getCard(cardOrId) : cardOrId;
  const base = Math.max(0, (card && card.coin_cost) || 0);
  const price = getMarketPrice(card);
  return `🪙 ${price}${price < base ? `<span class="mkt-card-price-old">${base}</span>` : ''}`;
}

function saveCardEdit(id, patch) {
  const base = baseLibrary().find(c => c.id === id);

function escapeAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function cardArtHTML(card, tm) {
  if (card && card.image_url) {
    const art = card.art || {};
    const pos = art.position || { x:50, y:50 };

function parseModifier(str) {
  if (!str) return 0;
  const m = String(str).match(/([+-])(\d+)/);
  return m ? parseInt(m[1]+m[2]) : 0;
}

function getEffects(card) {
  const d = card.data;
  if (card.type === 'home_item') return []; // home items use development_rates, not instant effects
  if (card.type === 'battle_gear') return d.effects || [];
  if (card.type === 'special_ability') return [...(d.stat_buffs||[]), ...(d.penalties||[])];
  return [];
}

const ABILITY_EFFECT_DEFS = {
  crit_chance: { label:'Crit Chance', short:'CRIT', trigger:'fight_start', valueLabel:'crit' },
  opening_hit: { label:'Opening Hit', short:'OPENING HIT', trigger:'fight_start', valueLabel:'damage' },

  confuse: { label:'Confuse', short:'CONFUSE', trigger:'fight_start', valueLabel:'weaken' },
  bonus_loot: { label:'Bonus Loot', short:'BONUS LOOT', trigger:'loot_roll', valueLabel:'extra card' },
  loot_rarity_up: { label:'Loot Rarity Up', short:'LOOT UP', trigger:'loot_roll', valueLabel:'upgrade' },

  hunger_drain_reduce: { label:'Hunger Drain Reduce', short:'HUNGER SAVE', trigger:'run_end', valueLabel:'hunger' },
};
const ABILITY_TRIGGER_LABELS = {
  fight_start:'fight', on_hit:'hit', after_win:'win', loot_roll:'loot', social:'social',
  fight_loss:'loss', after_fight:'fight end', run_start:'run start', run_end:'return'
};
const ABILITY_LIMIT_LABELS = { always:'always', per_fight:'fight', once_per_run:'1x/run' };

function abilityShortText(effect) {
  if (!effect) return '';
  if (effect.short_text) return effect.short_text;
  const def = ABILITY_EFFECT_DEFS[effect.effect_type] || { short: (effect.effect_type || 'effect').replace(/_/g,' ').toUpperCase() };
  const chance = parseInt(effect.chance_percent) || 0;
  const limit = ABILITY_LIMIT_LABELS[effect.limit] || ABILITY_TRIGGER_LABELS[effect.trigger] || '';
  return `${chance ? chance + '% ' : ''}${def.short}${limit ? ' / ' + limit : ''}`;
}

function abilityFullText(effect) {
  if (!effect) return '';
  if (effect.full_text) return effect.full_text;
  const chance = parseInt(effect.chance_percent) || 0;
  const value = parseInt(effect.value) || 0;
  const c = chance ? `${chance}% chance to ` : '';
  switch (effect.effect_type) {
    case 'crit_chance': return `${c}make the first successful hit a critical hit.`;
    case 'opening_hit': return `${c}land a free opening hit${value ? ` for ${value} damage` : ''}.`;
    case 'first_dodge': return `${c}dodge the first incoming hit.`;
    case 'damage_boost': return `${c}increase outgoing fight damage by ${value || 20}%.`;
    case 'damage_reduce': return `${c}reduce incoming fight damage by ${value || 20}%.`;
    case 'confuse': return `${c}confuse the opponent and reduce their attack power.`;
    case 'bonus_loot': return `${c}find one extra loot card.`;
    case 'loot_rarity_up': return `${c}upgrade found loot by one rarity tier.`;
    case 'befriend_chance': return `${c}increase the chance to make a new ally.`;
    case 'escape': return `${c}escape a losing fight without extra penalties.`;
    case 'post_fight_heal': return `${c}recover ${value || 12} stamina after a fight.`;
    case 'energy_cost_reduce': return `Reduce outside energy cost by ${value || 15}%.`;
    case 'hunger_drain_reduce': return `Reduce hunger drain after returning by ${value || 15}%.`;
    default: return `${c}${(effect.effect_type || 'trigger an effect').replace(/_/g,' ')}.`;
  }
}

function inferAbilityEffects(card) {
  if (!card || card.type !== 'special_ability') return [];
  const data = card.data || {};
  if (Array.isArray(data.ability_effects) && data.ability_effects.length) return data.ability_effects;
  const text = `${card.name || ''} ${card.description || ''} ${data.positive_description || ''} ${data.negative_description || ''}`.toLowerCase();
  const mk = (effect_type, chance_percent, value, trigger, limit, short_text, full_text) => ({
    effect_type, chance_percent, value, trigger: trigger || (ABILITY_EFFECT_DEFS[effect_type] || {}).trigger || 'fight_start',
    limit: limit || 'per_fight', short_text, full_text
  });
  if (text.includes('smoke') || text.includes('escape')) return [mk('escape', 35, 0, 'fight_loss', 'once_per_run', '35% ESCAPE / loss')];
  if (text.includes('heal') || text.includes('rally') || text.includes('recover')) return [mk('post_fight_heal', 30, 14, 'after_fight', 'per_fight', '30% HEAL / fight')];
  if (text.includes('loot') || text.includes('treasure')) return [mk('loot_rarity_up', 15, 1, 'loot_roll', 'always', '15% LOOT UP')];
  if (text.includes('friend') || text.includes('ally') || text.includes('charm')) return [mk('befriend_chance', 25, 25, 'social', 'always', '+25% ALLY CHANCE')];
  if (text.includes('dodge')) return [mk('first_dodge', 25, 0, 'fight_start', 'per_fight', '25% FIRST DODGE')];
  if (text.includes('stun') || text.includes('catnip') || text.includes('confus') || text.includes('aoe')) return [mk('confuse', 22, 20, 'fight_start', 'per_fight', '22% CONFUSE')];
  if (text.includes('range') || text.includes('pounce') || text.includes('opening')) return [mk('opening_hit', 25, 10, 'fight_start', 'per_fight', '25% OPENING HIT')];
  if (text.includes('crit')) return [mk('crit_chance', 20, 20, 'fight_start', 'per_fight', '20% CRIT / fight')];
  if ((data.stat_buffs || []).length) return [mk('damage_boost', 20, 15, 'fight_start', 'per_fight', '20% DMG+ / fight')];
  return [];
}

function getAbilityEffects(card) {
  return inferAbilityEffects(card);
}

function normalizeAbilityCard(card) {
  if (!card || card.type !== 'special_ability') return card;
  const data = card.data || {};
  const ability_effects = getAbilityEffects({ ...card, data });
  return {
    ...card,
    data: {
      ...data,
      ability_effects,
      expiry: { type:'none' }
    }
  };
}

function abilityDisplayText(card) {
  const effects = getAbilityEffects(card);
  if (effects.length) return effects.map(abilityShortText).join(' · ');
  return card?.data?.positive_description || card?.description || '';
}

// Format development rates as readable chips, e.g. "+0.25 INT/24h"
function devRateChips(card) {
  if (!card || !card.data || !card.data.development_rates) return '';
  return card.data.development_rates.map(dr => {
    const statLbl = (dr.stat || '').slice(0,3).toUpperCase();
    const sign = dr.rate >= 0 ? '+' : '';
    const cls = dr.rate >= 0 ? 'pos' : 'neg';
    return `<span class="cv-eff ${cls}">${sign}${dr.rate} ${statLbl}/${dr.period_hours}h</span>`;
  }).join('');
}

function effectsHtml(card) {
  const effs = getEffects(card);
  if (!effs.length) return '';
  return effs.map(e => {
    const v = parseModifier(e.modifier);
    const cls = v >= 0 ? 'pos' : 'neg';
    return `<span class="ctile-eff ${cls}">${e.stat} ${v>=0?'+':''}${v}</span>`;
  }).join('');
}

/* ══════════════════════════════════════════
   LIBRARY RENDERING
══════════════════════════════════════════ */
const libFilter = { type:'all', rarity:'all', series:'all', search:'' };

function setFilter(key, val, btn) {
  if (key === 'type' || key === 'rarity') {
    const grpAttr = key === 'type' ? 'data-type' : 'data-rar';
    document.querySelectorAll(`[${grpAttr}]`).forEach(b => b.classList.remove('on'));
    if (btn) btn.classList.add('on');
    libFilter[key] = val;
  } else if (key === 'series') {
    document.querySelectorAll('[data-series]').forEach(b => b.classList.remove('on'));
    if (btn) btn.classList.add('on');
    libFilter.series = val;
  } else {
    libFilter.search = val.toLowerCase();
  }
  renderLibrary();
}

function getAllSeries() {
  const s = new Set();
  getLibrary().forEach(c => { if (c.series) s.add(c.series); });
  return [...s].sort();
}

function renderSeriesFilter() {
  const el = document.getElementById('lib-series-filter');
  if (!el) return;
  const series = getAllSeries();
  if (!series.length) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.innerHTML = `<span class="filter-lbl">Series</span>
    <button class="fchip${libFilter.series==='all'?' on':''}" data-series="all" onclick="setFilter('series','all',this)">All</button>
    <button class="fchip${libFilter.series===''?' on':''}" data-series="" onclick="setFilter('series','',this)">— None</button>
    ${series.map(s => `<button class="fchip${libFilter.series===s?' on':''}" data-series="${s}" onclick="setFilter('series','${s.replace(/'/g,"\\'")}',this)">${s}</button>`).join('')}`;
}

function renderLibrary() {
  const grid = document.getElementById('lib-grid');
  const filtered = getLibrary().filter(c => {
    if (libFilter.type !== 'all' && c.type !== libFilter.type) return false;
    if (libFilter.rarity !== 'all' && c.rarity !== libFilter.rarity) return false;
    if (libFilter.series !== 'all') {
      if (libFilter.series === '' && c.series) return false;
      if (libFilter.series !== '' && (c.series||'') !== libFilter.series) return false;
    }
    if (libFilter.search && !c.name.toLowerCase().includes(libFilter.search) &&
        !(c.description||'').toLowerCase().includes(libFilter.search) &&
        !(c.series||'').toLowerCase().includes(libFilter.search)) return false;
    return true;
  });
  document.getElementById('lib-count').textContent = `${filtered.length} card${filtered.length!==1?'s':''}`;
  grid.innerHTML = filtered.map(buildCardTile).join('');
  renderSeriesFilter();
}

function buildCardTile(card) {
  return buildCardFaceHtml(card, { onclick: `openCardModal('${card.id}')` });
}
