}

// ── Sell ──
function tcRenderSell() {
  const coins = PLAYER ? PLAYER.coins : sbx.coins;
  return `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="tcShowMenu()">← Trade Center</button>
      <span class="mkt-title">💰 Sell Cards</span>
      <span class="mkt-coins">🪙 ${coins}</span>
    </div>
    <div class="mkt-body">
      ${tcCardPickerToolbarHtml()}
      ${tcCardPickerGridHtml()}
    </div>
    <div class="trd-bulkbar">
      <span class="trd-bulk-count" id="trd-bulk-count">${TC_SELECTED.size} / 10 selected</span>
      <button class="ob-btn-primary" id="trd-bulk-action-btn" style="width:auto;padding:10px 24px;margin-left:auto" ${TC_SELECTED.size?'':'disabled'} onclick="tcGetSellQuote()">Get Quote</button>
    </div>`;
}

async function tcGetSellQuote() {
  const ids = [...TC_SELECTED];
  if (!ids.length) return;
  if (!db || !CZ_USER) { showCareToast('You must be signed in to sell cards.'); return; }
  const { data, error } = await db.rpc('quote_sell_price', { p_card_ids: ids });
  if (error || !data) { showCareToast('Could not get a quote — try again.'); return; }
  const total = data.reduce((s, r) => s + r.price, 0);
  const rows = data.map(r => {
    const card = getCard(r.card_id);
    return `<div class="trd-quote-row"><span>${card ? card.name : r.card_id}</span><span>🪙 ${r.price}</span></div>`;
  }).join('');
  showCarePopup(`
    <div class="care-popup-icon">💰</div>
    <div class="care-popup-title">Sell for ${total} coins?</div>
    <div class="trd-quote-list">${rows}</div>
    <button class="care-popup-btn primary" onclick="tcConfirmSell()">Confirm Sale</button>
    <button class="care-popup-btn secondary" onclick="dismissCarePopup()">Cancel</button>
  `);
}

async function tcConfirmSell() {
  const ids = [...TC_SELECTED];
  const { data: total, error } = await db.rpc('execute_sell', { p_card_ids: ids });
  if (error) { showCareToast('Sell failed — try again.'); return; }
  if (PLAYER && PLAYER.deckIds) PLAYER.deckIds = PLAYER.deckIds.filter(id => !ids.includes(id));
  sbx.deck = (sbx.deck || []).filter(entry => !ids.includes(typeof entry === 'string' ? entry : entry?.id));
  sbx.coins = (sbx.coins || 0) + total;
  if (PLAYER) PLAYER.coins = sbx.coins;
  dismissCarePopup();
  TC_SELECTED = new Set();
  showCareToast(`💰 Sold for +${total} coins!`);
  renderTradeCenter();
}

// ── Buy ──
async function tcLoadListings() {
  if (!db) return;
  const { data } = await db.from('market_listings').select('*').eq('status', 'active').order('created_at', { ascending: false });
  TC_LISTINGS = (data || []).filter(l => !l.expires_at || new Date(l.expires_at) > new Date());
  if (TC_VIEW === 'buy') renderTradeCenter();
}

function tcFormatTimeLeft(expiresAt) {
  const ms = new Date(expiresAt).getTime() - Date.now();
  if (ms <= 0) return 'Expired';
  const days = Math.floor(ms / 86400000);
  if (days >= 1) return `${days}d left`;
  const hrs = Math.floor(ms / 3600000);
  if (hrs >= 1) return `${hrs}h left`;
  return `${Math.max(1, Math.floor(ms / 60000))}m left`;
}

function tcRenderBuy() {
  const coins = PLAYER ? PLAYER.coins : sbx.coins;
  let body;
  if (!TC_LISTINGS.length) {
    body = `<div class="gh-empty">No listings available right now. Check back later!</div>`;
  } else {
    body = `<div class="gh-cards-tab"><div class="gh-card-grid">${TC_LISTINGS.map(l => {
      const card = getCard(l.card_id);
      if (!card) return '';
      const can = coins >= l.price;
      const timeLeft = l.expires_at ? tcFormatTimeLeft(l.expires_at) : '';
      return `<div class="gh-card-cell">
        ${buildCardFaceHtml(card, { standardLayout: true })}
        <div class="gh-card-meta trd-buy-foot">
          <span class="trd-buy-price">🪙 ${l.price}</span>
          ${timeLeft ? `<span class="trd-buy-time">${timeLeft}</span>` : ''}
          <button class="mkt-buy-btn"${can ? '' : ' disabled'} onclick="tcBuyListing('${l.id}')">Buy</button>
        </div>
      </div>`;
    }).join('')}</div></div>`;
  }
  return `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="tcShowMenu()">← Trade Center</button>
      <span class="mkt-title">🛍️ Buy Listings</span>
      <span class="mkt-coins">🪙 ${coins}</span>
    </div>
    <div class="mkt-body">${body}</div>`;
}

function tcBuyListing(listingId) {
  if (!db || !CZ_USER) { showCareToast('You must be signed in to buy.'); return; }
  const listing = TC_LISTINGS.find(l => l.id === listingId);
  const card = listing ? getCard(listing.card_id) : null;
  showCarePopup(`
    <div class="care-popup-icon">🛍️</div>
    <div class="care-popup-title">Buy ${card ? card.name : 'this card'}?</div>
    <div class="care-popup-desc">This costs ${listing ? listing.price : '?'} coins.</div>
    <button class="care-popup-btn primary" onclick="tcConfirmBuy('${listingId}')">Confirm Purchase</button>
    <button class="care-popup-btn secondary" onclick="dismissCarePopup()">Cancel</button>
  `);
}

async function tcConfirmBuy(listingId) {
  const listing = TC_LISTINGS.find(l => l.id === listingId);
  const { error } = await db.rpc('buy_listing', { p_listing_id: listingId });
  dismissCarePopup();
  if (error) { showCareToast(error.message || 'Purchase failed — try again.'); return; }
  if (listing) {
    if (PLAYER) { PLAYER.deckIds = [...(PLAYER.deckIds || []), listing.card_id]; PLAYER.coins -= listing.price; }
    sbx.deck = [...(sbx.deck || []), listing.card_id];
    sbx.coins = (sbx.coins || 0) - listing.price;
  }
  showCareToast('🛍️ Purchased!');
  await tcLoadListings();
}

// ── Trade ──
function tcRenderTrade() {
  const coins = PLAYER ? PLAYER.coins : sbx.coins;
  return `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="tcShowMenu()">← Trade Center</button>
      <span class="mkt-title">🔄 Propose a Trade</span>
      <span class="mkt-coins">🪙 ${coins}</span>
    </div>
    <div class="mkt-body">
      ${tcCardPickerToolbarHtml()}
      ${tcCardPickerGridHtml()}
    </div>
    <div class="trd-bulkbar">
      <input class="ob-input" id="trd-trade-callsign" type="text" placeholder="Recipient's callsign" style="flex:1;min-width:0;padding:10px 14px">
      <button class="ob-btn-primary" id="trd-bulk-action-btn" style="width:auto;padding:10px 20px;flex-shrink:0" ${TC_SELECTED.size ? '' : 'disabled'} onclick="tcSendTradeOffer()">Send Offer</button>
    </div>`;
}

async function tcSendTradeOffer() {
  const ids = [...TC_SELECTED];
  const input = document.getElementById('trd-trade-callsign');
  const callsign = (input?.value || '').trim();
  if (!callsign) { showCareToast('Enter a callsign to trade with.'); return; }
  if (!db || !CZ_USER) { showCareToast('You must be signed in to trade.'); return; }
  const { error } = await db.rpc('create_trade_offer', { p_to_callsign: callsign, p_offered_card_ids: ids });
  if (error) {
    showCareToast(error.code === 'P0002' ? 'No player found with that callsign.' : (error.message || 'Could not send offer — try again.'));
    return;
  }
  showCareToast(`🔄 Offer sent to ${callsign}!`);
  TC_SELECTED = new Set();
  tcShowMenu();
}

// ── Trade offer inbox + response (accept/decline) ──
async function loadInboxOffers() {
  if (!db || !CZ_USER) return;
  const { data } = await db.from('trade_offers')
    .select('*')
    .or(`from_player.eq.${CZ_USER.id},to_player.eq.${CZ_USER.id}`)
    .order('created_at', { ascending: false })
    .limit(30);
  GH_INBOX_OFFERS = data || [];
  GH_HAS_UNREAD = GH_INBOX_OFFERS.some(o => o.status === 'pending' && o.to_player === CZ_USER.id);
  if (GH_TAB === 'inbox') renderGameHome();
}

function buildTradeOfferInboxRows() {
  if (!CZ_USER || !GH_INBOX_OFFERS.length) return '';
  return GH_INBOX_OFFERS.map(o => {
    const incoming = o.to_player === CZ_USER.id;
    const counterparty = incoming ? o.from_callsign : o.to_callsign;
    const cardNames = (o.offered_card_ids || []).map(id => getCard(id)?.name || id).join(', ') || '—';
    if (o.status === 'pending' && incoming) {
      return `<div class="gh-inbox-msg" onclick="openTradeResponse('${o.id}')" style="cursor:pointer">
        <div class="gh-inbox-avatar">🔄</div>
        <div class="gh-inbox-body">
          <div class="gh-inbox-from">${escapeAttr(counterparty)} wants to trade</div>
          <div class="gh-inbox-text">Offering: ${escapeAttr(cardNames)}</div>
        </div>
        <div class="gh-inbox-unread"></div>
      </div>`;
    }
    if (o.status === 'pending') {
      return `<div class="gh-inbox-msg">
        <div class="gh-inbox-avatar">🔄</div>
        <div class="gh-inbox-body">
          <div class="gh-inbox-from">Waiting for ${escapeAttr(counterparty)}</div>
          <div class="gh-inbox-text">You offered: ${escapeAttr(cardNames)}</div>
        </div>
      </div>`;
    }
    const statusLabel = o.status === 'completed' ? 'Trade completed'
      : o.status === 'declined' ? (incoming ? 'You declined' : `${escapeAttr(counterparty)} declined`)
      : 'Trade cancelled';
    return `<div class="gh-inbox-msg">
      <div class="gh-inbox-avatar">${o.status === 'completed' ? '✅' : '✖️'}</div>
      <div class="gh-inbox-body">
        <div class="gh-inbox-from">${statusLabel}</div>
        <div class="gh-inbox-text">${escapeAttr(counterparty)} · ${escapeAttr(cardNames)}</div>
      </div>
    </div>`;
  }).join('');
}

function openTradeResponse(offerId) {
  const offer = GH_INBOX_OFFERS.find(o => o.id === offerId);
  if (!offer) return;
  TC_RESPONDING_OFFER = offer;
  TC_VIEW = 'respond';
  TC_SELECTED = new Set();
  document.getElementById('trade-ov').style.display = 'flex';
  renderTradeCenter();
}

function closeTradeResponse() {
  TC_RESPONDING_OFFER = null;
  document.getElementById('trade-ov').style.display = 'none';
  renderGameHome();
}

function tcRenderRespond() {
  const offer = TC_RESPONDING_OFFER;
  if (!offer) return tcRenderMenu();
  const offeredCards = (offer.offered_card_ids || []).map(id => getCard(id)).filter(Boolean);
  const offeredHtml = offeredCards.map(c => `<div class="gh-card-cell">${buildCardFaceHtml(c, { standardLayout: true })}</div>`).join('');
  return `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="closeTradeResponse()">← Home</button>
      <span class="mkt-title">🔄 Trade Offer</span>
      <span class="mkt-coins">🪙 ${PLAYER ? PLAYER.coins : sbx.coins}</span>
    </div>
    <div class="mkt-body">
      <div class="gh-cards-title" style="margin-bottom:8px">${escapeAttr(offer.from_callsign)} is offering:</div>
      <div class="gh-cards-tab" style="margin-bottom:16px"><div class="gh-card-grid">${offeredHtml}</div></div>
      <div class="gh-cards-title" style="margin-bottom:8px">Pick cards to offer back:</div>
      ${tcCardPickerToolbarHtml()}
      ${tcCardPickerGridHtml()}
    </div>
    <div class="trd-bulkbar">
      <button class="ob-btn-ghost" style="width:auto;padding:10px 20px" onclick="tcDeclineOffer('${offer.id}')">Decline</button>
      <span class="trd-bulk-count" id="trd-bulk-count">${TC_SELECTED.size} / 10 selected</span>
      <button class="ob-btn-primary" id="trd-bulk-action-btn" style="width:auto;padding:10px 24px;margin-left:auto" ${TC_SELECTED.size ? '' : 'disabled'} onclick="tcCompleteOffer('${offer.id}')">Confirm Trade</button>
    </div>`;
}

async function tcDeclineOffer(offerId) {
  const { error } = await db.rpc('decline_trade_offer', { p_offer_id: offerId });
  if (error) { showCareToast('Could not decline — try again.'); return; }
  showCareToast('Trade declined.');
  closeTradeResponse();
  await loadInboxOffers();
}

async function tcCompleteOffer(offerId) {
  const ids = [...TC_SELECTED];
  const offer = TC_RESPONDING_OFFER;
  const { error } = await db.rpc('complete_trade_offer', { p_offer_id: offerId, p_requested_card_ids: ids });
  if (error) { showCareToast(error.message || 'Trade failed — try again.'); return; }
  if (PLAYER && PLAYER.deckIds) {
    PLAYER.deckIds = PLAYER.deckIds.filter(id => !ids.includes(id));
    PLAYER.deckIds = [...PLAYER.deckIds, ...(offer.offered_card_ids || [])];
  }
  sbx.deck = (sbx.deck || []).filter(entry => !ids.includes(typeof entry === 'string' ? entry : entry?.id));
  sbx.deck = [...sbx.deck, ...(offer.offered_card_ids || [])];
  showCareToast('🔄 Trade complete!');
  closeTradeResponse();
  await loadInboxOffers();
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
initApp();
</script>
</body>
</html>
