function switchAuthTab(tab) {
  document.getElementById('ob-tab-new').classList.toggle('active', tab === 'new');
  document.getElementById('ob-tab-login').classList.toggle('active', tab === 'login');

  const target  = document.getElementById(tab === 'new' ? 'ob-form-new' : 'ob-form-login');
  const current = document.getElementById(tab === 'new' ? 'ob-form-login' : 'ob-form-new');
  if (target.style.display !== 'none') return; // already on this tab

  const wrap = document.getElementById('ob-form-wrap');
  wrap.style.height = wrap.offsetHeight + 'px'; // lock current height so the swap below doesn't jump
  current.style.display = 'none';
  target.style.display = '';
  requestAnimationFrame(() => { wrap.style.height = target.scrollHeight + 'px'; });
  clearTimeout(wrap._resetT);
  wrap._resetT = setTimeout(() => { wrap.style.height = 'auto'; }, 300);
}

function checkNewForm() {
  const name  = (document.getElementById('ob-name-input')?.value || '').trim();
  const email = (document.getElementById('ob-email-input')?.value || '').trim();
  const pass  = (document.getElementById('ob-pass-input')?.value || '');
  const btn   = document.getElementById('ob-start-btn');
  if (btn) btn.disabled = !(name && email && pass.length >= 6);
}

function skipAuth() {
  // Guest play — no Supabase account, localStorage only
  const nameEl = document.getElementById('ob-name-input');
  const name   = nameEl ? nameEl.value.trim() : 'Guest';
  ONBOARD.name = name || 'Guest';
  ONBOARD.draftStep = 0;
  ONBOARD.selections = [[], [], [], []];
  buildDraftPool();
  showOnboardStep('draft');
}

async function tryStartOnboard() {
  const name  = document.getElementById('ob-name-input')?.value.trim();
  const email = document.getElementById('ob-email-input')?.value.trim();
  const pass  = document.getElementById('ob-pass-input')?.value;
  const errEl = document.getElementById('ob-new-err');
  const btn   = document.getElementById('ob-start-btn');
  if (!name || !email || !pass) return;

  btn.disabled = true;
  btn.textContent = 'Creating account…';
  if (errEl) errEl.style.display = 'none';

  if (db) {
    const { data, error } = await db.auth.signUp({ email, password: pass });
    if (error) {
      if (errEl) { errEl.textContent = error.message; errEl.style.display = ''; }
      btn.disabled = false; btn.textContent = 'Begin Draft';
      return;
    }
    CZ_USER = data.user;
  }

  ONBOARD.name = name;
  ONBOARD.draftStep = 0;
  ONBOARD.selections = [[], [], [], []];
  buildDraftPool();
  showOnboardStep('draft');
}

async function tryLogin() {
  const email  = document.getElementById('ob-login-email')?.value.trim();
  const pass   = document.getElementById('ob-login-pass')?.value;
  const errEl  = document.getElementById('ob-login-err');
  const btn    = document.getElementById('ob-login-btn');
  if (!email || !pass) return;

  btn.disabled = true; btn.textContent = 'Logging in…';
  if (errEl) errEl.style.display = 'none';

  if (!db) { if (errEl) { errEl.textContent = 'Cloud not available.'; errEl.style.display = ''; } btn.disabled = false; btn.textContent = 'Login'; return; }

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) {
    if (errEl) { errEl.textContent = error.message; errEl.style.display = ''; }
    btn.disabled = false; btn.textContent = 'Login';
    return;
  }
  CZ_USER = data.user;
  const restored = await loadPlayerFromCloud(CZ_USER.id);
  if (!restored) {
    if (errEl) { errEl.textContent = 'No saved player found for this account.'; errEl.style.display = ''; }
    btn.disabled = false; btn.textContent = 'Login';
    CZ_USER = null;
    return;
  }
  // Hide onboard overlay and go to game
  const ov = document.getElementById('onboard');
  if (ov) ov.style.display = 'none';
  showGameHome();
}

function startOnboard() {
  // Legacy entry point — delegates to auth-aware version
  tryStartOnboard();
}

function buildDraftPool() {
  const cat = ONBOARD.draftCategories[ONBOARD.draftStep];
  let pool;
  if (cat === 'items') {
    // Combined battle_gear + home_item
    const starters = getLibrary().filter(c => isOwnableCard(c) && (c.type === 'battle_gear' || c.type === 'home_item') && c.is_starter === true);
    pool = starters.length >= 10 ? starters : getLibrary().filter(c => isOwnableCard(c) && (c.type === 'battle_gear' || c.type === 'home_item'));
  } else {
    // cat_breed and special_ability: use is_starter filter, fall back to all of that type
    const starters = getLibrary().filter(c => isOwnableCard(c) && c.type === cat && c.is_starter === true);
    pool = starters.length >= 10 ? starters : getLibrary().filter(c => isOwnableCard(c) && c.type === cat);
  }
  ONBOARD.pool = shuffleArr(pool).slice(0, 10);
  ONBOARD.pickedInCurrentStep = [];
}

function buildDraftHtml() {
  const step = ONBOARD.draftStep;
  const label = ONBOARD.draftLabels[step];
  const icon  = ONBOARD.draftIcons[step];
  const picked = ONBOARD.pickedInCurrentStep.length;

  const dots = ONBOARD.draftCategories.map((_, i) => {
    const cls = i < step ? 'done' : i === step ? 'active' : '';
    return (i > 0 ? '<div class="ob-prog-sep"></div>' : '') +
      `<div class="ob-prog-dot ${cls}">${ONBOARD.draftIcons[i]}</div>`;
  }).join('');

  const pickLimit = ONBOARD.draftCategories[step] === 'items' ? 5 : 3;
  const cards = ONBOARD.pool.map((_, ci) => buildDraftCardHtml(ci)).join('');

  return `<div class="ob-draft">
    <div class="ob-draft-head">
      <div class="ob-draft-progress">${dots}</div>
      <div class="ob-draft-title">${icon} ${label}</div>
      <div class="ob-pick-counter" id="ob-pick-counter">${picked}/${pickLimit} selected</div>
    </div>
    <div class="ob-draft-scroll">
      <div class="ob-draft-grid" id="ob-draft-grid">${cards}</div>
    </div>
    <div class="ob-draft-foot">
      <button class="ob-info-btn" onclick="showDraftInfo('${ONBOARD.draftCategories[ONBOARD.draftStep]}')" title="What do these stats mean?">ℹ</button>
      <button class="ob-btn-primary" id="ob-draft-continue" style="max-width:260px;width:100%"
        ${picked < pickLimit ? 'disabled' : ''} onclick="draftContinue()">
        ${step < 3 ? 'Next →' : 'See All Picks →'}
      </button>
    </div>
  </div>`;
}

function buildDraftCardHtml(ci) {
  const card = ONBOARD.pool[ci];
  const sel  = ONBOARD.pickedInCurrentStep.includes(ci);
  const num  = String(ci + 1).padStart(2, '0');
  return `<div class="ob-dc${sel ? ' selected' : ''}" id="ob-dc-${ci}" style="animation-delay:${ci * 30}ms" onclick="toggleDraftPick(${ci})"${sel ? ` data-peek-card="${card.id}"` : ''}>
    <div class="ob-dc-inner${sel ? ' flipped' : ''}" id="ob-dci-${ci}">
      <div class="ob-dc-back">

      </div>
      <div class="ob-dc-front">${buildCardFaceHtml(card, { showDesc: false, standardLayout: true })}</div>
    </div>
  </div>`;
}

function toggleDraftPick(ci) {
  const pickLimit = ONBOARD.draftCategories[ONBOARD.draftStep] === 'items' ? 5 : 3;
  // Already flipped — no going back
  if (ONBOARD.pickedInCurrentStep.includes(ci)) return;
  // Already at limit — no more flips allowed
  if (ONBOARD.pickedInCurrentStep.length >= pickLimit) return;

  ONBOARD.pickedInCurrentStep.push(ci);
  const dc    = document.getElementById(`ob-dc-${ci}`);
  const inner = document.getElementById(`ob-dci-${ci}`);
  if (dc)    { dc.classList.add('selected'); dc.dataset.peekCard = ONBOARD.pool[ci].id; }
  if (inner) inner.classList.add('flipped');

  const n       = ONBOARD.pickedInCurrentStep.length;
  const counter = document.getElementById('ob-pick-counter');
  const btn     = document.getElementById('ob-draft-continue');
  if (counter) counter.textContent = `${n}/${pickLimit} selected`;
  if (btn)     btn.disabled = n < pickLimit;

  // Lock remaining unflipped cards once limit is reached
  if (n >= pickLimit) {
    document.querySelectorAll('.ob-dc:not(.selected)').forEach(el => el.classList.add('locked'));
  }
}

function triggerRevealFlips() {
  const total = ONBOARD.revealCards.length;
  for (let i = 0; i < total; i++) {
    setTimeout(() => {
      const el = document.getElementById(`ob-fi-${i}`);
      if (el) el.classList.add('flipped');
      if (i === total - 1) setTimeout(updateRevealBudget, 100);
    }, 150 + i * 130);
  }
}

function toggleRevealPick(gIdx) {
  const card = ONBOARD.revealCards[gIdx];
  if (!card) return;
  const fi = document.getElementById(`ob-fi-${gIdx}`);
  if (!fi || !fi.classList.contains('flipped')) return;
  if (ONBOARD.purchaseSet.has(card.id)) {
    ONBOARD.purchaseSet.delete(card.id);
  } else {
    ONBOARD.purchaseSet.add(card.id);
  }
  const cv   = document.querySelector(`#ob-ff-${gIdx} .cv`);
  const keeping = ONBOARD.purchaseSet.has(card.id);
  if (cv) cv.classList.toggle('unaffordable', !keeping);
  updateRevealBudget();
}

function calcSpent() {
  return ONBOARD.revealCards.filter(c => ONBOARD.purchaseSet.has(c.id)).reduce((s,c) => s + (c.coin_cost||0), 0);
}

function getRevealRequirements() {
  const kept = ONBOARD.revealCards.filter(c => ONBOARD.purchaseSet.has(c.id));
  const hasCat = kept.some(c => c.type === 'cat_breed');
  const hasHome = kept.some(c => c.type === 'home');
  const missing = [];
  if (!hasCat) missing.push('1 cat');
  if (!hasHome) missing.push('1 home');
  return { valid: missing.length === 0, missing };
}

function updateRevealBudget() {
  const spent     = calcSpent();
  const remaining = ONBOARD.startingCoins - spent;
  const pct       = Math.min(100, Math.round((spent / ONBOARD.startingCoins) * 100));
  const danger    = remaining < 0;
  const req       = getRevealRequirements();
  const numEl   = document.getElementById('ob-budget-num');
  const spentEl = document.getElementById('ob-budget-spent');
  const fillEl  = document.getElementById('ob-budget-fill');
  const finBtn  = document.getElementById('ob-finish-btn');
  const csRem   = document.getElementById('ob-cs-remaining');
  const overMsg = document.getElementById('ob-over-msg');
  if (numEl)  { numEl.textContent = remaining; numEl.className = danger ? 'ob-budget-num danger' : 'ob-budget-num'; }
  if (spentEl) spentEl.textContent = spent + ' coins';
  if (fillEl)  { fillEl.style.width = pct + '%'; fillEl.className = danger ? 'ob-budget-fill danger' : 'ob-budget-fill'; }
  if (finBtn)  finBtn.disabled = danger || !req.valid;
  if (csRem)   { csRem.textContent = remaining; csRem.style.color = danger ? '#F43F5E' : 'var(--acc2)'; }
  const cs = document.getElementById('ob-coin-status');
  if (cs) cs.style.color = danger ? '#F43F5E' : 'var(--t2)';
  if (overMsg) {
    if (danger) {
      overMsg.style.display = 'block';
      overMsg.textContent = `⚠️ Over budget by ${Math.abs(remaining)} coins — deselect a card to continue.`;
    } else if (!req.valid) {
      overMsg.style.display = 'block';
      overMsg.textContent = `Pick at least ${req.missing.join(' and ')} before beginning.`;
    } else {
      overMsg.style.display = 'none';
    }
  }
}

function completeOnboarding() {
  const kept  = ONBOARD.revealCards.filter(c => ONBOARD.purchaseSet.has(c.id));
  const req = getRevealRequirements();
  if (!req.valid) {
    updateRevealBudget();
    return;
  }
  const spent = calcSpent();
  const player = {
    name: ONBOARD.name, registered: true,
    coins: ONBOARD.startingCoins - spent,
    deckIds: kept.map(c => c.id),
    cardSerials: {},
    inventory: {}
  };
  PLAYER = player;
  sbx.deck  = kept.map(c => c.id);
  sbx.coins = player.coins;
  const keptBreeds    = kept.filter(c => c.type === 'cat_breed');
  const keptHomes     = kept.filter(c => c.type === 'home');
  const keptHomeItems = kept.filter(c => c.type === 'home_item');
  const firstHome = keptHomes[0] || null;
  sbx.home = firstHome;
  if (keptBreeds.length) {
    // Gear/abilities are each unique to one cat at a time (see home usage
    // in renderGameHome) — start every cat unequipped and let the player
    // assign drafted gear/abilities from their deck via the Gear/Abilities
    // dropdowns, instead of attaching the same cards to every cat at once.
    sbx.cats = keptBreeds.map(b => ({ breed: b, gear: [], abilities: [], home_joined_at: Date.now(), home_dev_gains: {}, rep: 100, allies: [] }));
    const maxSlots = firstHome && firstHome.data ? (firstHome.data.expansion_slots || 0) : 0;
    sbx.homeItems = [];
    let usedSlots = 0;
    keptHomeItems.forEach(item => {
      const slotCost = getHomeSlotCost(item);
      if (usedSlots + slotCost <= maxSlots) {
        sbx.homeItems.push(item);
        usedSlots += slotCost;
      }
    });
  }
  // Save to localStorage
  try { localStorage.setItem('cz_player', JSON.stringify(player)); } catch(e) {}
  // Save to Supabase if signed in
  savePlayerToCloud();
  const ov = document.getElementById('onboard');
  if (ov) { ov.style.opacity = '0'; ov.style.transition = 'opacity .45s ease'; setTimeout(() => { ov.style.display = 'none'; ov.style.opacity = ''; }, 500); }
  setTimeout(showGameHome, 480);
}

function startSimulation() {
  // Reset simulation state
  PLAYER = null;
  sbx.cats = [];
  sbx.deck = [];
  sbx.coins = 1500;
  // Clear care state so cats start fresh
  CAT_CARE = {};
  try { localStorage.removeItem('cz_cat_care'); } catch(e) {}
  // Show onboarding
  const gh = document.getElementById('game-home'); if (gh) gh.style.display = 'none';
  const mkt = document.getElementById('market-ov'); if (mkt) mkt.style.display = 'none';
  const op = document.getElementById('outing-picker-ov'); if (op) op.style.display = 'none';
  showOnboardStep('register');
}

async function initApp() {
  renderLibrary();
  // Pull the live card library from Supabase; a slow/dead network just
  // means we keep whatever baseLibrary() already fell back to.
  try {
    await loadCardsFromCloud();
    renderLibrary();
    if (typeof renderShopBrowser === 'function') renderShopBrowser();
  } catch(e) { /* keep local/bootstrap library */ }
  // Check for an existing Supabase session (returning player)
  if (db) {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        CZ_USER = session.user;
        const restored = await loadPlayerFromCloud(CZ_USER.id);
        if (restored) {
          showGameHome();
          return;
        }
      }
    } catch(e) { /* no session — fall through to onboarding */ }
  }
  // New player or guest — show onboarding
  startSimulation();
}

let GAME_CARE_TIMER = null;

const CAT_EMOJIS = {
  'breed-001':'😺','breed-002':'🐯','breed-003':'🦁',
  'breed-004':'🐆','breed-005':'😾','breed-006':'👑',
  'breed-007':'😤','breed-008':'😌','breed-009':'⚡',
  'breed-010':'😏','breed-011':'🦾'
};

function getCatEmoji(card) { return CAT_EMOJIS[card && card.id] || '🐱'; }

function cardIdOf(entry) {
  return typeof entry === 'string' ? entry : (entry && entry.id);
}

function cardObjOf(entry) {
  return typeof entry === 'string' ? getCard(entry) : entry;
}

function getOwnedCardCounts(deckEntries) {
  return (deckEntries || []).reduce((counts, entry) => {
    const id = cardIdOf(entry);
    if (id) counts[id] = (counts[id] || 0) + 1;
    return counts;
  }, {});
}

function uniqueCards(cards) {
  const seen = new Set();
  return (cards || []).filter(card => {
    if (!card || seen.has(card.id)) return false;
    seen.add(card.id);
    return true;
  });
}

function getHomeSlotCost(card) {
  return Math.max(1, (card && card.data && card.data.slot_requirement) || 1);
}

function getGearSlotCost(card) {
  return Math.max(1, (card && card.data && card.data.gear_slot) || 1);
}

function getCatCarrySlots(catSetup) {
  return Math.max(0, (catSetup && catSetup.breed && catSetup.breed.data && catSetup.breed.data.base_inventory_slots) || 0);
}

function getCatUsedCarrySlots(gearEntries) {
  return (gearEntries || []).reduce((total, entry) => total + getGearSlotCost(cardObjOf(entry)), 0);
}

function normalizeCatGearForSlots(catSetup) {
  if (!catSetup || !Array.isArray(catSetup.gear)) return { gear: [], usedSlots: 0, removed: [] };
  const maxSlots = getCatCarrySlots(catSetup);
  const kept = [];
  const removed = [];
  let usedSlots = 0;
  catSetup.gear.forEach(entry => {
    const card = cardObjOf(entry);
    if (!card) return;
    const slotCost = getGearSlotCost(card);
    if (slotCost <= 0 || usedSlots + slotCost > maxSlots) {
      removed.push(card);
      return;
    }
    kept.push(card.id);
    usedSlots += slotCost;
  });
  if (removed.length || kept.length !== catSetup.gear.length || catSetup.gear.some(entry => typeof entry !== 'string')) {
    catSetup.gear = kept;
  }
  return { gear: kept, usedSlots, removed };
}

function getConsumableUses(card) {
  if (!card || card.type !== 'consumable') return 0;
  const inv = (PLAYER && PLAYER.inventory) || {};
  return inv[card.id] || 0;
}

function formatConsumableEffects(card) {
  if (!card || !card.data) return '';
  const d = card.data;
  return [
    d.hunger ? `+${d.hunger} Hunger` : '',
    d.energy ? `+${d.energy} Energy` : '',
    d.mood ? `+${d.mood} Mood` : '',
    ...(d.statBoosts ? Object.entries(d.statBoosts).map(([stat, val]) => `+${val} ${stat}`) : []),
    `${d.max_uses || 1} use${(d.max_uses || 1) === 1 ? '' : 's'}`
  ].filter(Boolean);
}

function consumeCardUse(cardId) {
  if (!PLAYER || !PLAYER.inventory) return 0;
  const card = getCard(cardId);
  const maxUses = Math.max(1, (card && card.data && card.data.max_uses) || 1);
  const remaining = (PLAYER.inventory[cardId] || 0) - 1;
  if (remaining > 0) {
    PLAYER.inventory[cardId] = remaining;
  } else {
    delete PLAYER.inventory[cardId];
  }
  if (remaining <= 0 || remaining % maxUses === 0) {
    const idx = (PLAYER.deckIds || []).indexOf(cardId);
    if (idx >= 0) PLAYER.deckIds.splice(idx, 1);
    const sbxIdx = (sbx.deck || []).findIndex(entry => cardIdOf(entry) === cardId);
    if (sbxIdx >= 0) sbx.deck.splice(sbxIdx, 1);
  }
  return Math.max(0, remaining);
}

function syncConsumableDeckCopies(player = PLAYER) {
  if (!player || !player.inventory) return;
  player.deckIds = player.deckIds || [];
  CONSUMABLE_CARDS.forEach(card => {
    const uses = player.inventory[card.id] || 0;
    const maxUses = Math.max(1, (card.data && card.data.max_uses) || 1);
    const neededCopies = Math.ceil(uses / maxUses);
    const currentCopies = player.deckIds.filter(id => id === card.id).length;
    for (let i = currentCopies; i < neededCopies; i++) player.deckIds.push(card.id);
    if (currentCopies > neededCopies) {
      let toRemove = currentCopies - neededCopies;
      player.deckIds = player.deckIds.filter(id => id !== card.id || toRemove-- <= 0);
    }
  });
}

function awardOwnedCard(cardId) {
  const card = cardId ? getCard(cardId) : null;
  if (!isOwnableCard(card)) return false;
  if (PLAYER && card.type === 'consumable') {
    PLAYER.inventory = PLAYER.inventory || {};
    PLAYER.inventory[cardId] = (PLAYER.inventory[cardId] || 0) + ((card.data && card.data.max_uses) || 1);
  }
  if (PLAYER) PLAYER.deckIds = [...(PLAYER.deckIds || []), cardId];
  sbx.deck = [...(sbx.deck || []), cardId];
  return true;
}

function getCurrentHomeId() {
  return cardIdOf(sbx.home);
}

// Every card id currently equipped/in-use somewhere — shared by the Cards
// tab and the Trade Center (Sell/Trade pickers only offer inactive cards).
function getActiveCardIds() {
  const cats = sbx.cats || [];
  const homeUsageCounts = getHomeUsageCounts();
  return new Set([
    ...Object.keys(sbx.savedHomes || {}),
    getCurrentHomeId(),
    ...cats.map(cs => cs.breed && cs.breed.id).filter(Boolean),
    ...cats.flatMap(cs => (cs.gear || []).map(g => typeof g === 'string' ? g : (g && g.id))).filter(Boolean),
    ...cats.flatMap(cs => (cs.abilities || []).map(a => typeof a === 'string' ? a : (a && a.id))).filter(Boolean),
    ...Object.keys(homeUsageCounts.cat_breed),
    ...Object.keys(homeUsageCounts.home_item),
    ...Object.keys(homeUsageCounts.battle_gear),
    ...Object.keys(homeUsageCounts.special_ability),
  ]);
}

function getHomeEnvProfile(homeCard) {
  const name = ((homeCard && homeCard.name) || '').toLowerCase();
  const id = ((homeCard && homeCard.id) || '').toLowerCase();
  const key = `${id} ${name}`;
  if (key.includes('forest') || key.includes('cabin') || key.includes('garden')) {
    return { kind:'forest', icon:'🌲', name:'Forest' };
  }
  if (key.includes('mansion') || key.includes('estate') || key.includes('villa')) {
    return { kind:'estate', icon:'🏛️', name:'Estate' };
  }
  if (key.includes('loft') || key.includes('studio')) {
    return { kind:'studio', icon:'🛋️', name:'Studio' };
  }
  return { kind:'urban', icon:'🏙️', name:'Urban' };
}

function getCatFaceMood(state) {
  if (state.isResting) return 'sleeping';
  if (state.energy < 35) return 'tired';
  if (state.hunger < 35) return 'hungry';
  if (state.mood < 45) return 'sad';
  if (state.mood >= 72 && state.energy >= 45 && state.hunger >= 45) return 'happy';
  return 'ok';
}

function getCatFaceColor(breed, index) {
  const colors = ['#d8b36a', '#c9c2b8', '#8f8173', '#f1d7a5', '#9ea7b3', '#c07a4a', '#2f3440'];
  const key = `${breed?.id || ''}${breed?.name || ''}`;
  const seed = [...key].reduce((sum, ch) => sum + ch.charCodeAt(0), index || 0);
  return colors[seed % colors.length];
}

function getHomeUsageCounts() {
  const counts = { cat_breed:{}, home_item:{}, battle_gear:{}, special_ability:{} };
  const add = (type, id) => {
    if (!id || !counts[type]) return;
    counts[type][id] = (counts[type][id] || 0) + 1;
  };
  const addCatSetup = cs => {
    add('cat_breed', cardIdOf(cs && cs.breed));
    (cs && cs.gear || []).forEach(g => add('battle_gear', cardIdOf(g)));
    (cs && cs.abilities || []).forEach(a => add('special_ability', cardIdOf(a)));
  };
  const currentHomeId = getCurrentHomeId();
  Object.entries(sbx.savedHomes || {}).forEach(([homeId, saved]) => {
    if (homeId === currentHomeId) return;
    (saved.cats || []).forEach(addCatSetup);
    (saved.homeItems || []).forEach(item => add('home_item', cardIdOf(item)));
  });
  (sbx.cats || []).forEach(addCatSetup);
  (sbx.homeItems || []).forEach(item => add('home_item', cardIdOf(item)));
  return counts;
}

function normalizeHomeItemsForSlots(maxSlots) {
  const normalized = [];
  let usedSlots = 0;
  (sbx.homeItems || []).forEach(item => {
    const card = cardObjOf(item);
    if (!card || card.type !== 'home_item') return;
    const slotCost = getHomeSlotCost(card);
    if (usedSlots + slotCost > maxSlots) return;
    normalized.push(card);
    usedSlots += slotCost;
  });
  sbx.homeItems = normalized;
  return { items: normalized, usedSlots };
}

function setGhCardFilter(key, value) {

}

// Periodic tick: update only the hunger/mood/energy bar widths + labels in
// place (no innerHTML rebuild), so the .gh-need-fill CSS transition eases
// smoothly from the current value to the new one instead of the whole
// screen re-rendering and every bar snapping back to 0% and refilling.
function updateGameHomeBars() {
  const gh = document.getElementById('game-home');
  if (!gh || gh.style.display === 'none') return;
  if (checkAutoSleepCats()) return;
  const cats = sbx.cats || [];
  const catEls = gh.querySelectorAll('.gh-cats-scroll .gh-cat');
  catEls.forEach((catEl, ci) => {
    const cs = cats[ci];
    if (!cs) return;
    const needsEl = catEl.querySelector('.gh-needs');
    if (!needsEl) return;
    const state = getLiveCatState(ci, cs);
    const needValues = {
      hunger: Math.round(state.hunger),
      mood: Math.round(state.mood),
      energy: Math.round(state.energy),
    };
    const colFor = (need, v) => need === 'energy'
      ? (v > 60 ? '#60A5FA' : v > 30 ? '#F0A030' : '#F43F5E')
      : (v > 60 ? '#34D399' : v > 30 ? '#F0A030' : '#F43F5E');
    const blocks = needsEl.querySelectorAll('.gh-need-block[data-need]');
    blocks.forEach(block => {
      const need = block.dataset.need;
      const pct = needValues[need];
      if (pct === undefined) return;
      const fillEl = block.querySelector('.gh-need-fill');
      const pctEl = block.querySelector('.gh-need-pct');
      if (fillEl) { fillEl.style.width = pct + '%'; fillEl.style.background = colFor(need, pct); fillEl.dataset.w = pct; }
      if (pctEl) pctEl.textContent = pct + '%';
    });
  });
}

// Drive all [data-w] bars to their target widths when a render intentionally
// starts them from a different value, such as the post-adventure diff view.
function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.gh-need-fill[data-w]').forEach(el => {
      el.style.width = el.dataset.w + '%';
    });
  });
}

// Re-render while keeping horizontal carousel and active-card vertical scroll in place
function renderGameHomeKeepScroll() {
  const scrollEl  = document.getElementById('gh-cats-scroll');
  const scrollLeft = scrollEl ? scrollEl.scrollLeft : 0;
  const barSnapshots = Array.from(document.querySelectorAll('.gh-cats-scroll .gh-need-fill[data-w]')).map(el => {
    const pctEl = el.closest('.gh-need-bar')?.previousElementSibling?.querySelector('.gh-need-pct');
    return {
      width: parseFloat(el.style.width || el.dataset.w || '0') || 0,
      pct: pctEl ? (parseFloat(pctEl.textContent) || 0) : null,
    };
  });
  // Capture vertical scroll of the currently-visible cat card
  let cardScrollTop = 0;
  if (scrollEl) {
    const cards = scrollEl.querySelectorAll('.gh-cat');
    const cardW = scrollEl.offsetWidth || 1;
    const activeIdx = Math.min(Math.round(scrollLeft / cardW), cards.length - 1);
    if (cards[activeIdx]) cardScrollTop = cards[activeIdx].scrollTop;
  }

  renderGameHome();

  // Restore scroll positions after DOM replacement
  requestAnimationFrame(() => {
    const newScroll = document.getElementById('gh-cats-scroll');
    if (newScroll) {
      newScroll.scrollLeft = scrollLeft;
      const newCards = newScroll.querySelectorAll('.gh-cat');
      const cardW = newScroll.offsetWidth || 1;
      const activeIdx = Math.min(Math.round(scrollLeft / cardW), newCards.length - 1);
      if (newCards[activeIdx]) newCards[activeIdx].scrollTop = cardScrollTop;
    }
    const newFills = Array.from(document.querySelectorAll('.gh-cats-scroll .gh-need-fill[data-w]'));
    const pctEls = newFills.map(el => el.closest('.gh-need-bar')?.previousElementSibling?.querySelector('.gh-need-pct'));
    const targets = newFills.map(el => parseFloat(el.dataset.w || '0') || 0);
    newFills.forEach((el, i) => {
      const snap = barSnapshots[i];
      if (!snap) return;
      el.style.transition = 'none';
      el.style.width = snap.width + '%';
      if (pctEls[i] && snap.pct !== null) pctEls[i].textContent = Math.round(snap.pct) + '%';
    });
    newFills.forEach(el => el.offsetWidth); // force style flush before restoring transitions
    requestAnimationFrame(() => {
      newFills.forEach((el, i) => {
        const snap = barSnapshots[i];
        if (!snap) return;
        el.style.transition = '';
        el.style.width = targets[i] + '%';
        if (pctEls[i] && snap.pct !== null) animateNeedPct(pctEls[i], snap.pct, targets[i], 600);
      });
    });
  });
}

function animateNeedPct(el, from, to, duration) {
  const start = performance.now();
  const diff = to - from;
  function step(now) {
    const raw = Math.min((now - start) / duration, 1);
    const t = raw < 0.5 ? 2 * raw * raw : -1 + (4 - 2 * raw) * raw;
    el.textContent = Math.round(from + diff * t) + '%';
    if (raw < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

      // Dynamic memory slots: base = floor(effectiveINT+LOY / 15) ≥ 1, plus gear memory_slots bonuses

        <div class="gh-cat-top">
          ${renderCatFaceHtml(cs.breed, state, ci)}
          <div class="gh-cat-info">

          </div>
        </div>
        <div class="gh-needs">
          <div class="gh-need-block" data-need="hunger"><div class="gh-need-row"><span class="gh-need-lbl">Hunger</span><span class="gh-need-pct">${hPct}%${diffLabel(hDiff)}</span></div><div class="gh-need-bar">${barFill(hPct,hFrom,hCol)}</div></div>

          ${(() => {
            // ── ALLIES SECTION ──

            const _amiGear = equippedCards.reduce((s, g) =>
              s + (g.data?.effects || []).reduce((d, e) => e.stat === 'amicability' ? d + (parseInt(e.modifier) || 0) : d, 0), 0);
            const _affGear = equippedCards.reduce((s, g) =>
              s + (g.data?.effects || []).reduce((d, e) => e.stat === 'affection' ? d + (parseInt(e.modifier) || 0) : d, 0), 0);
            const _effAmi  = Math.min(100, (_aBase.amicability || 0) + _amiGear);
            const _effAff  = Math.min(100, (_aBase.affection   || 0) + _affGear);

              </div>

            </div>`;

      <button class="gh-item-remove" onclick="ghRemoveHomeItem(${itemIdx});event.stopPropagation()" title="Remove item">✕</button>
    </div>`;
  }).join('');
  const remainingItemSlots = Math.max(0, maxItemSlots - currentHomeLoad.usedSlots);
  const installableHomeItems = allItemCards.filter(c => {
    const used = homeItemUsage[c.id] || 0;
    return used < (ownedCounts[c.id] || 0) && getHomeSlotCost(c) <= remainingItemSlots;
  });

  // Home selector dropdown (only shown if player has 2+ home cards)
  const homeSelectorHtml = allHomeCards.length > 1 ? `
    <div class="gh-home-selector">
      <label class="gh-home-sel-lbl">${activeHomeEnv.icon} Select Home</label>
      <select class="gh-home-sel-drop" onchange="ghSwitchHome(this.value)">
        ${allHomeCards.map((hc, i) => `<option value="${i}" ${i===GH_ACTIVE_HOME_IDX?'selected':''}>${hc.name}</option>`).join('')}
      </select>
    </div>` : '';

  // Cat roster: show whenever cats are at this home
  const catRosterHtml = sbx.cats.length > 0 ? `
    <div class="gh-home-cats">
      ${sbx.cats.map((cs, _ri) => {
        const _care = getLiveCatState(_ri, cs);
        const _hPct = Math.round(Math.min(100, _care.hunger));

        const _ePct = Math.round(Math.min(100, _care.energy));
        const _emoji = (cs.breed && cs.breed.data && cs.breed.data.emoji) ? cs.breed.data.emoji : '🐱';
        const _catNameHtml = escapeAttr(getCatDisplayName(cs));
        const breedTraits = (cs.breed && cs.breed.data && cs.breed.data.home_dev_traits) || {};
        const traitLabel = breedTraits.label || '';
        const rates = computeEffectiveDevRates(cs, currentHomeItems);
        const rateChips = Object.entries(rates).filter(([,r]) => r !== 0).map(([stat, rph]) => {
          const per24 = +(rph * 24).toFixed(3);
          const sign = per24 >= 0 ? '+' : '';
          const cls = per24 >= 0 ? 'pos' : 'neg';
          return `<span class="gh-dev-rate ${cls}">${sign}${per24} ${stat.slice(0,3).toUpperCase()}/24h</span>`;

        const gains = computeHomeDev(cs, currentHomeItems);
        const gainChips = Object.entries(gains).filter(([,g]) => Math.abs(g) >= 0.01).map(([stat, g]) => {
          const rounded = +(g.toFixed(2));
          const whole = Math.floor(g);
          const sign = rounded >= 0 ? '+' : '';
          const applied = whole !== 0 ? ` (${whole >= 0 ? '+' : ''}${whole} applied)` : '';
          return `<span class="gh-dev-gain">${sign}${rounded} ${stat.slice(0,3).toUpperCase()}${applied}</span>`;

          return `<span class="gh-dev-mod${isSlow?' slow':''}">${hde.label}</span>`;

        const joined = cs.home_joined_at;
        let elapsedStr = '';
        if (joined) {
          const hrs = (Date.now() - joined) / 3600000;

    { icon:'🪄', name:'Specialty Apothecary', desc:'Unique potions, tonics, and enchantments for adventuring cats.', open:false },

  // ── INBOX TAB ──
  const inboxTabHtml = `<div class="gh-inbox">

    })).filter(entry => entry.card);
    const newestDeckEntries = [...allDeckEntries].sort((a, b) => b.deckIndex - a.deckIndex);
    const viewEntries = GH_CARD_FILTER.view === 'recent'
      ? newestDeckEntries.slice(0, Math.min(recentLimit, newestDeckEntries.length))
      : GH_CARD_FILTER.view === 'active'
        ? newestDeckEntries.filter(entry => activeCardIds.has(entry.card.id))
        : GH_CARD_FILTER.view === 'inactive'
          ? newestDeckEntries.filter(entry => !activeCardIds.has(entry.card.id))
          : newestDeckEntries;
    const filteredDeckEntries = viewEntries.filter(({ card }) => {
      const q = GH_CARD_FILTER.search;
      if (GH_CARD_FILTER.type !== 'all' && card.type !== GH_CARD_FILTER.type) return false;
      if (GH_CARD_FILTER.rarity !== 'all' && card.rarity !== GH_CARD_FILTER.rarity) return false;
      if (q && !card.name.toLowerCase().includes(q) &&
          !(card.description||'').toLowerCase().includes(q) &&
          !(card.series||'').toLowerCase().includes(q)) return false;
      return true;
    });
    const filteredDeckCards = filteredDeckEntries.map(entry => entry.card);
    const viewOptions = [
      ['recent', 'Recent Cards'],
      ['all', 'All Cards'],
      ['active', 'Active Cards'],
      ['inactive', 'Inactive Cards']
    ];
    const typeOptions = [
      ['all', 'All Types'],
      ['cat_breed', 'Cat Breeds'],
      ['home', 'Homes'],
      ['home_item', 'Items'],
      ['battle_gear', 'Gear'],
      ['special_ability', 'Abilities'],
      ['consumable', 'Consumables']
    ];
    const rarityOptions = ['all', ...RARITIES];
    const cardsGrid = filteredDeckEntries.map(({ card, deckIndex }) => {
      const isActive = activeCardIds.has(card.id);
      return `<div class="gh-card-cell">
        ${buildCardFaceHtml(card, { onclick: `openCardModal('${card.id}')`, standardLayout: true })}
        <div class="gh-card-meta">
          <span class="gh-card-badge ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span>
          ${GH_CARD_FILTER.view === 'recent' ? `<span class="gh-card-badge inactive">New #${deckIndex + 1}</span>` : ''}
          ${!isActive ? `<div class="gh-card-actions-row" onclick="event.stopPropagation()">
            <button class="gh-card-act-btn" onclick="openSendCardSheet('${card.id}')">📤 Send</button>
          </div>` : ''}
        </div>
      </div>`;
    }).join('');
    cardsTabHtml = `<div class="gh-cards-tab">
      <div class="gh-cards-header">
        <div>
          <div class="gh-cards-title">🃏 Your Cards</div>
          <div class="gh-cards-sub">${GH_CARD_FILTER.view === 'recent' ? 'Newest cards appear first after market buys and outside trips.' : 'Inactive cards can be traded or sent to other players.'}</div>
        </div>
        <div class="gh-card-count">${filteredDeckCards.length} / ${allDeckCards.length}</div>
      </div>
      <div class="gh-card-tools">
        <input class="gh-card-search" id="gh-card-search" type="text" placeholder="Search cards…" value="${escapeAttr(GH_CARD_FILTER.search)}" oninput="setGhCardFilter('search',this.value)">
        <select class="gh-card-filter" onchange="setGhCardFilter('view',this.value)">
          ${viewOptions.map(([value, label]) => `<option value="${value}"${GH_CARD_FILTER.view===value?' selected':''}>${label}</option>`).join('')}
        </select>
        <select class="gh-card-filter" onchange="setGhCardFilter('type',this.value)">
          ${typeOptions.map(([value, label]) => `<option value="${value}"${GH_CARD_FILTER.type===value?' selected':''}>${label}</option>`).join('')}
        </select>
        <select class="gh-card-filter" onchange="setGhCardFilter('rarity',this.value)">
          ${rarityOptions.map(value => `<option value="${value}"${GH_CARD_FILTER.rarity===value?' selected':''}>${value==='all'?'All Rarities':value[0].toUpperCase()+value.slice(1)}</option>`).join('')}
        </select>
      </div>
      ${filteredDeckCards.length
        ? `<div class="gh-card-grid">${cardsGrid}</div>`
        : `<div class="gh-empty">No cards match this view.</div>`}
    </div>`;
  }

  // ── TAB BODIES ──
  const tabBody = GH_TAB === 'home'   ? homeTabHtml
    : GH_TAB === 'inbox'  ? inboxTabHtml
    : GH_TAB === 'visits' ? visitsTabHtml

  gh.innerHTML = `
    <div class="gh-hdr">

      <div class="gh-hdr-right">
        ${foodCount > 0 ? `<span style="font-family:var(--fm);font-size:10px;color:var(--t2)">🥣 ×${foodCount}</span>` : ''}

    ${GH_TAB==='cats' ? `<div class="gh-cats-footer"><button class="gh-send-outside-btn" onclick="ghSendOutside()" ${!anyCatReady?'disabled':''}>🌿 Send Outside</button></div>` : ''}

// ── Radar chart ───────────────────────────────────────────────────────────────
const STAT_DESCS = {
  strength:     'Raw physical power. Determines damage dealt in encounters and how much gear your cat can carry.',
  speed:        'Reaction time and movement pace. Affects first-strike advantage and escape chance on bad runs.',
  agility:      'Nimbleness and body control. Reduces incoming hits and improves dodge rate during adventures.',
  stamina:      'Endurance over long distances. Slows energy drain outdoors and extends adventure duration.',
  intelligence: 'Puzzle-solving instinct. Raises rare item find chance and helps detect hidden loot caches.',
  stealth:      'Ability to move unseen. Unlocks ambush opportunities and sneaky-loot events on runs.',
  affection:    'Depth of emotional bond. Speeds up mood recovery when resting at home and reduces stress.',
  amicability:  'Friendliness toward other cats and strangers. Required for co-op runs and team bonuses.',
};
const STAT_LABELS = {strength:'STR',speed:'SPE',agility:'AGI',stamina:'STA',intelligence:'INT',stealth:'STE',affection:'AFF',amicability:'AMI'};

function showRadarTip(key, val, delta) {
  let tip = document.getElementById('gh-radar-tip-global');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'gh-radar-tip-global';
    tip.className = 'radar-tip';
    document.body.appendChild(tip);
  }
  const label = STAT_LABELS[key] || key.toUpperCase();
  const desc  = STAT_DESCS[key]  || '';
  const dStr  = delta > 0 ? `<span class="rtip-pos"> +${delta} from gear</span>`
              : delta < 0 ? `<span class="rtip-neg"> ${delta} from gear</span>` : '';
  tip.innerHTML = `<div class="rtip-name">${label} — ${val}${dStr}</div><div class="rtip-desc">${desc}</div>`;
  tip.style.display = 'block';
  if (tip._t) clearTimeout(tip._t);
  tip._t = null;
  // dismiss on next click/touch anywhere outside the tip
  function dismissRadarTip(e) {
    if (!tip.contains(e.target)) {
      tip.style.display = 'none';
      document.removeEventListener('click', dismissRadarTip, true);
      document.removeEventListener('touchend', dismissRadarTip, true);
    }
  }
  // defer so this click event doesn't immediately close it
  setTimeout(() => {
    document.addEventListener('click', dismissRadarTip, true);
    document.addEventListener('touchend', dismissRadarTip, true);
  }, 10);
}

function renderRadarSVG(effStats, baseStats, ci) {
  const STATS = [
    { key:'strength' }, { key:'speed' },    { key:'agility' },   { key:'stamina' },
    { key:'intelligence' }, { key:'stealth' }, { key:'affection' }, { key:'amicability' },
  ];
  const N = STATS.length;
  const cx = 110, cy = 110, R = 72;
  const maxVal = Math.max(25, ...STATS.map(s => effStats[s.key] || 0));

  const ang = i => (i / N) * 2 * Math.PI - Math.PI / 2;
  const pt  = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];
  const pStr = pts => pts.map(([x,y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');

  // Grid rings (3 levels)
  const rings = [0.33, 0.66, 1].map(f =>
    `<polygon points="${pStr(STATS.map((_,i)=>pt(i,R*f)))}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`
  ).join('');

  // Axis spokes
  const axes = STATS.map((_,i) => {
    const [x,y] = pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>`;
  }).join('');

  // Data polygon — stable ID for animation
  const dataPts = STATS.map((s,i) => {
    const frac = Math.min(effStats[s.key] || 0, maxVal) / maxVal;
    return pt(i, frac * R);
  });
  const polyId = ci !== undefined ? `id="gh-radar-poly-${ci}"` : '';

  // Labels + hit zones + vertex dots (stable IDs)
  const markup = STATS.map((s, i) => {
    const val   = effStats[s.key] || 0;
    const base  = baseStats[s.key] || 0;
    const delta = val - base;
    const frac  = Math.min(val, maxVal) / maxVal;
    const [vx, vy] = pt(i, frac * R);
    const [lx, ly] = pt(i, R + 20);
    const col = delta > 0 ? '#34D399' : delta < 0 ? '#F87171' : 'rgba(220,220,255,0.7)';
    const lbl = STAT_LABELS[s.key] || s.key.slice(0,3).toUpperCase();
    const dotId = ci !== undefined ? `id="gh-radar-dot-${ci}-${i}"` : '';
    return `<circle ${dotId} cx="${vx.toFixed(2)}" cy="${vy.toFixed(2)}" r="3" fill="#60a5fa" opacity="0.8"/>
<g onclick="showRadarTip('${s.key}',${val},${delta})" style="cursor:pointer">
  <circle cx="${lx.toFixed(2)}" cy="${ly.toFixed(2)}" r="15" fill="transparent"/>
  <text x="${lx.toFixed(2)}" y="${(ly-4).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="7.5" font-family="var(--fm,monospace)" font-weight="700" fill="${col}">${lbl}</text>
  <text x="${lx.toFixed(2)}" y="${(ly+5).toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="7" font-family="var(--fm,monospace)" fill="${col}" opacity="0.85">${val}</text>
</g>`;
  }).join('');

  return `<div class="radar-wrap">
  <svg viewBox="0 0 220 220" class="radar-svg" aria-label="Stat radar chart">
    ${rings}${axes}
    <polygon ${polyId} points="${pStr(dataPts)}" fill="rgba(96,165,250,0.14)" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round"/>
    ${markup}
  </svg>
</div>`;
}

// Radar polygon morphing animation helpers
function _parsePolyPts(str) {
  return str.trim().split(/\s+/).map(p => { const [x,y]=p.split(',').map(Number); return {x,y}; });
}
function _serializePolyPts(pts) {
  return pts.map(({x,y}) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
}
function animateRadarPoly(polyEl, dotEls, fromPts, toPts, dotFromPts, dotToPts, duration) {
  const start = performance.now();
  function step(now) {
    const raw = Math.min((now - start) / duration, 1);
    const t = raw < 0.5 ? 2*raw*raw : -1+(4-2*raw)*raw; // ease-in-out quad
    const interp = fromPts.map((f,i) => ({x: f.x+(toPts[i].x-f.x)*t, y: f.y+(toPts[i].y-f.y)*t}));
    polyEl.setAttribute('points', _serializePolyPts(interp));
    dotEls.forEach((d,i) => {
      if (!d || !dotFromPts[i] || !dotToPts[i]) return;
      d.setAttribute('cx', (dotFromPts[i].x + (dotToPts[i].x - dotFromPts[i].x)*t).toFixed(2));
      d.setAttribute('cy', (dotFromPts[i].y + (dotToPts[i].y - dotFromPts[i].y)*t).toFixed(2));
    });
    if (raw < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function cleanCatNickname(name) {

}

function ghNicknameCat(ci) {
  const cs = sbx.cats[ci]; if (!cs) return;

  const breedName = getCatBreedName(cs);

  const nickname = cleanCatNickname(entered);

  }

  renderGameHomeKeepScroll();

function ghSwitchHome(idx) {
  const player = PLAYER || {};
  const deckIds = (player.deckIds) || sbx.deck || [];
  const allHomeCards = deckIds.map(id => getCard(id)).filter(c => c && c.type === 'home');
  const newIdx = Math.min(parseInt(idx, 10) || 0, allHomeCards.length - 1);
  if (newIdx === GH_ACTIVE_HOME_IDX) return;

  // Save current home's roster before switching
  if (sbx.home && sbx.home.id) {
    if (!sbx.savedHomes) sbx.savedHomes = {};
    sbx.savedHomes[sbx.home.id] = {
      cats:      JSON.parse(JSON.stringify(sbx.cats || [])),
      homeItems: JSON.parse(JSON.stringify(sbx.homeItems || []))
    };
  }

  GH_ACTIVE_HOME_IDX = newIdx;
  const selected = allHomeCards[GH_ACTIVE_HOME_IDX];
  if (selected) {
    sbx.home = selected;
    // Restore this home's saved roster, or start fresh
    const saved = (sbx.savedHomes || {})[selected.id];
    if (saved) {
      sbx.cats      = saved.cats.slice(0, selected.data.max_occupants || 0);
      sbx.homeItems = saved.homeItems || [];
      normalizeHomeItemsForSlots(selected.data.expansion_slots || 0);
    } else {
      sbx.cats      = [];
      sbx.homeItems = [];
    }
  }
  savePlayer();
  renderGameHome();
}

function ghAddCatAssign(cardId) {
  const card = getCard(cardId);
  if (!card) return;
  const maxCats = sbx.home ? (sbx.home.data.max_occupants || 0) : 0;
  const deckIds = (PLAYER && PLAYER.deckIds) || sbx.deck || [];
  const ownedCounts = getOwnedCardCounts(deckIds);
  const catUsage = getHomeUsageCounts().cat_breed;
  if ((catUsage[cardId] || 0) >= (ownedCounts[cardId] || 0)) {
    showCareToast('That cat is already active in another home.');
    return;
  }
  if ((sbx.cats || []).length < maxCats) {
    sbx.cats = sbx.cats || [];
    sbx.cats.push({ breed: card, gear: [], abilities: [], home_joined_at: Date.now(), home_dev_gains: {}, rep: 100, allies: [] });
  }
  savePlayer();
  renderGameHome();
}

function ghShowAddHomeItem() {
  const picker = document.getElementById('gh-home-item-picker');
  if (!picker) return;
  if (picker.style.display !== 'none') { picker.style.display = 'none'; return; }
  const activeHome = cardObjOf(sbx.home);
  if (!activeHome) return;
  const maxSlots = activeHome.data ? (activeHome.data.expansion_slots || 0) : 0;
  const { usedSlots } = normalizeHomeItemsForSlots(maxSlots);
  const remainingSlots = Math.max(0, maxSlots - usedSlots);
  const deckIds = (PLAYER && PLAYER.deckIds) || sbx.deck || [];
  const ownedCounts = getOwnedCardCounts(deckIds);
  const itemUsage = getHomeUsageCounts().home_item;
  const available = uniqueCards(deckIds.map(entry => cardObjOf(entry)).filter(c =>
    c && c.type === 'home_item' &&
    getHomeSlotCost(c) <= remainingSlots &&
    (itemUsage[c.id] || 0) < (ownedCounts[c.id] || 0)
  ));
  picker.innerHTML = available.length ? available.map(c => `
    <div class="gh-item-row clickable" onclick="ghAddHomeItemAssign('${c.id}')">
      <span style="font-size:20px">📦</span>
      <div style="flex:1">
        <div class="gh-item-name">${c.name}</div>
        <div class="gh-item-desc">${getHomeSlotCost(c)} slot${getHomeSlotCost(c) === 1 ? '' : 's'}</div>

  picker.style.display = 'flex';
}

function ghAddHomeItemAssign(cardId) {
  const card = getCard(cardId);
  const activeHome = cardObjOf(sbx.home);
  if (!card || !activeHome) return;
  const maxSlots = activeHome.data ? (activeHome.data.expansion_slots || 0) : 0;
  const { usedSlots } = normalizeHomeItemsForSlots(maxSlots);
  if (usedSlots + getHomeSlotCost(card) > maxSlots) {
    showCareToast('That item does not fit this home.');
    return;
  }
  const deckIds = (PLAYER && PLAYER.deckIds) || sbx.deck || [];
  const ownedCounts = getOwnedCardCounts(deckIds);
  const itemUsage = getHomeUsageCounts().home_item;
  if ((itemUsage[cardId] || 0) >= (ownedCounts[cardId] || 0)) {
    showCareToast('That item is already active in another home.');
    return;
  }
  sbx.homeItems = [...(sbx.homeItems || []), card];
  savePlayer();
  renderGameHome();
}

function ghEquipAbility(ci, cardId, evt) {
  if (evt) evt.stopPropagation();
  const cs = sbx.cats[ci]; if (!cs) return;
  if (!cs.abilities) cs.abilities = [];
  // Normalize to string IDs
  cs.abilities = cs.abilities.map(a => typeof a === 'string' ? a : a?.id).filter(Boolean);
  if (cs.abilities.includes(cardId)) {
    // Remove (unassign)
    cs.abilities = cs.abilities.filter(id => id !== cardId);
  } else {
    const deckIds = (PLAYER && PLAYER.deckIds) || sbx.deck || [];
    const ownedCounts = getOwnedCardCounts(deckIds);
    const abilityUsage = getHomeUsageCounts().special_ability;
    if ((abilityUsage[cardId] || 0) >= (ownedCounts[cardId] || 0)) {
      showCareToast('That ability is already active in another home.');
      return;
    }
    // Assign — check memory slot limit (max 2 total)
    const card = getCard(cardId);
    if (!card) return;
    const usedSlots = cs.abilities.reduce((s, id) => {
      const c = getCard(id); return s + (c && c.data ? (c.data.memory_slots_required || 1) : 1);
    }, 0);
    const needed = card.data ? (card.data.memory_slots_required || 1) : 1;
    // Compute total slots dynamically (same logic as render)
    const _gearObjs = (cs.gear || []).map(g => typeof g === 'string' ? getCard(g) : g).filter(Boolean);
    const _bs = (cs.breed && cs.breed.data && cs.breed.data.stats) ? cs.breed.data.stats : {};
    const _il = _gearObjs.reduce((s, g) => s + (g.data?.effects||[]).reduce((d,e)=>(e.stat==='intelligence'||e.stat==='loyalty')?d+(parseInt(e.modifier)||0):d, 0), (_bs.intelligence||0)+(_bs.loyalty||0));
    const _totalSlots = Math.max(1, Math.floor(_il / 15)) + _gearObjs.reduce((s,g)=>s+(g.data?.effects||[]).reduce((ss,e)=>e.stat==='memory_slots'?ss+(parseInt(e.modifier)||0):ss,0),0);
    if (usedSlots + needed > _totalSlots) return; // no slots — guard
    cs.abilities.push(cardId);
  }
  GH_OPEN_ABILITY.add(ci);
  savePlayer();
  renderGameHomeKeepScroll();
}

function ghEquipGear(ci, cardId, evt) {
  if (evt) evt.stopPropagation(); // prevent <details> from toggling
  const cs = sbx.cats[ci]; if (!cs) return;

  // Snapshot old radar polygon & dots before re-render
  const oldPoly = document.getElementById(`gh-radar-poly-${ci}`);
  const oldPts  = oldPoly ? _parsePolyPts(oldPoly.getAttribute('points') || '') : null;
  const N_STATS = 8;
  const oldDotEls  = Array.from({length: N_STATS}, (_,j) => document.getElementById(`gh-radar-dot-${ci}-${j}`));
  const oldDotPts  = oldDotEls.map(d => d ? {x: parseFloat(d.getAttribute('cx')), y: parseFloat(d.getAttribute('cy'))} : null);

  if (!cs.gear) cs.gear = [];
  // Normalize to string IDs (gear may have been stored as card objects)
  cs.gear = cs.gear.map(g => typeof g === 'string' ? g : g?.id).filter(Boolean);
  normalizeCatGearForSlots(cs);
  if (cs.gear.includes(cardId)) {
    cs.gear = cs.gear.filter(id => id !== cardId);
  } else {
    const deckIds = (PLAYER && PLAYER.deckIds) || sbx.deck || [];
    const ownedCounts = getOwnedCardCounts(deckIds);
    const gearUsage = getHomeUsageCounts().battle_gear;
    if ((gearUsage[cardId] || 0) >= (ownedCounts[cardId] || 0)) {
      showCareToast('That gear is already active in another home.');
      return;
    }
    const card = getCard(cardId);
    if (!card) return;
    const usedSlots = getCatUsedCarrySlots(cs.gear);
    const neededSlots = getGearSlotCost(card);
    const maxSlots = getCatCarrySlots(cs);
    if (usedSlots + neededSlots > maxSlots) {
      showCareToast(`Not enough carry slots: ${usedSlots}/${maxSlots} used.`);
      return;
    }
    cs.gear.push(cardId);
  }
  GH_OPEN_GEAR.add(ci); // keep dropdown open after equip/unequip
  savePlayer();
  renderGameHomeKeepScroll();

  // Animate radar from old shape → new shape (runs after rAF in renderGameHomeKeepScroll)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (oldPts && oldPts.length) {
      const newPoly = document.getElementById(`gh-radar-poly-${ci}`);
      const newDotEls = Array.from({length: N_STATS}, (_,j) => document.getElementById(`gh-radar-dot-${ci}-${j}`));
      if (newPoly) {
        const newPts = _parsePolyPts(newPoly.getAttribute('points') || '');
        const newDotPts = newDotEls.map(d => d ? {x: parseFloat(d.getAttribute('cx')), y: parseFloat(d.getAttribute('cy'))} : null);
        newPoly.setAttribute('points', _serializePolyPts(oldPts));
        newDotEls.forEach((d, j) => {
          if (d && oldDotPts[j]) { d.setAttribute('cx', oldDotPts[j].x); d.setAttribute('cy', oldDotPts[j].y); }
        });
        animateRadarPoly(newPoly, newDotEls, oldPts, newPts, oldDotPts, newDotPts, 420);
      }
    }
  }));
}

async function confirmSendCard(cardId) {
  const input   = document.getElementById('send-card-callsign');
  const errEl   = document.getElementById('send-card-err');
  const btn     = document.getElementById('send-card-btn');
  const callsign = (input?.value || '').trim();
  if (errEl) errEl.style.display = 'none';
  if (!callsign) { if (errEl) { errEl.textContent = 'Enter a callsign.'; errEl.style.display = ''; } return; }
  if (!db || !CZ_USER) { if (errEl) { errEl.textContent = 'You must be signed in to send cards.'; errEl.style.display = ''; } return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  const { error } = await db.rpc('send_cards_to_player', { p_card_ids: [cardId], p_recipient_callsign: callsign });
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
    if (errEl) {
      errEl.textContent = error.code === 'P0002' ? 'No player found with that callsign.' : (error.message || 'Send failed — try again.');
      errEl.style.display = '';
    }
    return;
  }

  // The RPC already wrote the sender's row directly — reconcile local
  // state now so a later unrelated savePlayer() doesn't re-upload a
  // stale PLAYER/sbx blob and resurrect the card we just sent away.
  if (PLAYER && PLAYER.deckIds) PLAYER.deckIds = PLAYER.deckIds.filter(id => id !== cardId);
  sbx.deck = (sbx.deck || []).filter(entry => (typeof entry === 'string' ? entry : entry?.id) !== cardId);

  dismissCarePopup();
  showCareToast(`📤 Sent to ${callsign}!`);
  renderGameHome();
}

// Horizontal scroll guard — prevents accidental wake on swipe
(function() {

  document.addEventListener('touchstart', e => { _tx0 = e.touches[0].clientX; _GH_TOUCH_MOVED = false; }, {passive:true});
  document.addEventListener('touchmove',  e => { if (Math.abs(e.touches[0].clientX - _tx0) > 8) _GH_TOUCH_MOVED = true; }, {passive:true});

// Long-press / long-click on [data-peek-card] elements to open the full card modal
(function() {
  let _peekTimer = null;
  let _peekOpened = false;
  let _peekStartX = 0;
  let _peekStartY = 0;

  function startPeek(cardId, x, y) {
    _peekOpened = false;
    _peekStartX = x;
    _peekStartY = y;
    _peekTimer = setTimeout(() => {
      _peekTimer = null;
      _peekOpened = true;
      openCardModal(cardId, { peekOnly: true });
    }, 480);
  }

  function cancelPeek() {
    if (_peekTimer) { clearTimeout(_peekTimer); _peekTimer = null; }
  }

  // ── Touch ──
  document.addEventListener('touchstart', e => {
    const chip = e.target.closest('[data-peek-card]');
    if (!chip || !chip.dataset.peekCard) return;
    startPeek(chip.dataset.peekCard, e.touches[0].clientX, e.touches[0].clientY);
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if (!_peekTimer) return;
    if (Math.abs(e.touches[0].clientY - _peekStartY) > 10) cancelPeek();
  }, {passive: true});

  document.addEventListener('touchend', e => {
    cancelPeek();
    if (_peekOpened) { _peekOpened = false; e.preventDefault(); }
  }, {passive: false});

  document.addEventListener('touchcancel', () => {
    cancelPeek(); _peekOpened = false;
  }, {passive: true});

  // ── Mouse (desktop long-click) ──
  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return; // left button only
    const chip = e.target.closest('[data-peek-card]');
    if (!chip || !chip.dataset.peekCard) return;
    startPeek(chip.dataset.peekCard, e.clientX, e.clientY);
  });

  document.addEventListener('mousemove', e => {
    if (!_peekTimer) return;
    if (Math.abs(e.clientX - _peekStartX) > 6 || Math.abs(e.clientY - _peekStartY) > 6) cancelPeek();
  });

  document.addEventListener('mouseup', e => {
    cancelPeek();
    // If long-press opened the modal, eat the click so it doesn't toggle equip/keep
    if (_peekOpened) {
      _peekOpened = false;
      e.stopPropagation();
    }
  }, true); // capture phase so we beat onclick handlers
})();

  const ready = getReadyCatIndices();
  if (!ready.length) {
    const { reason } = sbx.cats[0] ? canCatGoOutside(0, sbx.cats[0]) : { reason:null };
    showCareToast('😴 ' + (reason || 'No cats are ready to go outside'));
    return;
  }
  OUTING_SELECTED = new Set(ready);
  const ov = document.getElementById('outing-picker-ov');
  if (ov) ov.style.display = 'flex';
  renderOutingPicker();

function closeOutingPicker() {
  const ov = document.getElementById('outing-picker-ov');

}

function toggleOutingCat(ci) {
  if (!sbx.cats[ci] || !canCatGoOutside(ci, sbx.cats[ci]).canGo) return;
  if (OUTING_SELECTED.has(ci)) OUTING_SELECTED.delete(ci);
  else OUTING_SELECTED.add(ci);
  renderOutingPicker();
}

async function confirmOutingSelection() {
  const selected = [...OUTING_SELECTED].filter(ci => sbx.cats[ci] && canCatGoOutside(ci, sbx.cats[ci]).canGo);
  if (!selected.length) {
    showCareToast('Select at least one ready cat');
    renderOutingPicker();
    return;
  }
  if (PLAYER) {
    sbx.deck  = [...(PLAYER.deckIds || [])];
    sbx.coins = PLAYER.coins;
  }

  // Convert gear IDs to card objects for run calculations. Abilities can stay
  // as IDs because getEffectiveStats resolves them through getCard().
  sbx.cats = sbx.cats.map(cs => ({
    ...cs,
    gear: (cs.gear || []).map(g => typeof g === 'string' ? getCard(g) : g).filter(Boolean)
  }));

  const started = await startRun(selected);
  if (!started) return;
  closeOutingPicker();
  if (GAME_CARE_TIMER) { clearInterval(GAME_CARE_TIMER); GAME_CARE_TIMER = null; }
}

function savePlayer() {
  if (!PLAYER) return;
  PLAYER.coins = sbx.coins;
  syncConsumableDeckCopies(PLAYER);
  try { localStorage.setItem('cz_player', JSON.stringify(PLAYER)); } catch(e) {}
  savePlayerToCloud();
}

function buildGameState() {
  return {
    player: PLAYER,
    cats:   sbx.cats,
    deck:   sbx.deck,
    coins:  sbx.coins,
    home:   sbx.home || null,
    homeItems: sbx.homeItems || [],
    savedHomes: sbx.savedHomes || {},
    activeHomeIdx: GH_ACTIVE_HOME_IDX
  };
}

async function savePlayerToCloud() {
  if (!db || !CZ_USER || !PLAYER) return;
  const state = buildGameState();
  const wins   = (PLAYER.stats && PLAYER.stats.wins)   || 0;
  const losses = (PLAYER.stats && PLAYER.stats.losses) || 0;
  const runs   = (PLAYER.stats && PLAYER.stats.runs)   || 0;
  try {
    await db.from('players').upsert({
      id:         CZ_USER.id,
      callsign:   PLAYER.name,
      coins:      sbx.coins,
      wins, losses, runs,
      game_state: state,
      updated_at: new Date().toISOString()
    }, { onConflict: 'id' });
  } catch(e) { /* silently ignore cloud errors — game continues */ }
}

async function loadPlayerFromCloud(userId) {
  if (!db || !userId) return false;
  try {
    const { data, error } = await db.from('players').select('*').eq('id', userId).single();
    if (error || !data || !data.game_state) return false;
    const gs = data.game_state;
    PLAYER    = gs.player || null;
    sbx.cats  = gs.cats   || [];
    sbx.deck  = gs.deck   || [];
    sbx.coins = gs.coins  || 1500;
    sbx.home  = gs.home   || null;
    sbx.homeItems = gs.homeItems || [];
    sbx.savedHomes = gs.savedHomes || {};
    GH_ACTIVE_HOME_IDX = gs.activeHomeIdx || 0;
    if (PLAYER) {
      PLAYER.coins = sbx.coins;
      PLAYER.cardSerials = PLAYER.cardSerials || {}; // older saves predate limited editions
    }
    try { localStorage.setItem('cz_player', JSON.stringify(PLAYER)); } catch(e) {}
    return true;
  } catch(e) { return false; }
}

   MARKET
══════════════════════════════════════════ */
let MARKET_TAB = 'food';

const MARKET_CONSUMABLES = CONSUMABLE_CARDS.map(c => ({
  ...c.data,
  id:c.id,
  name:c.name,
  icon:c.icon,
  type:c.data.consumable_type,
  cost:c.coin_cost,
  desc:c.description
}));

function showMarket() {
  document.getElementById('market-ov').style.display = 'flex';
  renderMarket();
}

function closeMarket() {
  document.getElementById('market-ov').style.display = 'none';
  renderGameHome();
}

function setMarketTab(tab) { MARKET_TAB = tab; renderMarket(); }

function renderMarket() {
  const mkt = document.getElementById('market-ov'); if (!mkt) return;
  if (PLAYER) syncConsumableDeckCopies(PLAYER);
  const coins  = PLAYER ? PLAYER.coins : sbx.coins;
  const inv    = (PLAYER && PLAYER.inventory) || {};
  const deckIds = new Set((PLAYER && PLAYER.deckIds) || []);
  const marketDiscount = getMarketplaceDiscount();

  const tabDefs = [
    { id:'food',  label:'🥣 Consumables' },
    { id:'items', label:'🧸 Home Items' },
    { id:'gear',  label:'⚔️ Battle Gear' },
    { id:'homes', label:'🏠 Homes' },
  ];
  const tabsHtml = tabDefs.map(t =>
    `<button class="mkt-tab${MARKET_TAB===t.id?' active':''}" onclick="setMarketTab('${t.id}')">${t.label}</button>`
  ).join('');

  let gridHtml = '';
  if (MARKET_TAB === 'food') {
    gridHtml = CONSUMABLE_CARDS.map(item => {
      const qty  = inv[item.id] || 0;
      const price = getMarketPrice(item);
      const can  = coins >= price;
      const effs = formatConsumableEffects(item).map(e => `<span class="mkt-card-eff">${e}</span>`).join('');
      return `<div class="mkt-card" onclick="openCardModal('${item.id}')">
        <div class="mkt-card-art">${item.icon || TYPE_META.consumable.emoji}</div>
        <div class="mkt-card-body">
          <div class="mkt-card-name">${item.name}</div>
          <div class="mkt-card-rar" style="color:${RAR_COLOR[item.rarity] || 'var(--acc2)'}">${item.rarity.toUpperCase()} CONSUMABLE</div>
          <div class="mkt-card-desc">${item.description}</div>
          <div class="mkt-card-effects">${effs}</div>
        </div>
        <div class="mkt-card-foot" onclick="event.stopPropagation()">
          <div class="mkt-card-price">${marketPriceHtml(item)}</div>
          ${qty > 0 ? `<span class="mkt-qty-badge">${qty} use${qty === 1 ? '' : 's'}</span>` : ''}
          <button class="mkt-buy-btn"${!can?' disabled':''} onclick="buyConsumable('${item.id}')">Buy</button>
        </div>
      </div>`;
    }).join('');
  } else {
    const typeMap = { items:'home_item', gear:'battle_gear', homes:'home' };
    const t       = typeMap[MARKET_TAB];
    const items   = getLibrary().filter(c => isOwnableCard(c) && c.type === t && (c.coin_cost||0) > 0);
    if (!items.length) {
      gridHtml = `<div class="mkt-empty">Nothing here yet.</div>`;
    } else {
      gridHtml = items.map(card => {
        const owned  = deckIds.has(card.id);
        const price  = getMarketPrice(card);
        const can    = coins >= price;
        const rc     = RAR_COLOR[card.rarity] || 'var(--t3)';
        const ticon  = TYPE_META[card.type] ? TYPE_META[card.type].icon : '📦';
        const effs   = (card.data && card.data.effects || []).slice(0,4).map(e =>
          `<span class="mkt-card-eff">${e.stat.slice(0,3).toUpperCase()} ${e.modifier}</span>`).join('');
        const stats  = (card.data && card.data.stats) ? Object.entries(card.data.stats).slice(0,4).map(([k,v])=>
          `<span class="mkt-card-eff">${k.slice(0,3).toUpperCase()} ${v}</span>`).join('') : '';
        return `<div class="mkt-card" style="border-color:color-mix(in srgb,${rc} 45%,transparent);background:color-mix(in srgb,${rc} 8%,var(--s1));${owned?'opacity:.6':''}" onclick="openCardModal('${card.id}')">
          <div class="mkt-card-art" style="background:linear-gradient(135deg,color-mix(in srgb,${rc} 25%,var(--s3)),color-mix(in srgb,${rc} 6%,var(--s2)))">${ticon}</div>
          <div class="mkt-card-body">
            <div class="mkt-card-name">${card.name}</div>
            <div class="mkt-card-rar" style="color:${rc}">${card.rarity.toUpperCase()}</div>
            <div class="mkt-card-desc">${card.description||''}</div>
            ${effs||stats ? `<div class="mkt-card-effects">${effs||stats}</div>` : ''}
          </div>
          <div class="mkt-card-foot" onclick="event.stopPropagation()">
            <div class="mkt-card-price">${marketPriceHtml(card)}</div>
            ${owned
              ? `<span class="mkt-owned">Owned</span>`
              : `<button class="mkt-buy-btn"${!can?' disabled':''} onclick="buyCard('${card.id}')">${can?'Buy':'Need coins'}</button>`
            }
          </div>
        </div>`;
      }).join('');
    }
  }

  mkt.innerHTML = `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="closeMarket()">← Home</button>
      <span class="mkt-title">🏪 Market</span>
      ${marketDiscount ? `<span class="mkt-discount">Miso -${Math.round(marketDiscount * 100)}%</span>` : ''}
      <span class="mkt-coins">🪙 <span id="mkt-coin-num">${coins}</span></span>
    </div>
    <div class="mkt-tabs">${tabsHtml}</div>
    <div class="mkt-body"><div class="mkt-grid">${gridHtml}</div></div>`;
}

function buyConsumable(itemId) {
  const item = getCard(itemId);
  if (!item || !PLAYER) return;
  if (!isOwnableCard(item)) return;
  const price = getMarketPrice(item);
  if (PLAYER.coins < price) { showCareToast('Not enough coins! 🪙'); return; }
  PLAYER.coins -= price;
  sbx.coins = PLAYER.coins;
  if (!PLAYER.inventory) PLAYER.inventory = {};
  PLAYER.inventory[itemId] = (PLAYER.inventory[itemId]||0) + ((item.data && item.data.max_uses) || 1);
  PLAYER.deckIds = [...(PLAYER.deckIds || []), itemId];
  sbx.deck = [...(sbx.deck || []), itemId];
  savePlayer();
  showCareToast(`${item.icon || TYPE_META.consumable.emoji} Bought ${item.name}!`);
  renderMarket();
}

function buyCard(cardId) {
  if (!PLAYER) return;
  const card = getCard(cardId);
  if (!isOwnableCard(card)) return;
  const cost = getMarketPrice(card);
  if (PLAYER.coins < cost) { showCareToast('Not enough coins! 🪙'); return; }
  if ((PLAYER.deckIds||[]).includes(cardId)) { showCareToast('Already owned!'); return; }
  PLAYER.coins -= cost;
  sbx.coins = PLAYER.coins;
  PLAYER.deckIds = [...(PLAYER.deckIds||[]), cardId];
  if (card && !sbx.deck.find(c => c.id === cardId)) sbx.deck.push(cardId);
  savePlayer();
  showCareToast(`${card ? card.name : 'Card'} added to deck! ✨`);
  renderMarket();
}

/* ══════════════════════════════════════════
   TRADE CENTER — Sell / Buy / Trade
   Sell and Trade share one card-picker grid (tcCardPicker*); Send (in
   the Cards tab) lives separately in openSendCardSheet/confirmSendCard.
   Every mutating action here goes through a SECURITY DEFINER RPC that
   already writes the authoritative row(s) server-side — after a
   successful call we just reconcile local PLAYER/sbx state to match,
   we don't call savePlayer() again (that would just re-upload the same
   state we already reconciled).
══════════════════════════════════════════ */
function openTradeCenter() {
  TC_VIEW = 'menu';
  TC_SELECTED = new Set();
  TC_FILTER = { search:'', type:'all', rarity:'all' };
  document.getElementById('trade-ov').style.display = 'flex';
  renderTradeCenter();
}
function closeTradeCenter() {
  document.getElementById('trade-ov').style.display = 'none';
  renderGameHome();
}
function tcShowMenu()  { TC_VIEW = 'menu';  TC_SELECTED = new Set(); renderTradeCenter(); }
function tcShowSell()  { TC_VIEW = 'sell';  TC_SELECTED = new Set(); renderTradeCenter(); }
function tcShowTrade() { TC_VIEW = 'trade'; TC_SELECTED = new Set(); renderTradeCenter(); }
function tcShowBuy()   { TC_VIEW = 'buy';   TC_SELECTED = new Set(); renderTradeCenter(); tcLoadListings(); }

function tcSetFilter(key, val) { TC_FILTER[key] = val; renderTradeCenter(); }

// Patches the selected card's badge/ring and the bulk bar in place —
// no full re-render, so scrolling down and selecting a card doesn't
// blow away scroll position the way replacing .trade-ov's innerHTML would.
function tcToggleSelect(cardId) {
  if (TC_SELECTED.has(cardId)) {
    TC_SELECTED.delete(cardId);
  } else {
    if (TC_SELECTED.size >= 10) { showCareToast('You can only pick up to 10 cards at a time.'); return; }
    TC_SELECTED.add(cardId);
  }
  const sel = TC_SELECTED.has(cardId);
  const cell = document.querySelector(`.trd-pickable[data-peek-card="${cardId}"]`);
  if (cell) {
    cell.classList.toggle('trd-selected', sel);
    const badge = cell.querySelector('.gh-card-badge');
    if (badge) {
      badge.textContent = sel ? '✓ Selected' : 'Tap to select';
      badge.classList.toggle('active', sel);
      badge.classList.toggle('inactive', !sel);
    }
  }
  const countEl = document.getElementById('trd-bulk-count');
  if (countEl) countEl.textContent = `${TC_SELECTED.size} / 10 selected`;
  const actionBtn = document.getElementById('trd-bulk-action-btn');
  if (actionBtn) actionBtn.disabled = TC_SELECTED.size === 0;
}

// Only inactive cards can be sold/traded — same rule as the Cards tab's Send.
function tcGetInactiveDeckCards() {
  const player = PLAYER || {};
  const deckIds = (player.deckIds) || sbx.deck || [];
  const activeCardIds = getActiveCardIds();
  return deckIds
    .map(entry => typeof entry === 'string' ? getCard(entry) : entry)
    .filter(Boolean)
    .filter(card => !activeCardIds.has(card.id));
}

function tcFilterCards(cards) {
  const q = TC_FILTER.search.toLowerCase();
  return cards.filter(card => {
    if (TC_FILTER.type !== 'all' && card.type !== TC_FILTER.type) return false;
    if (TC_FILTER.rarity !== 'all' && card.rarity !== TC_FILTER.rarity) return false;
    if (q && !card.name.toLowerCase().includes(q) && !(card.description||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function tcCardPickerToolbarHtml() {
  const typeOptions = [['all','All Types'],['cat_breed','Cat Breeds'],['home','Homes'],['home_item','Items'],['battle_gear','Gear'],['special_ability','Abilities']];
  const rarityOptions = ['all', ...RARITIES];
  return `<div class="gh-card-tools">
    <input class="gh-card-search" type="text" placeholder="Search cards…" value="${escapeAttr(TC_FILTER.search)}" oninput="tcSetFilter('search', this.value)">
    <select class="gh-card-filter" onchange="tcSetFilter('type', this.value)">
      ${typeOptions.map(([v,l]) => `<option value="${v}"${TC_FILTER.type===v?' selected':''}>${l}</option>`).join('')}
    </select>
    <select class="gh-card-filter" onchange="tcSetFilter('rarity', this.value)">
      ${rarityOptions.map(v => `<option value="${v}"${TC_FILTER.rarity===v?' selected':''}>${v==='all'?'All Rarities':v[0].toUpperCase()+v.slice(1)}</option>`).join('')}
    </select>
  </div>`;
}

function tcCardPickerGridHtml() {
  const cards = tcFilterCards(tcGetInactiveDeckCards());
  if (!cards.length) return `<div class="gh-empty">No eligible cards. Active cards can't be sold or traded.</div>`;
  const grid = cards.map(card => {
    const sel = TC_SELECTED.has(card.id);
    return `<div class="gh-card-cell trd-pickable${sel?' trd-selected':''}" data-peek-card="${card.id}" onclick="tcToggleSelect('${card.id}')">
      ${buildCardFaceHtml(card, { standardLayout: true })}
      <div class="gh-card-meta">
        <span class="gh-card-badge ${sel ? 'active' : 'inactive'}">${sel ? '✓ Selected' : 'Tap to select'}</span>
      </div>
    </div>`;
  }).join('');
  // .gh-cards-tab defines --gh-card-w (the responsive column width the
  // Cards tab uses) — without this wrapper the grid falls back to one
  // oversized column per row.
  return `<div class="gh-cards-tab"><div class="gh-card-grid">${grid}</div></div>`;
}

function renderTradeCenter() {
  const ov = document.getElementById('trade-ov');
  if (!ov || ov.style.display === 'none') return;
  ov.innerHTML = TC_VIEW === 'sell' ? tcRenderSell()
    : TC_VIEW === 'buy' ? tcRenderBuy()
    : TC_VIEW === 'trade' ? tcRenderTrade()
    : TC_VIEW === 'respond' ? tcRenderRespond()
    : tcRenderMenu();
}

function tcRenderMenu() {
  const coins = PLAYER ? PLAYER.coins : sbx.coins;
  return `
    <div class="mkt-hdr">
      <button class="mkt-back" onclick="closeTradeCenter()">← Home</button>
      <span class="mkt-title">🤝 Trade Center</span>
      <span class="mkt-coins">🪙 ${coins}</span>
    </div>
    <div class="mkt-body">
      <div class="trd-menu">
        <button class="trd-menu-card" onclick="tcShowSell()">
          <div class="trd-menu-icon">💰</div>
          <div class="trd-menu-name">Sell</div>
          <div class="trd-menu-desc">Sell your cards to the market for coins.</div>
        </button>
        <button class="trd-menu-card" onclick="tcShowBuy()">
          <div class="trd-menu-icon">🛍️</div>
          <div class="trd-menu-name">Buy</div>
          <div class="trd-menu-desc">Buy cards from special limited-time listings.</div>
        </button>
        <button class="trd-menu-card" onclick="tcShowTrade()">
          <div class="trd-menu-icon">🔄</div>

          <div class="trd-menu-desc">Offer up to 10 cards to another player.</div>
        </button>
      </div>
